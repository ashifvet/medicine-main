<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Disease Details &mdash; Veterinary Reference Catalog</title>
<style>
  :root{
    --ink:#1c2b28;
    --paper:#f6f4ee;
    --panel:#ffffff;
    --line:#dedad0;
    --teal:#1f6f66;
    --teal-deep:#144840;
    --clay:#b5652f;
    --muted:#6b6f6a;
    --highlight:#fce8a8;
    --red:#b91c1c;
    --red-light:#fee2e2;
    --amber:#b7791f;
    --amber-light:#fdf1dc;
    --green:#1f7a4d;
    --green-light:#e2f5ea;
    --mono: 'JetBrains Mono', 'Courier New', monospace;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;
    font-family: 'Georgia', 'Iowan Old Style', serif;
    background:var(--paper);
    color:var(--ink);
    display:flex;
    flex-direction:column;
  }
  header{
    padding:22px 28px 16px;
    border-bottom:1px solid var(--line);
    background:var(--panel);
    display:flex;
    align-items:baseline;
    gap:16px;
    flex-wrap:wrap;
  }
  header h1{
    font-family: 'Helvetica Neue', Arial, sans-serif;
    font-weight:700;
    letter-spacing:-0.02em;
    font-size:22px;
    margin:0;
    color:var(--teal-deep);
  }
  header .count{
    font-family: 'Helvetica Neue', Arial, sans-serif;
    font-size:12.5px;
    color:var(--muted);
    text-transform:uppercase;
    letter-spacing:0.08em;
  }
  .layout{
    flex:1;
    display:flex;
    min-height:0;
  }
  .sidebar{
    width:340px;
    min-width:280px;
    border-right:1px solid var(--line);
    background:var(--panel);
    display:flex;
    flex-direction:column;
    min-height:0;
  }
  .search-wrap{
    padding:14px;
    border-bottom:1px solid var(--line);
  }
  .search-wrap input{
    width:100%;
    padding:10px 12px;
    font-size:14.5px;
    font-family: 'Helvetica Neue', Arial, sans-serif;
    border:1.5px solid var(--line);
    border-radius:7px;
    background:var(--paper);
    color:var(--ink);
    outline:none;
    transition:border-color .15s;
  }
  .search-wrap input:focus{ border-color:var(--teal); }
  .search-meta{
    font-family:'Helvetica Neue', Arial, sans-serif;
    font-size:11.5px;
    color:var(--muted);
    margin-top:7px;
    display:flex;
    justify-content:space-between;
  }
  .az-nav{
    display:flex;
    flex-wrap:wrap;
    gap:2px;
    padding:10px 12px;
    border-bottom:1px solid var(--line);
    font-family:'Helvetica Neue', Arial, sans-serif;
  }
  .az-nav button{
    border:none;
    background:none;
    font-size:11.5px;
    font-weight:600;
    color:var(--muted);
    width:20px;
    height:20px;
    cursor:pointer;
    border-radius:4px;
  }
  .az-nav button:hover{ background:var(--highlight); color:var(--ink); }
  .az-nav button.disabled{ color:#cfcbc0; cursor:default; }
  .az-nav button.disabled:hover{ background:none; }
  .list{
    flex:1;
    overflow-y:auto;
    padding-bottom:20px;
  }
  .letter-header{
    position:sticky;
    top:0;
    background:var(--teal-deep);
    color:#fff;
    font-family:'Helvetica Neue', Arial, sans-serif;
    font-size:12px;
    font-weight:700;
    letter-spacing:0.1em;
    padding:5px 14px;
    z-index:2;
  }
  .med-item{
    display:block;
    width:100%;
    text-align:left;
    padding:9px 14px;
    border:none;
    background:none;
    cursor:pointer;
    border-bottom:1px solid #f0eee6;
    font-family: 'Helvetica Neue', Arial, sans-serif;
  }
  .med-item:hover{ background:#f0f6f4; }
  .med-item.active{ background:var(--teal); }
  .med-item.active .med-name{ color:#fff; }
  .med-item.active .med-brand{ color:#dff2ee; }
  .med-name{
    font-size:14px;
    font-weight:600;
    color:var(--ink);
    margin-bottom:2px;
  }
  .med-brand{
    font-size:11.5px;
    color:var(--muted);
  }
  mark{
    background:var(--highlight);
    color:inherit;
    padding:0 1px;
    border-radius:2px;
  }
  .no-results{
    padding:30px 20px;
    text-align:center;
    color:var(--muted);
    font-family:'Helvetica Neue', Arial, sans-serif;
    font-size:13.5px;
  }
  .content{
    flex:1;
    overflow-y:auto;
    padding:36px 48px;
  }
  .welcome{
    max-width:600px;
    margin:60px auto;
    text-align:center;
    font-family:'Helvetica Neue', Arial, sans-serif;
    color:var(--muted);
  }
  .welcome h2{
    color:var(--teal-deep);
    font-family:Georgia, serif;
    font-size:26px;
  }
  .card{ max-width:820px; }
  .card-eyebrow{
    font-family:'Helvetica Neue', Arial, sans-serif;
    text-transform:uppercase;
    letter-spacing:0.12em;
    font-size:11.5px;
    color:var(--clay);
    font-weight:700;
    margin-bottom:6px;
  }
  .card h2{
    font-size:28px;
    margin:0 0 14px;
    color:var(--teal-deep);
    line-height:1.25;
  }
  .tags{
    display:flex;
    flex-wrap:wrap;
    gap:8px;
    margin-bottom:28px;
  }
  .tag{
    font-family:'Helvetica Neue', Arial, sans-serif;
    font-size:11.5px;
    font-weight:600;
    padding:4px 10px;
    border-radius:20px;
    border:1px solid var(--line);
    color:var(--teal-deep);
    background:#eef6f4;
  }
  .tag.severity{ background:var(--amber-light); color:var(--amber); border-color:#f0e0bc; }
  .tag.contagion-yes{ background:var(--red-light); color:var(--red); border-color:#f5cfcf; }
  .tag.contagion-no{ background:var(--green-light); color:var(--green); border-color:#c9e8d5; }
  .sections{ margin:0; }
  .section-block{
    padding:20px 0;
    border-top:1px solid var(--line);
  }
  .section-block:first-of-type{ border-top:1px solid var(--line); }
  .section-title{
    font-family:'Helvetica Neue', Arial, sans-serif;
    font-size:12px;
    font-weight:700;
    text-transform:uppercase;
    letter-spacing:0.08em;
    color:var(--teal);
    margin-bottom:10px;
    display:flex;
    align-items:center;
    gap:8px;
  }
  .section-title .dot{
    width:20px; height:20px;
    border-radius:50%;
    display:inline-flex;
    align-items:center;
    justify-content:center;
    font-size:11px;
    font-weight:700;
    color:#fff;
    background:var(--teal);
    font-family:'Helvetica Neue', Arial, sans-serif;
  }
  .section-block.rx .section-title .dot{ background:var(--red); }
  .section-block ul{
    margin:0;
    padding-left:20px;
  }
  .section-block li{
    font-size:15px;
    line-height:1.6;
    color:var(--ink);
    margin-bottom:6px;
  }
  .section-block p{
    margin:0;
    font-size:15px;
    line-height:1.6;
    color:var(--ink);
  }
  .section-block.rx{
    background:#fbf5f0;
    border:1px solid #f0e2d3;
    border-radius:10px;
    padding:18px 20px;
    margin-top:8px;
  }
  .section-block.rx.no-top-border{ border-top:1px solid #f0e2d3; }
  .card-footer{
    margin-top:24px;
    font-family:'Helvetica Neue', Arial, sans-serif;
    font-size:12px;
    color:var(--muted);
  }
  @media (max-width: 760px){
    .content{ padding:24px 18px; }
    .sidebar{ position:absolute; inset:0; z-index:5; width:100%; }
    .sidebar.hidden{ display:none; }
    .layout{ position:relative; }
    .content.hidden{ display:none; }
    .back-btn{ display:inline-flex !important; }
  }
  .back-btn{
    display:none;
    align-items:center;
    gap:6px;
    font-family:'Helvetica Neue', Arial, sans-serif;
    font-size:13px;
    font-weight:600;
    color:var(--teal);
    background:none;
    border:none;
    cursor:pointer;
    margin-bottom:18px;
    padding:0;
  }
  ::-webkit-scrollbar{ width:9px; }
  ::-webkit-scrollbar-thumb{ background:#d8d3c6; border-radius:5px; }
  ::-webkit-scrollbar-track{ background:transparent; }
</style>
</head>

ous", "Symptoms": ["Absence of visible estrus (heat signs) beyond expected time after puberty, calving, or weaning.", "Reduced vulvar swelling, discharge, or mounting behavior.", "Prolonged calving-to-conception interval.", "Ovarian inactivity (on palpation/ultrasound).", "Low milk progesterone levels."], "Causes": ["Physiological:", "Prepubertal stage, pregnancy, lactation, seasonal anestrus.", "Pathological:", "Ovarian hypofunction, ovarian cysts, uterine infections, persistent CL (corpus luteum).", "Nutritional:", "Energy/protein deficiency, mineral/vitamin imbalances (P, Cu, Zn, Vit A, Vit E).", "Managemental:", "Poor heat detection, stress, high milk yield, postpartum complications, improper body condition."], "Treatment Protocol": ["Correct underlying cause (nutrition, infection, management).", "Hormonal therapies:", "GnRH or hCG injection to induce ovulation.", "Progesterone-based protocols (CIDR, PRID).", "Ovsynch protocol (GnRH–PGF₂α–GnRH timed AI).", "Nutritional correction (balanced ration, mineral mixture, vitamins).", "Uterine therapy if pyometra/endometritis is present.", "Proper postpartum care and reducing stress."], "Prevention Methods": ["Balanced nutrition (adequate energy, protein, trace minerals, vitamins).", "Good reproductive and herd health management.", "Proper heat detection and recording system.", "Early diagnosis and treatment of postpartum complications.", "Avoid over-conditioning or under-conditioning animals.", "Seasonal breeding management where applicable."], "Standard Prescription": ["First Step:", "Anthelmintics \tTab. Antiworm vet/ Duzol Vet/ Trilev Vet", "১ টি ট্যাবলেট/ ৫০ কেজি ওজনের জন্য খাওয়াবেন ৫ দিন পরপর ২ বার", "or", "Syrup Iverzol Vet", "১০ মিলি / ১০০ কেজি ওজনের জন্য খাওয়াবেন ৫ দিন পরপর ২ বার", "Vitamins\tInj. Acivit ADE/ Inj. ES ADE", "১০ মিলি / ১০০ কেজি ওজনের জন্য মাংসে দিবেন ৩ দিন পরপর ৩/৪ বার", "Growth Promoter \tInj. Gainfast/ Superamino vet", "১০-২০ মিলি / ১০০ কেজি ওজনের জন্য মাংসে দিবেন ৩ দিন পরপর ৩/৪ বার", "Reproductive Stimulator\tPowder Kemtrace Optimax", "৫০-১০০ গ্রাম খাওয়াবেন দৈনিক ১বার ১মাস", "Fat Suppliment\tPowder Bergafat", "৫০-১০০ গ্রাম খাওয়াবেন দৈনিক ১বার ১মাস", "Reproductive Stimulator\tPowder Boost-3", "২০-৫০ গ্রাম খাওয়াবেন দৈনিক ১বার ১মাস", "Advice \tSunlight Exposure/ Physical Exercise.", "Mixing with Teaser Bull.", "হিটে আসলে ষাঁড় দিয়ে প্রজনন/  ইনসেমিনেশন করবেন।", "Reproductive Stimulator\tSyrup Sure AI", "১ বোতল প্রজনন/ ইনসেমিনেশন করার পর খাওয়াবেন।", "Follow Up Treatment: যদি হিটে না আসে/ আসলেও কনসিভ না করে", "Reproductive Stimulator\t১. Powder Kemtrace Optimax", "৫০-১০০ গ্রাম খাওয়াবেন দৈনিক ১বার ১মাস", "২. Inj. Acivit ADE/ Inj. ES ADE", "১০ মিলি / ১০০ কেজি ওজনের জন্য মাংসে দিবেন ৩ দিন পরপর ৩/৪ বার", "৩. Inj Godorel", "১ম দিনঃ ২-৪ মিলি মাংসে দিবেন ১ বার", "৯ম দিনঃ ২-৪ মিলি মাংসে দিবেন ১ বার"], "Last Updated": "9/13/2025", "_id": 4}, {"Name": "Asthma", "Type": "Respiratory Disorder", "Animal": "Pet and Companion Animals", "Severity": "Moderate", "Contagion": "⚠️ Contagious", "Symptoms": ["Coughing, wheezing, difficulty breathing, panting, lethargy, loss of appetite, weight loss, exercise intolerance, and bluish or pale gums.", "Wheezing (high-pitched whistling sound when breathing)", "Coughing (persistent dry cough, especially in cats)", "Labored Breathing (rapid, shallow breaths, open-mouth breathing in cats)", "Lethargy & Weakness (due to low oxygen levels)", "Gagging or Vomiting (from excessive coughing)", "Blue-tinged Gums (in severe cases, indicates oxygen deprivation)", "Asthma Attack (Emergency Signs):", "🚨 Struggling to breathe (extended neck, gasping)", "🚨 Panic or distress (pawing at the mouth, inability to settle)", "🚨 Collapse or extreme fatigue"], "Causes": ["Allergens (pollen, dust mites, mold, smoke, perfumes)", "Environmental Irritants (household cleaners, air fresheners, cigarette smoke)", "Respiratory Infections (bacterial or viral)", "Obesity (puts extra pressure on the lungs)", "Stress & Anxiety (can trigger asthma attacks)", "Genetic Predisposition (more common in Siamese and Himalayan cats)."], "Treatment Protocol": "Reduce allergens, avoid smoke/dust and cold.  Minimize exposure to allergens (vacuum regularly, wash bedding).  Avoid strong fragrances (perfumes, cleaning sprays).  Keep up with vet check-ups (monitor lung health).  Consider allergy testing (if asthma is severe).", "Prevention Methods": "Reduce allergens, avoid smoke/dust and cold.  Minimize exposure to allergens (vacuum regularly, wash bedding).  Avoid strong fragrances (perfumes, cleaning sprays).  Keep up with vet check-ups (monitor lung health).  Consider allergy testing (if asthma is severe).", "Standard Prescription": ["Sneezing, Runny Nose/ Closed Nose, Common Cold, Rhinitis", "1.     Inj. Acicef 3 – 0.1ml/kg, IM, Twice daily.", "2.     Syp. Brodil- 1ml/ kg fed orally daily", "3.     Inj. Phenadryl – 0.1 ml/kg, IM, twice daily.", "4.     Tab. Mkast 4mg – 1 Tab/5kg bwt once daily.", "5.     Antazol nasal drop – Apply at nasal opening 3-4 times until airways clear up."], "Last Updated": "7/17/2025", "_id": 5}, {"Name": "B-Lactamase Poisoning (Rabbit)", "Type": "Poisoning", "Animal": "Pet and Companion Animals", "Severity": "Severe", "Contagion": "✅ Non-Contagious", "Symptoms": ["Severe diarrhea (often watery or bloody)", "Loss of appetite (anorexia)", "Lethargy & weakness", "Dehydration (sunken eyes,  dry mouth)", "Bloating or GI stasis (lack of fecal pellets)", "Neurological signs (seizures,  head tilt – in severe cases)", "Sudden death (due to enterotoxemia)"], "Causes": ["Oral Administration of Penicillin or Amoxicillin", "Rabbits have a unique gut microbiome that is disrupted by certain antibiotics,  leading to fatal enterotoxemia.", "Injectable penicillin can be safe if dosed correctly,  but oral forms are dangerous.", "Incorrect Antibiotic Choice", "Safe antibiotics for rabbits include enrofloxacin (Baytril),  trimethoprim-sulfa,  or metronidazole.", "Unsafe antibiotics include ampicillin,  clindamycin,  and most penicillins (when given orally).", "Overgrowth of Harmful Bacteria", "Antibiotics like penicillin kill beneficial gut bacteria,  allowing Clostridium spp. and E. coli to overproduce toxins.t."], "Treatment Protocol": ["Immediate Veterinary Care", "Fluid therapy (IV or SQ) to combat dehydration.", "Pain relief (meloxicam) for GI discomfort.", "GI Support & Probiotics", "Simethicone (for gas pain).", "Probiotics (e.g., Bene-Bac, probiotic pastes) to restore gut flora.", "Critical Care feeding (Oxbow) to maintain digestion.", "Antitoxin & Antibiotic Adjustment", "If Clostridium is suspected, vets may give cholestyramine (binds toxins).", "Switch to a rabbit-safe antibiotic (e.g., enrofloxacin).", "Hospitalization in Severe Cases", "Oxygen therapy if shock occurs.", "Anti-seizure meds if neurological signs appear."], "Prevention Methods": ["✔ Never give oral penicillin/amoxicillin to rabbits.", "✔ Use only rabbit-safe antibiotics (confirmed by an exotics vet).", "✔ Probiotics during antibiotic treatment to support gut health.", "✔ Monitor closely for diarrhea or appetite loss after any antibiotic.", "✔ Avoid unnecessary antibiotics—use only when prescribed by a vet."], "Standard Prescription": ["Rabbit: 3kgs.", "1. Inj. Seclo/ Omep -40mg, 0.3ml, IV, Twice daily for 7 days.", "2. Inj. Metro IV: 3-5ml/kg, IV,  Twice Daily for 5- 7 days.", "3. Syp. Oxecone MS – 1ml/kg, twice daily."], "Last Updated": "7/29/2025", "_id": 6}, {"Name": "Benign Prostatic Hyperplasia (Dog: 30kgs)", "Type": "Autoimmune", "Animal": "Pet and Companion Animals", "Severity": "Severe", "Contagion": "✅ Non-Contagious", "Symptoms": ["Straining to defecate or urinate.", "Dribbling of blood from the penis (not related to urination).", "Enlarged prostate on rectal exam.", "Tenesmus (straining to defecate).", "Reduced appetite,  lethargy (if severely enlarged).", "Straining to urinate or defecate (due to prostate pressing on the urethra/colon)", "Bloody preputial discharge (drops of blood from the penis)", "Changes in urination frequency", "Infertility or poor semen quality (in breeding dogs)", "Rarely,  complete urinary obstruction (more common with infections or cancer)."], "Causes": ["1. Hormonal Cause", "Testosterone influence in intact male dogs.", "2. Age Factor", "Most common in dogs over 5 years old.", "3. Other Conditions", "Not associated with infection or cancer directly,  but may coexist with prostatitis or cysts"], "Treatment Protocol": ["Neutering (Castration) – Gold standard treatment; leads to prostate shrinkage within weeks due to testosterone removal.", "Medical Management (if surgery is not an option, e.g., breeding dogs):", "Finasteride (5α-reductase inhibitor) – Reduces DHT, shrinking the prostate.", "GnRH Agonists (e.g., Deslorelin) – Temporarily reduces testosterone.", "Supportive Care:", "Antibiotics if secondary infection is present.", "Pain management if discomfort occurs."], "Prevention Methods": ["✅ Spay/neuter to prevent transmission during mating.", "✅ Avoid mating with unknown or stray dogs.", "✅ Monitor and inspect genitals for unusual growths.", "✅ Control free roaming and contact with street dogs.", "✅ Isolate infected animals during treatment."], "Standard Prescription": ["Dog: 30kgs", "1. Inj. Criston-2 (2mg/2ml)", "1ml/30kg Body weight, Iv, Weekly", "2. Inj. Roxadex - 2ml, IM, Once at day of Chemotherapy", "3. Inj Histavet- 2ml, IM, Once Daily", "4. Inj. Acicef-4", "2ml, Im, Once Daily for 15 days.", "5. Post operative wound Regular dressing"], "Last Updated": "7/19/2025", "_id": 7}, {"Name": "Blepharitis (inflammation of the eyelids) : Cat 3Kgs", "Type": "Bacterial Diseases", "Animal": "Pet and Companion Animals", "Severity": "Moderate", "Contagion": "✅ Non-Contagious", "Symptoms": ["Red,  swollen eyelids", "- Itchy or burning sensation", "- Gritty feeling (like sand in the eyes)", "- Crusty or greasy eyelashes (especially upon waking)", "- Flaky skin around the eyes (dandruff-like scales)", "- Watery or dry eyes", "- Sensitivity to light.", "- Blurred vision (if oil or debris affects the cornea)", "- Loss of eyelashes (in severe cases)"], "Causes": ["Bacterial Infection (Staphylococcus bacteria)", "- Seborrheic Dermatitis (dandruff of the scalp and eyebrows)", "- Meibomian Gland Dysfunction (MGD) – Clogged oil glands in eyelids", "- Demodex Eyelash Mites – Tiny parasites that live in hair follicles", "- Allergies (cosmetics,  contact lens solutions,  or environmental allergens)", "- Rosacea (a skin condition causing facial redness)", "- Dry Eyes – Can worsen or trigger blepharitis"], "Treatment Protocol": ["Blepharitis is often chronic, but symptoms can be managed with proper care:", "1. Eyelid Hygiene (Most Important Treatment)", "Warm Compress: Apply a warm, damp cloth to closed eyelids for 5-10 minutes to loosen crusts and unclog oil glands.", "Lid Scrubs: Gently clean eyelids with a diluted baby shampoo solution or commercial eyelid cleanser (e.g., Ocusoft, Blephadex).", "Massage: After warm compress, gently massage eyelids to express oil from glands.", "2. Medications", "Antibiotic Ointments (e.g., Erythromycin, Bacitracin) – Applied to lid margins.", "Oral Antibiotics (e.g., Doxycycline, Azithromycin) – For severe or rosacea-related cases.", "Steroid Eye Drops/Ointments (e.g., Loteprednol) – For inflammation (short-term use).", "Artificial Tears – For dry eye relief.", "3. Treatment for Underlying Conditions", "Anti-dandruff shampoo (if seborrheic dermatitis is present).", "Rosacea management (avoid triggers, use prescribed treatments).", "Demodex treatment (tea tree oil-based cleansers, ivermectin)."], "Prevention Methods": ["Since blepharitis tends to recur, daily eyelid hygiene is key:", "✔ Clean eyelids daily (even when no symptoms).", "✔ Remove eye makeup thoroughly before sleeping.", "✔ Avoid rubbing eyes (can worsen irritation).", "✔ Replace eye cosmetics (mascara, eyeliner) every 3 months.", "✔ Manage dandruff & rosacea if present.", "✔ Use artificial tears if eyes are dry.", "✔ Avoid allergens that trigger symptoms."], "Standard Prescription": ["Cat: 3 kg 1. Eye drop Teargen – 2-3 drops, wash the eye twice daily, 5-7 days.", "2. E/D. Moxiflox – 2 Drops, Apply locally three/four times daily, 5-7 days.", "3. Inj. Mel vet 0.5%- 0.15 ml sc once daily, 2-3 days.", "4. Syp. Cefixime – 100mg, 1.25 ml twice daily, fed orally, 5-7 days.", "5. Syp. Alatrol – ½ tsp once daily 7 days. \""], "Last Updated": "7/28/2025", "_id": 8}, {"Name": "Blood Dysentery/ Bloody Diarrhea/ Dysentry: Cat: 3kgs", "Type": "Bacterial", "Animal": "Pet and Companion Animals", "Severity": "Severe", "Contagion": "⚠️ Contagious", "Symptoms": ["Bloody Diarrhea (bright red = lower GI bleed; dark/tarry = upper GI bleed)", "Vomiting (sometimes with blood)", "Lethargy, Weakness", "Dehydration (sunken eyes, dry gums, slow skin tenting)", "Abdominal Pain", "Fever or Hypothermia (in severe infectious cases) folowed by hypothermia (in toxemic state & severe dehydration state).", "Frequent, loose stools, abdominal pain, dehydration, or changes in appetite, vomiting, blood or mucus in the stool, weight loss."], "Causes": ["1. Infectious Causes", "Parvovirus (Dogs) – Highly contagious, attacks intestinal lining.", "Panleukopenia (Cats) – Feline parvovirus, causes severe bloody diarrhea.", "Bacterial Infections", "Salmonella, Campylobacter, Clostridium perfringens, E. coli", "Parasitic Infections", "Hookworms, Whipworms, Coccidia, Giardia", "Protozoal Infections", "Tritrichomonas foetus (cats), Entamoeba histolytica", "2. Dietary Causes", "Dietary Indiscretion (eating garbage, spoiled food, toxins)", "Food Allergies/Intolerances", "Sudden Diet Changes", "3. Toxins & Medications", "Rodenticides (anticoagulant poisoning) → Internal bleeding", "NSAIDs (ibuprofen, aspirin) → Gastric ulcers", "Heavy Metals (lead, zinc)", "4. Inflammatory & Immune-Mediated Conditions", "Inflammatory Bowel Disease (IBD)", "Hemorrhagic Gastroenteritis (HGE) – Common in dogs", "Stress Colitis (common in cats)", "5. Systemic Diseases", "Liver/Kidney Disease", "Cancer (lymphoma, intestinal tumors)", "Coagulopathies (clotting disorders)"], "Treatment Protocol": ["1. Emergency Stabilization", "IV Fluids (Lactated Ringer’s, 0.9% NaCl) for dehydration", "Electrolyte Correction (Potassium, Bicarbonate if needed)", "2. Specific Treatments", "Antibiotics (e.g., metronidazole, amoxicillin-clavulanate) for bacterial infections.", "Antiparasitics (e.g., fenbendazole, praziquantel) for worms/protozoa", "Antivirals (limited efficacy, supportive care for parvovirus/panleukopenia)", "Anti-nausea Meds (e.g., maropitant, ondansetron)", "GI Protectants (e.g., sucralfate, omeprazole) for ulcers", "3. Supportive Care", "Plasma Transfusions (for severe parvovirus cases)", "Probiotics (to restore gut flora)", "Bland Diet (boiled chicken & rice, hydrolyzed diets)", "4. Treat Underlying Cause", "Surgery (if foreign body or tumor is present)", "Immunosuppressants (for IBD)", "Vitamin K1 (for rodenticide toxicity)", "clean housing, reduce crowding."], "Prevention Methods": ["Vaccination (Parvovirus, Panleukopenia)", "Regular Deworming & Fecal Testing", "Proper Diet, Avoid Sudden Changes, Fast Foods", "Toxin Prevention (keep chemicals, human meds away)", "Stress Reduction (especially in cats)", "Hygiene & Disinfection (parvovirus is highly resistant)"], "Standard Prescription": ["\"Cat: 3kgs", "1. Syp. Amodis – 1.5ml, Fed Orally, Twice Daily.", "2. Tab. D-con- 1 tab/2.5-3 kg Body Weight.", "3. Pow. PA Gut – 4-5 gm with per kg Feed/Drinking water.", "4. Pow. PA lyte – 10gm/ 2 Liter drinking water and feed QS.", "5. Tab. Tracid-500mg, 1/5 Part Fed orally twice daily (if blood in feces)", "6. Powder Vita- K: 1gm/ Cat Fed Orally Twice daily."], "Last Updated": "8/6/2025", "_id": 9}, {"Name": "Bronchitis", "Type": "Respiratory Disorder", "Animal": "Pet and Companion Animals", "Severity": "Moderate", "Contagion": "✅ Non-Contagious", "Symptoms": ["Chronic dry, hacking cough (worse with exercise/excitement)", "Wheezing (especially in cats with asthma)", "Gagging/retching (due to mucus)", "Exercise intolerance", "No fever (unless secondary infection)"], "Causes": ["Chronic bronchitis (long-term airway inflammation, common in older pets)", "Allergies (feline asthma, environmental irritants)", "Infectious agents (similar to pneumonia)", "Obesity & heart disease (secondary contributors)"], "Treatment Protocol": "1. Chronic Management Cough suppressants (hydrocodone, butorphanol – only if no infection) Antibiotics (if Infection & fever: Amoxicillin- Clavulenic acids, cephalosporins, Penicillin streptomicin) Bronchodilators (terbutaline, theophylline) Inhalator/ Nebulization.   2. Environmental Control Humidifiers (reduce airway irritation) Air purifiers (reduce allergens) Weight loss (if obese)", "Prevention Methods": "Avoid smoke/chemical irritants Control parasites (regular deworming) Manage allergies/asthma (reduce triggers) Avoid Extreme Cold/ Heat, Stress. Reduce dust & ammonia in housing, proper ventilation, vaccination", "Standard Prescription": ["1.     Inj. Acicef 3/ Bovixon – 0.1ml/kg, IM, Twice daily.", "1.     Inj. Histavet-  0.1 ml/kg, IM, Twice daily.", "2.    Tab. Mkast 4mg – 1 Tab/5kg bwt once daily.", "3.    Syp. Tofen – 1ml/kg once daily, Fed Orally", "4.   Brodil/ Pulmo Care Inhaler – Apply at nasal opening 3-4 times daily (1 Pressure)", "5.    Nebulization -  Bodicort + Windel Plus + NS (If severe).", "6.  High Flow Oxygen Therapy if Condition Critical.", "Keep Wormth, Avoid Humidity & Congested air.", "Improve Ventillation, SUnlight Exposure."], "Last Updated": "7/17/2025", "_id": 10}, {"Name": "Burn injury", "Type": "Skin Diseases", "Animal": "Pet and Companion Animals", "Severity": "Critical", "Contagion": "✅ Non-Contagious", "Symptoms": ["Common symptoms of burn injuries in dogs and cats include:", "- Redness and inflammation: Around the burned area.", "- Blister formation: Fluid-filled blisters or vesicles on the skin.", "- Pain and sensitivity: The affected area is often very painful; pets may show signs of discomfort when touched.", "- Skin peeling or sloughing: Loss of outer skin layers.", "- Darkened or charred skin: Black or brown coloration indicating severe burns.", "- Swelling: Around the affected area.", "- Open wounds or raw tissue: Especially in deeper burns.", "- Licking or scratching: Trying to soothe the pain.", "- Increased respiratory rate or difficulty breathing: Especially if the burn involved inhalation injury or affected the respiratory tract.", "- Behavioral changes: Restlessness, agitation, or hiding due to pain.", "- Signs of shock: Weakness, pale gums, cold extremities, or rapid heartbeat in severe cases."], "Causes": ["Fire Exposure/ hot water/ Hot food Exposure/ Chemical Exposure. Thermal Burns – Hot surfaces, boiling liquids, flames, or heating pads.", "Chemical Burns – Exposure to household cleaners, acids, alkalis, or fertilizers.", "Electrical Burns – Chewing on electrical cords or lightning strikes.", "Sunburn – Especially in pets with thin or light-colored fur."], "Treatment Protocol": "1. Assess the Severity of the Burn First-Degree Burn: Redness, mild swelling, pain (superficial).  Second-Degree Burn: Blisters, severe pain, possible oozing (partial-thickness).  Third-Degree Burn: Charred skin, white/black appearance, possible numbness (full-thickness, requires emergency care).  2. Immediate First Aid Cool the Burn:  Run cool (not ice-cold) water over the burn for 10–15 minutes.  Use a clean, wet cloth if running water isn’t available.  Avoid ice, as it can worsen tissue damage.  Remove Constrictive Items: Gently take off collars or clothing near the burn.  Do Not Pop Blisters: This increases infection risk.  3. Protect the Wound Cover with a Clean, Non-Stick Dressing:  Use sterile gauze or a non-adhesive bandage (e.g., Telfa pad).  Avoid cotton balls (fibers can stick to the wound).  Prevent Licking: Use an Elizabethan collar (cone) to stop the pet from licking or chewing the burn.  4. Pain Management & Infection Prevention Vet-Prescribed Pain Relief:  The vet may prescribe NSAIDs (e.g., Meloxicam) or other pain relievers.  Topical Treatments (if recommended by a vet):  Silver sulfadiazine cream (for minor burns).  Antibiotic ointments (e.g., bacitracin—only if pet can’t lick it).  5. Seek Veterinary Care Immediately If: The burn is large, deep, or third-degree.  The pet shows signs of shock (pale gums, rapid breathing, weakness).  The burn is caused by chemicals or electricity.  There’s infection (pus, foul odor, increased redness/swelling).  6. Long-Term Care & Healing Keep the wound clean and dry.  Follow the vet’s instructions for bandage changes and medications.  Monitor for delayed complications (e.g., scarring, contractures).", "Prevention Methods": "Avoid Fire Exposure/ hot water/ Hot food Exposure/ Chemical Exposure. Keep pets away from stoves, heaters, and hot liquids.  Cover electrical cords or use deterrent sprays.  Use pet-safe sunscreen on light-skinned animals.  Store chemicals securely.", "Standard Prescription": ["1. Cream  Burna/ Silburn - Aplly Locally", "2. Inj. Sedil - 1ml/15-30kg, Twice Daily - 1st/2nd Day", "3. Syp. Clavucef- 100mg, 1ml/2kg, Fed Orally Twice Daily.", "4. Inj. Hartsol - 20-40ml, IV, Twice Daily (Depends on Grdae of Injury).", "5. Inj. Gainfast/ Aminovit Plus  Vet - 1ml/5kg, IM, Once- Twice daily.", "6. Dressing: Viodin - Once/ Twice daily for 5-7 Days/ Upto recovery."], "Last Updated": "7/17/2025", "_id": 11}, {"Name": "Canine Babesiosis", "Type": "Parasitic Diseases", "Animal": "Pet and Companion Animals", "Severity": "Moderate", "Contagion": "⚠️ Contagious", "Symptoms": ["High fever and severe lethargy.", "Pale or yellow gums (jaundice).", "Red or brown urine (hemoglobinuria).", "Loss of appetite and rapid weight loss.", "Swollen lymph nodes or spleen.", "Weakness or collapsing episodes.", "⚠️ Emergency Signs:", "Severe anemia with shock or coma.", "Multi-organ failure in acute infection"], "Causes": ["Tick-borne protozoa,  blood transfusion,  dog fights.", "Babesia spp. Parasite", "Transmitted by tick bite (e.g.,  Rhipicephalus sanguineus).", "Tick Exposure", "Walking in tick-infested environments without protection.", "Blood Transmission", "Via contaminated blood transfusions or biting (dog fights).", "Stress & Immunosuppression", "Stress,  illness,  or steroids can worsen disease progression."], "Treatment Protocol": ["Antiprotozoal drugs:", "Dogs: Imidocarb dipropionate (for B. canis), Atovaquone + Azithromycin (for B. gibsoni).", "Cats: Limited options; supportive care is crucial.", "Supportive therapy:", "Blood transfusions (in severe anemia)", "IV fluids and anti-inflammatory drugs", "Liver protectants (if jaundice is present)"], "Prevention Methods": ["Tick Control:", "Use tick preventatives (spot-ons, collars, oral medications like isoxazolines).", "Regularly check pets for ticks, especially after outdoor activities.", "Environmental Management:", "Keep yards trimmed and treat outdoor areas with acaricides.", "Avoiding Blood Transmission Risks:", "Screen blood donors for Babesia.", "Vaccination (limited availability):", "A vaccine exists in Europe for B. canis (Pirodog®), but not widely available elsewhere."], "Standard Prescription": ["1. Inj. Babecure- 120mg/ml, IM/SC", "2. Syp. Zimax- 1ml @ 4-8 kgs or 0.15-0.25ml/kg, twice daily, 5-7 days.", "3. Syp. Liv-52- 1ml/kg twice daily, 15-20 days.", "4. Inj. Hartsol - 20-40ml, IV, Twice daily, 57 Days."], "Last Updated": "7/28/2025", "_id": 12}, {"Name": "Canine Distemper (CDV)-(Dog: 20kgs)", "Type": "Viral", "Animal": "Pet and Companion Animals", "Severity": "Severe", "Contagion": "⚠️ Contagious", "Symptoms": "Hard Pad Disease. Fever, lethargy, loss of appetite, discharge from the eyes and nose, coughing, and diarrhea. Later, neurological symptoms such as muscle twitching, seizures, or even paralysis may develop.", "Causes": "Canine Distemper Virus", "Treatment Protocol": ["A. Hospitalization & Supportive Care", "IV Fluids (Lactated Ringer’s + electrolytes) for dehydration.", "Broad-spectrum Antibiotics (for secondary pneumonia):", "Amoxicillin-Clavulanate (20 mg/kg q12h)", "Doxycycline (5 mg/kg q12h) if Bordetella coinfection suspected.", "Antiemetics (Ondansetron/ Atropine) if vomiting.", "B. Neurological Support", "Anticonvulsants (if seizures occur):", "Diazepam (0.5 mg/kg IV PRN) for acute seizures.", "Phenobarbital (2-5 mg/kg q12h) for chronic seizures.", "Levetiracetam (20 mg/kg q8h) as adjunct therapy.", "Corticosteroids (Controversial) – May reduce CNS inflammation but can worsen immunosuppression.", "C. Immune Modulation & Antivirals (Experimental)", "Vitamin A (10,000 IU/day) – Supports epithelial repair.", "Lysine & Antioxidants – May slow viral replication.", "D. Nutritional Support", "High-calorie liquid diet (e.g., Hill’s a/d) if anorexia persists.", "Probiotics (e.g., Forti Flora) to restore gut flora."], "Prevention Methods": "Vaccination, Quarentine, Isolation, Hygienic Management", "Standard Prescription": ["Dog: 20kgs", "1. Inj. Acicef-4, 1ml., IM/Sc, Once Daily for 5-7 days.", "2. Inj. Nervin- 2ml, IM, Twice Daily for 5-7 Days", "3. Inj. Seclo/ Omep -40mg, 3ml, IV, Twice daily for 7 days.", "4. Inj. Aminovit Plus vet – 20ml: 4ml/5kg IM/IV Once/Twie daily for 10 days.", "5. Vita C - Inj Ascoson -500mg/5ml : 2ml, Once daily for 10 days.", "6. Inj. NS/ Hartsol – 20-40ml/kg IV Twice daily for 7 days."], "Last Updated": "7/18/2025", "_id": 13}, {"Name": "Canine Parvovirus (CPV)-(Dog: 20kgs)", "Type": "Viral", "Animal": "Pet and Companion Animals", "Severity": "Severe", "Contagion": "⚠️ Contagious", "Symptoms": "Nausea, vomiting, bloody vomit, bloody feces, dehydration, abdominal pain, bloat, rapid heartbeat, or coughing.", "Causes": "Canine Parvovirus", "Treatment Protocol": ["1. Immediate Veterinary Care", "Hospitalization is often required due to severe dehydration, vomiting, and diarrhea.", "IV Fluid Therapy (Lactated Ringer’s or 0.9% saline with electrolytes) to combat dehydration and maintain electrolyte balance.", "Anti-emetics (e.g., Ondansetron to control vomiting.)", "Antibiotics (e.g., Ceftiofor/ Ceftriaxone/ Ampicillin/ Enrofloxacin/ Ciprofloxacin/ Marbofloxacin, Metronidazole) to prevent secondary bacterial infections (septicemia from gut bacteria).", "2. Supportive Care", "Nutritional Support:", "NPO (Nothing Per Os) initially if vomiting persists.", "Aminoacids, Vitamin B Complex, Vitamin C etc.", "Fecal Microbiota Transplant (FMT) to restore gut flora post-recovery.", "Gradual feeding with a bland, easily digestible diet (e.g., boiled chicken & rice, or prescription GI diets like Hill’s i/d) once vomiting is controlled.", "Syringe feeding or tube feeding if the dog refuses to eat.", "Anti-diarrheals (e.g., Kaolin-Pectin) may be used cautiously (only if no intestinal obstruction is suspected).", "Pain Management (e.g., Meloxicam) if abdominal discomfort is severe.", "3. Advanced Treatments (if available)", "Plasma/Blood Transfusion (for severely anemic or hypoproteinemic dogs).", "IV Immunoglobulins or Recombinant Interferon-Omega (experimental but may help in early infection)."], "Prevention Methods": ["Vaccination, Quarentine, Isolation, Hygienic Management.", "Vaccination", "Core Vaccination (DHPP) starting at 6-8 weeks, boosters every 3-4 weeks until 16 weeks, then yearly/3-yearly as per vet advice.", "Avoid exposure to unvaccinated dogs or contaminated areas until fully vaccinated.", "Isolate the dog to prevent spreading CPV to other dogs.", "Disinfect environment with bleach (1:30 dilution) or accelerated hydrogen peroxide."], "Standard Prescription": ["Dog: 20kgs", "1. Inj. Acicef-4, 1ml., IM/Sc, Once Daily for 5-7 days.", "2. Inj. Zofra/ Anset/ Emiset - 2ml, IM/IV, Twice Daily for 7 days", "3. Inj. Tracid 10ml : 2ml, IM/IV Twice daily for 7 days.", "4. Inj. Seclo/ Omep -40mg, 3ml, IV, Twice daily for 7 days.", "5. Inj. Metro IV: 100ml, IV, Twice Daily for 7 days.", "6. Inj. Aminovit Plus vet – 20ml: 4ml/5kg IM/IV Once/Twie daily for 10 days.", "7. Vita C - Inj Ascoson -500mg/5ml : 2ml, Once daily for 10 days.", "8. Inj. Cholera saline/ Hartsol – 20-40ml/kg IV Twice daily for 7 days."], "Last Updated": "7/18/2025", "_id": 14}, {"Name": "Canine Transmissible Benign Tumer (CTVT) (Dog: 30Kgs)", "Type": "Autoimmune", "Animal": "Pet and Companion Animals", "Severity": "Severe", "Contagion": "⚠️ Contagious", "Symptoms": ["Visible tumors or nodules on the genitalia.", "Bleeding from the genital area.", "Hematuria (blood in urine).", "Excessive licking or discomfort.", "Possible metastasis in advanced cases—affecting nose, skin, or lymph nodes.", "Weight loss, lethargy (in severe cases)."], "Causes": ["1. Direct Contact Transmission", "Spread through mating, licking, or sniffing infected areas.", "2. Neoplastic Disease", "Transplantable cancer cells that implant in mucosal surfaces.", "3. Risk Factors", "More common in free-roaming and unneutered dogs.", "Weak immune systems can allow tumor growth."], "Treatment Protocol": ["Surgical removal: Possible but recurrence is common if not combined with chemo.", "Radiation therapy: Rarely used due to cost/availability.", "Spontaneous regression: Some tumors may regress over time due to immune response.", "Chemotherapy (most effective): Vincristine (weekly injections, ~4–6 treatments). Chemotherapy : Inj Vincristine Sulphate (Criston 2) weakly one dose (1.4-1.5 mg/M2).", "Standard Dose: 0.5–0.75 mg/m² IV (most commonly 0.7 mg/m²)", "Frequency: Every 1–2 weeks (as part of a multi-agent protocol, such as CHOP for lymphoma)", "Maximum Single Dose: Often capped at 1 mg/dog (to reduce neurotoxicity risk)", "Administration: Given slow IV push (over 1–2 minutes) through a secure catheter (extravasation can cause severe tissue damage).", "Methods to Calculate BSA in Dogs:", "1. Most Accurate: Formula-Based Calculation", "The gold standard uses the Mech formula (modified for dogs):", "BSA (m²) = k×(Body Weight in grams)2/3", "BSA (m²)=k×(Body Weight in grams) 2/3", "k (species constant) for dogs = 10.1 (or 10.4 in some references)", "Convert weight in kg to grams (1 kg = 1000 g)", "Example Calculation:", "Dog weighs 20 kg (20,000 g)", "BSA = 10.1 × (20,000)^(2/3)", "≈ 0.8 m²", "2. Simplified BSA Chart (Weight-to-BSA Conversion)", "For quick reference (approximate values):", "Weight (kg) BSA (m²)", "5 kg ~0.30 m²", "10 kg ~0.46 m²", "20 kg ~0.79 m²", "30 kg ~1.07 m²", "40 kg ~1.32 m²"], "Prevention Methods": ["✅ Spay/neuter to prevent transmission during mating.", "✅ Avoid mating with unknown or stray dogs.", "✅ Monitor and inspect genitals for unusual growths.", "✅ Control free roaming and contact with street dogs.", "✅ Isolate infected animals during treatment."], "Standard Prescription": ["Dog: 30kgs", "1. Inj. Criston-2 (2mg/2ml)", "1ml/30kg Body weight, Iv, Weekly", "2. Inj. Roxadex - 2ml, IM, Once at day of Chemotherapy", "3. Inj Histavet- 2ml, IM, Once Daily", "4. Inj. Acicef-4", "2ml, Im, Once Daily for 15 days.", "5. Post operative wound Regular dressing"], "Last Updated": "7/19/2025", "_id": 15}, {"Name": "Closed Nose", "Type": "Respiratory Disorder", "Animal": "Pet and Companion Animals", "Severity": "Moderate", "Contagion": "✅ Non-Contagious", "Symptoms": ["Difficulty breathing, such as increased panting or unusual breathing sounds, mouth breathing, nasal discharge, sneezing, snorting, and lethargy or loss of appetite, yellowish Sputum in nose.", "🔹 Noisy breathing (snoring, snorting, wheezing)", "🔹 Sneezing frequently (sometimes with discharge)", "🔹 Pawing at the face (trying to dislodge something)", "🔹 Reduced sense of smell (loss of appetite)", "🔹 Nasal discharge (clear, yellow, green, or bloody)", "🔹 Open-mouth breathing (if severe blockage)", "🔹 Lethargy or fever (if infection is present)"], "Causes": ["Common Cold (Influenza), Environmental Cold, Allergy.", "1. Infections", "Viral (e.g., Feline Herpesvirus in cats, Canine Distemper in dogs)", "Bacterial (e.g., Bordetella, Streptococcus)", "Fungal (e.g., Aspergillosis, Cryptococcosis)", "2. Allergies (Environmental or Food-Related)", "Pollen, dust, mold, smoke, or strong odors", "3. Foreign Objects", "Grass seeds, foxtails, small toys, or debris stuck in nasal passages", "4. Nasal Polyps or Tumors", "More common in older pets, especially cats", "5. Dental Disease", "Tooth root abscesses (upper teeth can affect nasal passages)", "6. Brachycephalic Syndrome (Flat-Faced Breeds)", "Bulldogs, Pugs, Persian cats (narrow nostrils, elongated soft palate)", "7. Trauma or Structural Issues", "Broken nose, congenital deformities, or scar tissue.", "8. Sinusitis - Infection of Sinus."], "Treatment Protocol": "Humidification, treat infections early, abvoid cold. 1. Mild Cases (Allergies, Minor Congestion) Humidifier – Helps loosen mucus. Saline drops – Vet-approved saline can help clear mild blockages. Antihistamines (e.g., Benadryl) – Only under vet guidance.  2. Infections (Bacterial, Viral, Fungal) Antibiotics (e.g., Clavamox, Doxycycline) – For bacterial infections. Antivirals (e.g., Famciclovir for feline herpes). Antifungals (e.g., Itraconazole for fungal infections).  3. Foreign Objects Vet removal (NEVER try to pull out objects at home—may push them deeper).  4. Nasal Polyps or Tumors Surgical removal (followed by biopsy if cancer is suspected).  5. Dental Issues Tooth extraction or root canal (if abscess is causing blockage).  6. Brachycephalic Breeds Surgery (widening nostrils or shortening soft palate if severe).  7. In case of sinusitis nasal decongestents- Menthol vapor.", "Prevention Methods": "✔ Keep vaccines updated (especially for respiratory viruses). ✔ Avoid irritants (smoke, perfumes, dusty environments). ✔ Regular dental check-ups (prevent tooth-related nasal issues). ✔ Monitor playtime (prevent foreign object inhalation). ✔ Use air purifiers (for pets with allergies).", "Standard Prescription": ["1.     Inj. Histavet-  0.1 ml/kg, IM, Twice daily.", "2.     Tab. Mkast 4mg – 1 Tab/5kg bwt once daily.", "3.     Syp. Tofen – 1ml/kg once daily, Fed Orally", "4.     Antazol nasal drop – Apply at nasal opening 3-4 times until airways clear up."], "Last Updated": "7/17/2025", "_id": 16}, {"Name": "Colic", "Type": "Digestive System Disorder", "Animal": "Pet and Companion Animals", "Severity": "Moderate", "Contagion": "✅ Non-Contagious", "Symptoms": ["Restlessness, pacing, inability to settle", "Whining, crying, or excessive meowing", "Abdominal distension or bloating", "Repeated stretching (\"praying position\" in dogs)", "Vomiting or retching (especially with GDV)", "Diarrhea or constipation", "Lethargy, collapse (in severe cases)"], "Causes": ["1. Gastrointestinal Causes", "Gastric Dilatation-Volvulus (GDV) (life-threatening in dogs)", "Intestinal Obstruction (foreign bodies, tumors, intussusception)", "Severe Gas or Bloating (dietary indiscretion)", "Enteritis/Colitis (infections, parasites, IBD)", "Pancreatitis (inflammation of the pancreas)", "2. Urinary Causes", "Urinary Blockage (urethral obstruction in male cats)", "Kidney Stones or Bladder Stones", "Pyelonephritis (kidney infection)", "3. Reproductive Causes", "Pyometra (infected uterus in unspayed females)", "Prostatitis (in male dogs)", "Dystocia (difficult labor)", "4. Other Causes", "Peritonitis (infection/inflammation of abdominal lining)", "Toxins (lead, zinc, certain plants)", "Trauma (internal bleeding, organ rupture)"], "Treatment Protocol": ["1. Emergency Stabilization", "IV Fluids (for dehydration and shock)", "Pain Relief (e.g., Tiemonium Methylsulfate, buprenorphine, meloxicam if no GI ulcers)", "Anti-nausea Meds (e.g., maropitant, ondansetron)", "2. Specific Treatments", "GDV → Emergency surgery (gastric decompression & gastropexy)", "Intestinal Obstruction → Surgery (foreign body removal)", "Urinary Blockage → Catheterization, surgery (if stones present)", "Pancreatitis → IV fluids, pain meds, antiemetics, low-fat diet", "Pyometra → Emergency spay + antibiotics", "3. Supportive Care", "Probiotics (for gut health recovery)", "Bland Diet (boiled chicken & rice, GI prescription food)", "Stress Reduction (especially in cats with recurrent colic."], "Prevention Methods": ["Proper Diet (avoid sudden changes, fatty foods)", "Prevent Foreign Body Ingestion (keep small objects away)", "Regular Deworming & Parasite Control", "Spay/Neuter (prevents pyometra, prostatitis)", "Hydration (encourage water intake, especially in cats)", "Monitor High-Risk Breeds (deep-chested dogs for GDV)"], "Standard Prescription": ["1. Inj. Espa Vet/ No spa/ Algin - 1ml, IM, Twice daily", "2. Tab. Maxpro (20mg) – ¼ orally twice daily.", "3. Syp. Flacol 2 Tsp Twice Daily or Syp.", "4. Laxitol/Maxilax – 1Tsp twice daily Orally."], "Last Updated": "7/19/2025", "_id": 17}, {"Name": "Complicated Wound/ Secondary Bacterial infection", "Type": "Bacterial", "Animal": "Pet and Companion Animals", "Severity": "Severe", "Contagion": "✅ Non-Contagious", "Symptoms": "Circling behavior (neurological form),  Facial paralysis (drooling,  inability to swallow),  Head tilt,  Seizures,  Fever,  Loss of coordination", "Causes": "Listeria monocytogenes", "Treatment Protocol": ["Wound – dressing, water therapy,  Tin Iodine / CuSo4 (2-5%) (if Fungal infection suspected)/ Sodi carb (for removal of crust or foreign contaminants/ Xentian Violet/Hexisol/ H2O2.", "Antihistamin/+ NSAID / Steroids (single dose, never overdose)", "Ivermectin – to prevent & control ectoparasitic infestation (repeat after 7-14 days, strictly maintain proper dose & route)", "Antibiotics – Locally and Parentally if Pyoderma present and localized/ systemic involvement.", "Drugs of Choice: Penicillin/Ampicillin/Amoxicillin/amoxicillin-clavulanate/ Cephalosporins", "Anti fungal (if fungal infection suspected)– Systemic/ Local"], "Prevention Methods": "Avoid moldy silage, proper food storage, rodent control.", "Standard Prescription": ["1. Inj. Fixin/ M Pain Vet 0.5% - 0.15ml, SC, Once daily, 1-3 days,", "2. Inj. Streptopen – 2.5gm- 0.5ml, IM, Twice Daily,", "3. Inj. Phenadryl – 0.5 ml, IM, Once daily,", "4. Oint. Neobacrin/Dermasol N/ Pow. Neocin apply Locally Twice daily.", "5. Inj. Acimec 1% - 0.15ml SC 5 days intervals.", "6. Dressing twice daily – H2O2 – 1st One/Two Days, Povin – Twice daily- 3-5days, Then Once daily.", "7. Fly Repellent – Oil of Turpentine/Ectonil(1.5gm/liter water) Spray/Nephthalin- hanging in kennel"], "Last Updated": "7/27/2025", "_id": 18}, {"Name": "Conjunctivitis (Allergic)", "Type": "Acute", "Animal": "Pet and Companion Animals", "Severity": "Moderate", "Contagion": "⚠️ Contagious", "Symptoms": "Red,  swollen conjunctiva,  Clear,  yellow,  or green discharge,  Squinting or holding eye closed,  Pawing at the eye,  Third eyelid protrusion", "Causes": "Allergen to Eye", "Treatment Protocol": ["Sterile eyewash:", "Allergic conjunctivitis, flushing the eyes with sterile eyewash can help remove irritants.", "Topical medications:", "Eye drops or ointments, including antibiotics, anti-inflammatories, or corticosteroids, are often prescribed.", "Oral medications:", "In some cases, oral antibiotics or anti-inflammatories may be needed.", "Addressing underlying causes:", "If conjunctivitis is secondary to another eye condition, that condition will also need treatment.", "E-collars:", "Elizabethan collars (lampshade collars) may be recommended to prevent pets from rubbing or pawing at their eyes.", "Warm compresses:", "Warm compresses can help soothe irritated eyes and loosen crusty discharge."], "Prevention Methods": "Reduce allergens, eye rinsing, avoid irritants.", "Standard Prescription": ["Cat: 3 kg", "1. Eye drop Teargen – 2-3 drops, wash the eye twice daily, 5-7 days.", "2. E/D. Moxiflox – 2 Drops, Apply locally three/four times daily, 5-7 days.", "3. Inj. Mel vet 0.5%- 0.15 ml sc once daily, 2-3 days.", "4. Syp. Cefixime – 100mg, 1.25 ml twice daily, fed orally, 5-7 days.", "5. Syp. Alatrol – ½ tsp once daily 7 days."], "Last Updated": "7/18/2025", "_id": 19}, {"Name": "Conjunctivitis or Pink Eye or Eye Infection (Cat: 3 kg)", "Type": "Viral", "Animal": "Pet and Companion Animals", "Severity": "Severe", "Contagion": "⚠️ Contagious", "Symptoms": ["Redness and swelling: The whites of the eyes (conjunctiva) appear red or pink, and the eyelids may be puffy.", "Discharge: Eyes may produce watery, yellow, green, or thick, crusty discharge.", "Excessive blinking or squinting: Pets may blink frequently or squint due to irritation or discomfort.", "Paw rubbing or scratching: Pets may paw at their eyes or face due to itching or irritation.", "Other signs: Coughing, sneezing, or decreased appetite can be associated with some cases of conjunctivitis, especially those caused by viral infections."], "Causes": ["Infections:", "Bacterial, viral (like feline herpesvirus in cats), or fungal infections can lead to conjunctivitis.", "Allergies:", "Both dogs and cats can develop allergic conjunctivitis from pollen, dust, or other allergens.", "Irritants:", "Foreign bodies (like dust, debris, or grass seeds), smoke, chemicals, or even excessive wind can irritate the conjunctiva.", "Other eye conditions:", "Dry eye, eye injuries, or certain eye diseases like glaucoma can also cause conjunctivitis."], "Treatment Protocol": ["Topical medications:", "Eye drops or ointments, including antibiotics, anti-inflammatories, or corticosteroids, are often prescribed.", "Oral medications:", "In some cases, oral antibiotics or anti-inflammatories may be needed.", "Addressing underlying causes:", "If conjunctivitis is secondary to another eye condition, that condition will also need treatment.", "E-collars:", "Elizabethan collars (lampshade collars) may be recommended to prevent pets from rubbing or pawing at their eyes.", "Warm compresses:", "Warm compresses can help soothe irritated eyes and loosen crusty discharge.", "Sterile eyewash:", "For allergic conjunctivitis, flushing the eyes with sterile eyewash can help remove irritants."], "Prevention Methods": ["Maintain good hygiene: Regularly clean your pet's living area, bedding, and toys. Avoid dusty or smoky environments.", "Manage allergies: If your pet has allergies, work with your veterinarian to manage them effectively.", "Protect from irritants: Minimize exposure to smoke, chemicals, and excessive wind.", "Regular vet check-ups: Routine eye exams can help detect and address potential problems early."], "Standard Prescription": ["Cat: 3 kg", "1. Eye drop Teargen – 2-3 drops, wash the eye twice daily, 5-7 days.", "2. E/D. Moxiflox – 2 Drops, Apply locally three/four times daily, 5-7 days.", "3. Inj. Mel vet 0.5%- 0.15 ml sc once daily, 2-3 days.", "4. Syp. Cefixime – 100mg, 1.25 ml twice daily, fed orally, 5-7 days.", "5. Syp. Alatrol – ½ tsp once daily 7 days."], "Last Updated": "7/18/2025", "_id": 20}, {"Name": "constipasion (Cat: 3kgs)", "Type": "Metabolic", "Animal": "Pet and Companion Animals", "Severity": "Moderate", "Contagion": "✅ Non-Contagious", "Symptoms": "Straining or difficulty passing stool, producing hard or dry stools, excessive circling, frequent squatting, sometimes even crying or whimpering, decreased appetite, vomiting, or blood in the stool.", "Causes": ["1. Dietary & Lifestyle Factors", "Low-fiber diet", "Dehydration (inadequate water intake)", "Ingestion of indigestible materials (bones, hair, foreign objects)", "Obesity & lack of exercise", "2. Medical Conditions", "Megacolon (common in cats, especially older ones)", "Pelvic or spinal injuries (narrowed pelvic canal, nerve damage)", "Prostate enlargement (in male dogs)", "Hypothyroidism (dogs)", "Electrolyte imbalances (low potassium, high calcium)", "3. Medications & Toxins", "Opioids (e.g., after surgery)", "Antacids with aluminum/calcium", "Diuretics (cause dehydration)", "4. Behavioral & Environmental Factors", "Stress (changes in routine, new pets, dirty litter box for cats)", "Lack of access to toileting areas (elderly pets, arthritis pain)."], "Treatment Protocol": ["Enema if severe dehydration & Constipation.", "1. Mild Cases (Home Care)", "Increase water intake (wet food, water fountains for cats)", "Dietary fiber (pumpkin puree, psyllium husk, vet-approved laxatives)", "Laxatives (e.g., lactulose, Miralax)", "Stool softeners (e.g., docusate sodium)", "2. Moderate to Severe Cases (Veterinary Treatment)", "Enemas (performed by a vet—never use human enemas at home!)", "Manual removal (under sedation if stool is impacted)", "IV fluids (for dehydration)", "Prokinetic drugs (e.g., cisapride for megacolon)", "3. Chronic Cases (Long-Term Management)", "High-fiber prescription diets (e.g., Royal Canin Gastrointestinal Fiber)", "Regular exercise (promotes bowel motility)", "Probiotics (improve gut health)."], "Prevention Methods": ["Provide fresh water daily (encourage drinking)", "Feed high-moisture diets (canned food for cats)", "Regular exercise (helps stimulate bowel movements)", "Groom long-haired pets (reduce hair ingestion)", "Litter box hygiene (keep clean for cats)", "Avoid feeding bones or indigestible treats.", "Hydration, fiber-rich diet, exercise."], "Standard Prescription": ["Cat: 3kg", "1. Syp – Flacol 2 Tsp Twice Daily or Syp. Laxitol/Maxilax – 1Tsp twice daily Orally", "2. Syp. Avolac, 1 Tsp Twice Daily", "3. Glysup 1.15gm – suppository 12 hourly, repeat if need.", "4. Isabgul husk with food & water."], "Last Updated": "7/19/2025", "_id": 21}, {"Name": "Corneal Ulcer/ Keratitis (Cat -2kgs)", "Type": "Bacterial", "Animal": "Pet and Companion Animals", "Severity": "Moderate", "Contagion": "⚠️ Contagious", "Symptoms": ["Severe eye pain (often worse than expected for the injury).", "Redness & swelling of the eye.", "Blurred or decreased vision.", "Sensitivity to light (photophobia).", "White or gray spot on the cornea (visible in severe cases).", "Excessive tearing or discharge (pus if bacterial).", "Feeling of a foreign body in the eye."], "Causes": ["1. Infections (Most Common Cause)", "Bacterial (Pseudomonas, Staphylococcus, Streptococcus) – Common in contact lens wearers.", "Viral (Herpes simplex virus, Varicella-zoster virus).", "Fungal (Candida, Fusarium, Aspergillus) – Often seen after agricultural injuries or steroid use.", "Acanthamoeba – Rare but severe, linked to contaminated water or improper contact lens care.", "2. Non-Infectious Causes", "Trauma (scratches, foreign bodies, chemical burns).", "Dry eye syndrome (severe dryness leads to epithelial breakdown).", "Autoimmune diseases (e.g., rheumatoid arthritis, Sjögren’s syndrome).", "Neurotrophic keratitis (loss of corneal sensation due to diabetes, herpes, or nerve damage).", "Vitamin A deficiency (rare in developed countries)."], "Treatment Protocol": ["1. Medical Treatment (Depends on Cause)", "A. Antibiotics (Bacterial Ulcers)", "Topical fortified antibiotics (e.g., cefazolin + tobramycin).", "Fluoroquinolones (ciprofloxacin, moxifloxacin) for less severe cases.", "B. Antivirals (Herpes Simplex/Zoster Ulcers)", "Acyclovir ointment/oral tablets or valacyclovir.", "C. Antifungals (Fungal Ulcers)", "Natamycin 5% (topical) or voriconazole (oral/topical).", "D. Antiparasitics (Acanthamoeba Keratitis)", "Chlorhexidine + polyhexamethylene biguanide (PHMB) eye drops.", "2. Supportive Treatments", "Cycloplegic drops (e.g., atropine) to reduce pain and prevent spasms.", "Steroids (controversial) – Used cautiously in some cases to reduce inflammation (only under strict supervision).", "Artificial tears/lubricants (for dry eye-related ulcers).", "3. Surgical Treatment (If Severe)", "Debridement – Removal of infected tissue.", "Corneal transplant (keratoplasty) – For deep ulcers or perforations.", "Tarsorrhaphy – Temporarily sewing eyelids together to promote healing."], "Prevention Methods": ["✅ Protective eyewear in hazardous environments.", "✅ Treat dry eyes & underlying conditions (e.g., autoimmune diseases).", "✅ Avoid steroid eye drops without medical supervision."], "Standard Prescription": ["Corneal Ulcer, Cat -2kgs", "1. Eye drop Teargen – 2-3 drops, wash the eye twice daily.", "2. E/D. Civodex/Moxidex – Apply locally three/four times daily.", "3. Inj. MPain vet 0.5%- 0.2 ml sc once daily.", "4. Syp. Cefixime – 100mg, 1.25 ml Twice Daily.", "5. Syp. Alatrol – ½ TSP once daily 7 days."], "Last Updated": "7/27/2025", "_id": 22}, {"Name": "Coughing/ Kennel Kough", "Type": "Respiratory Disorder/ Bacterial Disease", "Animal": "Pet and Companion Animals", "Severity": "Moderate", "Contagion": "⚠️ Contagious", "Symptoms": ["✅ Dry, hacking cough (common in kennel cough, asthma).", "✅ Wet, phlegmy cough (suggests pneumonia, fluid in lungs).", "✅ Gagging or retching (hairballs in cats, tracheal issues in dogs).", "✅ Wheezing or labored breathing (asthma, heart disease).", "✅ Coughing at night or after exercise (heart disease, collapsing trachea).", "🚨 Emergency Signs:", "Blue/pale gums (lack of oxygen).", "Coughing up blood.", "Extreme lethargy or collapse.", "Emergency State:", "Cough persists >2-3 days", "Difficulty breathing or rapid panting", "Coughing up blood or foam", "Loss of appetite or lethargy."], "Causes": ["Common Causes in Dogs:", "Kennel Cough (Infectious Tracheobronchitis) – Bacterial/viral (Bordetella, Parainfluenza).", "Heart Disease – Especially in older dogs (heart murmur, congestive heart failure).", "Collapsing Trachea – Common in small breeds (Chihuahuas, Pomeranians).", "Pneumonia – Bacterial, viral, or aspiration-related.", "Allergies/Asthma – Pollen, dust, or smoke irritation.", "Foreign Object – Grass, toys, or food stuck in the throat.", "Lungworms or Heartworms – Parasitic infections.", "Common Causes in Cats:", "Asthma – Most common cause (wheezing, coughing fits).", "Hairballs – Often confused with coughing (usually involves gagging).", "Respiratory Infections – Feline herpesvirus, calicivirus.", "Heart Disease – Hypertrophic cardiomyopathy (HCM).", "Lungworms or Heartworms – Less common but possible.", "Foreign Body or Irritants – Inhaled dust, smoke, or grass."], "Treatment Protocol": "1. Mild Cases (Allergies, Mild Infections) Humidifier – Helps loosen mucus.  Honey (for dogs) – Soothes throat irritation (½ tsp for small dogs, 1 tsp for large dogs).  Antihistamines (e.g., Benadryl) – Only if vet-approved.  2. Infections (Bacterial/Viral) Antibiotics (e.g., Doxycycline for kennel cough).  Antivirals (for feline respiratory infections).  Cough suppressants (e.g., Robitussin DM – only under vet guidance).  3. Chronic Conditions (Asthma, Heart Disease) Steroids (Prednisolone) or inhalers (Fluticasone for cats).  Heart medications (if caused by heart disease).  Bronchodilators (Terbutaline, Albuterol).  4. Foreign Objects or Worms Endoscopic removal (if something is stuck).  Deworming medication (for lungworms/heartworms).", "Prevention Methods": "Vaccinate dogs (Bordetella, Parainfluenza for kennel cough). ✔ Keep cats indoors (reduces asthma triggers, infections). ✔ Use air purifiers (HEPA filters reduce allergens). ✔ Avoid smoke & strong fragrances (perfumes, cleaning sprays). ✔ Regular vet check-ups (early detection of heart/lung issues). ✔ Prevent heartworms (monthly preventatives like Heartgard).", "Standard Prescription": ["1. Inj. Bovixon/ Acicef 3 – 0.1ml/kg, Im,  Twice Daily.", "2. Inj. Mpain/Set 101- 0.1 ml/kg, SC, Once Daily.  (if fever onl)", "3. Inj. Histavet – 0.1 ml/kg, IM, twice daily.", "4. Tab. Mkast 4mg – 1 Tab/5kg bwt once daily.", "5. Syp. Tofen – 1ml/kg once daily, fed orally."], "Last Updated": "7/17/2025", "_id": 23}, {"Name": "Cystitis (Cat: 3kgs)", "Type": "Bacterial", "Animal": "Pet and Companion Animals", "Severity": "Mild", "Contagion": "✅ Non-Contagious", "Symptoms": ["Frequent urination,  straining to urinate,  blood in the urine,  and changes in urine odor. Some animals might also show signs of pain or discomfort,  such as excessive licking of the genital area,  or lethargy and fever.", "Frequent urination (but only passing small amounts).", "Straining to urinate (may be confused with constipation).", "Blood in urine (hematuria).", "Cloudy or strong-smelling urine.", "Licking the genital area excessively.", "Urinating outside the litter box (cats).", "Pain or crying while urinating.", "Lethargy,  fever,  loss of appetite (in severe cases).", "⚠️ Emergency Signs:", "Complete inability to urinate (urinary blockage,  especially in male cats—life-threatening!). Vomiting,  extreme lethargy (may indicate kidney involvement)."], "Causes": ["1. Bacterial Infections", "Most commonly caused by bacteria like E. coli,  Proteus,  Staphylococcus,  and Klebsiella.", "2. Physical or Chemical Irritation", "Bladder stones or crystals.", "Certain medications or chemicals in the urine.", "3. Anatomical & Environmental Factors", "Poor hygiene (especially in females with a shorter urethra).", "Infrequent urination (holding urine).", "Dirty litter boxes or living areas.", "4. Other Causes", "Stress-related inflammation (especially in cats).", "Tumors or polyps in the bladder.", "Fungal infections (rare)."], "Treatment Protocol": ["Antibiotics (if bacterial) – Common options include: Nitrofurantoin, Trimethoprim-sulfamethoxazole, Fosfomycin (single-dose),", "Ciprofloxacin (for resistant cases)", "Pain Relief:", "Phenazopyridine (relieves burning but turns urine orange)", "Home Remedies:", "Drink plenty of water to flush out bacteria.", "Apply a heating pad to ease pelvic pain.", "Avoid caffeine, alcohol, and spicy foods (can irritate the bladder).", "Drink cranberry juice (may help prevent bacteria from sticking to the bladder wall).", "Recurrent or Severe Cases", "Longer antibiotic course or low-dose preventive antibiotics.", "Postmenopausal women may benefit from vaginal estrogen therapy.", "Acidification of Urine."], "Prevention Methods": ["✅ Provide clean, fresh water at all times.", "✅ Encourage frequent urination (regular walks/litter box access).", "✅ Maintain good genital hygiene.", "✅ Feed a urinary-friendly diet.", "✅ Manage stress (especially in cats).", "✅ Avoid holding urine too long.", "✅ Schedule regular veterinary exams."], "Standard Prescription": ["Cat- 3kg", "1. Inj. Acicef-4 (500mg)", "0.20ml, Intra Muscularly, Once daily.", "2. Syrup. Urokit Plus", "3 ml, Twice daily for 15 Days.", "3. Inj. Tracid vet – 10ml", "0.35 ml, Intra Muscularly, Twice Daily (stop if no blood in urine)", "4. Inj. Normasol – 1000ml", "70ml, IV/SC three hourly, if improve then increase interval.", "5. Inj. Sedil-2ml", "50uml, Intra Muscularly, Once daily, 3 days.", "6. Powder. Ammonium Chloride", "UB wash with Normal Saline (5gm+50ml Saline)"], "Last Updated": "7/19/2025", "_id": 24}, {"Name": "Dermatitis", "Type": "Skin Diseases", "Animal": "Pet and Companion Animals", "Severity": "Moderate", "Contagion": "⚠️ Contagious", "Symptoms": ["Symptoms of Dermatitis", "- Itching (pruritus): Excessive scratching, licking, or chewing.", "- Redness (erythema) and swelling.", "- Hair loss (alopecia) from scratching.", "- Scabs, crusts, or oozing lesions.", "- Odor (in bacterial/yeast infections).", "- Dry, flaky skin or greasy skin (depending on the cause)."], "Causes": ["Common Causes of Dermatitis in Cats & Dogs:", "Allergic Dermatitis", "- Flea Allergy Dermatitis (FAD): Hypersensitivity to flea saliva.", "- Atopic Dermatitis: Environmental allergies (pollen, dust mites, mold).", "- Food Allergies: Reactions to certain proteins (e.g., beef, chicken, dairy).", "Parasitic Dermatitis", "- Fleas, mites (e.g., Sarcoptes, Demodex), or ticks.", "Bacterial or Fungal Infections", "- Pyoderma (bacterial infection, often secondary to allergies).", "- Malassezia dermatitis (yeast infection).", "Contact Dermatitis", "- Irritants like chemicals, shampoos, or plants.", "- Autoimmune or Hormonal Causes", "- Hypothyroidism, Cushing’s disease, or pemphigus."], "Treatment Protocol": ["Flea Control  Monthly preventatives (e.g., Anti Parasitic Shampoo bath, grooming, Trimming).", "Treat environment (wash bedding, vacuum).", "Allergy Management  Antihistamines (e.g., diphenhydramine).", "Steroids (prednisone) for severe inflammation.", "Immunotherapy (allergy shots for atopy).", "Hypoallergenic diet trials (for food allergies).", "Antibiotics/Antifungals  Oral or topical (e.g., cephalexin for bacteria, ketoconazole for yeast).", "Medicated Shampoos  Chlorhexidine (antibacterial), miconazole (antifungal), or oatmeal (soothing).", "Parasite Treatment  Miticides for mites (e.g., ivermectin for sarcoptic mange).", "Omega-3 Fatty Acids  Supplements to improve skin barrier function.", "Environmental Adjustments  Avoid irritants (e.g., harsh cleaners, certain plants)."], "Prevention Methods": ["Regular flea/tick prevention.", "Balanced diet with skin-supporting nutrients.", "Routine grooming and bathing (use pet-safe products)."], "Standard Prescription": ["Dermatitis/ Myiasis, Cat, 3kgs", "1. Inj. M Pain Vet 0.5% - 0.15ml, SC, Once daily", "2. Inj. Streptopen – 2.5gm- 0.5ml, IM, Twice Daily", "3. Inj. Phenadryl – 0.5 ml, IM, Once daily", "4. Oint. Neobacrin/Dermasol N/ Pow. Neocin apply Locally Twice daily.", "5. Inj. Parasitin/ Acimec 1% - 0.15ml SC 5 days intervals/ Tab Ivera/Alice (6mg)- 0.3 part", "5. Dressing twice daily –", "H2O2 – 1st One/Two Days, Povin – Twice daily- 3-5days, Then Once daily.", "Fly Repellent – Oil of Turpentine/Ectonil(1.5gm/liter water) Spray/Nephthalin- hanging in kennel"], "Last Updated": "8/20/2025", "_id": 25}, {"Name": "Diabetes", "Type": "Metabolic", "Animal": "Pet and Companion Animals", "Severity": "Moderate", "Contagion": "✅ Non-Contagious", "Symptoms": ["Increased thirst and urination (polydipsia & polyuria)", "Weight loss despite a normal or increased appetite.", "Lethargy and weakness", "Cloudy eyes (especially cataracts in dogs).", "Recurrent infections (urinary,  skin)", "Sweet-smelling breath (due to ketones in severe cases)."], "Causes": ["Obesity", "Pancreatic damage (inflammation,  immune-mediated)", "Genetic predisposition (Poodles,  Burmese cats)"], "Treatment Protocol": ["Insulin therapy: Most diabetic pets require daily insulin injections.", "Diet management:", "Dogs: High-fiber, complex-carb diets.", "Cats: Low-carb, high-protein diets (helps some cats go into remission).", "Regular exercise: Helps regulate blood sugar levels.", "Oral medications (rarely used, mostly in cats with mild diabetes)."], "Prevention Methods": ["Healthy body weight", "Low-carb, high-protein diets", "Regular glucose checks in at-risk pets"], "Standard Prescription": ["\"1. Tab. Atova-10,", "1 tab/ 10-20 kg, once daily for months (cont)."], "Last Updated": "7/23/2025", "_id": 26}, {"Name": "Diarrhea (Cat: 3kgs)", "Type": "Common", "Animal": "Pet and Companion Animals", "Severity": "Moderate", "Contagion": "⚠️ Contagious", "Symptoms": ["Loose, watery, or frequent stools", "Blood or mucus in stool", "Vomiting", "Lethargy or weakness", "Loss of appetite", "Dehydration (dry gums, sunken eyes, skin tenting)", "Weight loss (if chronic", "Bloody diarrhea (hematochezia or melena)", "Severe vomiting", "Lethargy or collapse"], "Causes": ["1. Dietary Causes", "Dietary indiscretion (eating garbage, spoiled food, or foreign objects)", "Sudden diet changes", "Food intolerance or allergies", "High-fat treats or table scraps.", "2. Infections", "Bacterial (Salmonella, E. coli, Campylobacter)", "Viral (Parvovirus in dogs, Panleukopenia in cats)", "Parasitic (Giardia, Coccidia, Roundworms, Hookworms)", "3. Medical Conditions", "Inflammatory bowel disease (IBD)", "Pancreatitis", "Liver or kidney disease", "Cancer (e.g., intestinal lymphoma)", "Endocrine disorders (hyperthyroidism in cats, hypoadrenocorticism in dogs)", "4. Other Causes", "Stress or anxiety (boarding, travel, new pets)", "Toxins or poisoning (plants, chemicals, human medications)", "Antibiotics or medications (disrupting gut flora)"], "Treatment Protocol": ["1. At-Home Care (Mild Cases)", "✔ Fasting – Withhold food for 12–24 hours (water should still be offered).", "✔ Bland Diet – After fasting, feed:", "Boiled chicken + white rice (dogs)", "Boiled chicken + plain pumpkin (not pie filling) (cats)", "Commercial GI diets (e.g., Hill’s I/D, Royal Canin GI)", "✔ Probiotics – Helps restore gut flora (e.g., FortiFlora, Proviable).", "✔ Hydration – Offer small amounts of water frequently; use Pedialyte (unflavored) if needed.", "2. Medical Treatment (Severe Cases)", "Antibiotics (if bacterial infection is suspected, e.g., Ciprofloxacin, Marbofloxacin, Sulfonamides, Ceftriaxone, Metronidazole)", "Anti-parasitic drugs (for worms, Giardia, etc.)", "Rehydration: Oral Saline, Soft food, IV or Subcutaneous Fluids (for dehydration- Cholera Saline, Ringer's lactate)", "Anti-nausea meds (e.g., Ondansetron)", "Prescription diets (for food allergies or IBD)"], "Prevention Methods": ["1. At-Home Care (Mild Cases)", "✔ Fasting – Withhold food for 12–24 hours (water should still be offered).", "✔ Bland Diet – After fasting, feed:", "Boiled chicken + white rice (dogs)", "Boiled chicken + plain pumpkin (not pie filling) (cats)", "Commercial GI diets (e.g., Hill’s I/D, Royal Canin GI)", "✔ Probiotics – Helps restore gut flora (e.g., FortiFlora, Proviable).", "✔ Hydration – Offer small amounts of water frequently; use Pedialyte (unflavored) if needed.", "2. Medical Treatment (Severe Cases)", "Antibiotics (if bacterial infection is suspected, e.g., Ciprofloxacin, Marbofloxacin, Sulfonamides, Ceftriaxone, Metronidazole)", "Anti-parasitic drugs (for worms, Giardia, etc.)", "Rehydration: Oral Saline, Soft food, IV or Subcutaneous Fluids (for dehydration- Cholera Saline, Ringer's lactate)", "Anti-nausea meds (e.g., Ondansetron)", "Prescription diets (for food allergies or IBD)"], "Standard Prescription": ["Cat: 3kg (Non Infectious)", "1. Tab. D-con- 1 tab/2.5-3 kg Body Weight.", "2. Pow. PA Gut – 4-5 gm with per kg Feed/Drinking water.", "3. Pow. PA lyte – 10gm/ 2 Liter drinking water and feed QS as frequent as defecation.", "4. Inj Cholera Saline (if severe dehydration)", "20-40ml, IV, Twice Daily", "Infectious Diarrhea: Cat-3kgs (Fever Present)", "1. Syrup. Ciprocin Vet- 0.3ml fed Orally Twice daily", "2. Tab. D-con- 1 tab/2.5-3 kg Body Weight.", "3. Pow. PA Gut – 4-5 gm with per kg Feed/Drinking water.", "4. Pow. PA lyte – 10gm/ 2 Liter drinking water and feed QS as frequent as defecation.", "5. . Inj Cholera Saline (if severe dehydration)", "20-40ml, IV, Twice Daily."], "Last Updated": "7/27/2025", "_id": 27}, {"Name": "Drug Poisoning", "Type": "Poisoning", "Animal": "Pet and Companion Animals", "Severity": "Severe", "Contagion": "✅ Non-Contagious", "Symptoms": ["Signs vary depending on the drug but may include:", "Vomiting,  diarrhea", "Lethargy or hyperactivity", "Tremors,  seizures", "Difficulty breathing", "Pale gums,  jaundice", "Irregular heartbeat", "Collapse,  coma"], "Causes": ["1. Human Medications", "NSAIDs (Ibuprofen,  Naproxen) → Kidney failure,  ulcers.", "Acetaminophen (Tylenol) → Liver damage (cats),  red blood cell damage (dogs)", "Antidepressants (SSRIs,  TCAs) → Seizures,  tremors,  heart issues.", "ADHD Medications (Amphetamines,  Methylphenidate) → Hyperactivity,  heart failure", "Benzodiazepines (Xanax,  Valium) → Sedation,  incoordination (can reverse with flumazenil)", "Beta-blockers & Blood Pressure Meds → Low heart rate,  collapse", "2. Veterinary Medications", "Ivermectin (Toxic in herding breeds due to MDR1 gene mutation) → Neurological signs", "Rimadyl (Carprofen) Overdose → Liver/kidney damage", "Flea/Tick Medications (Permethrin in cats) → Seizures,  tremors", "3. Illicit & Recreational Drugs", "Marijuana (THC) → Lethargy,  incoordination,  coma", "Cocaine,  Methamphetamines → Hyperactivity,  seizures,  death", "Opioids (Fentanyl,  Oxycodone) → Respiratory depression (naloxone reverses effects)", "4. Other Toxins", "Xylitol (Sugar-free gum,  candy) → Hypoglycemia,  liver failure (dogs)", "Caffeine (Coffee,  energy drinks) → Heart arrhythmias,  seizures"], "Treatment Protocol": ["1. Immediate First Aid", "Do NOT induce vomiting unless instructed by a vet (some toxins cause more harm if vomited).", "Call a vet or pet poison hotline (e.g., ASPCA Poison Control: 888-426-4435).", "Bring the drug packaging to the vet for identification.", "2. Veterinary Treatment", "Decontamination (activated charcoal, IV fluids)", "Antidotes (e.g., Naloxone for opioids, Flumazenil @ Dosage: 0.01–0.02 mg/kg IV (intravenous), slowly.for benzodiazepines)", "Supportive care (anti-seizure meds, oxygen, blood tests)"], "Prevention Methods": ["Keep all medications out of reach (closed cabinets, child-proof containers).", "Never give human drugs to pets without veterinary approval.", "Be cautious with flavored pet meds (pets may chew open bottles).", "Store illicit drugs securely (pets can ingest edibles, powders, or paraphernalia).", "Check for pet-safe alternatives (e.g., avoid xylitol in toothpaste)."], "Standard Prescription": ["1. Injection Resurge IV - 0.5mg/5ml", "1ml@ 10-20 kg with Normal Saline one Hours intervals.", "2. Inj. Barbit - 0.1ml, IM, Once-Twice daily Depends on Condition.", "3. Inj. Hartsol - 20-40ml/IV- Two-three times daily upto recovery.", "4. Oxygen Supply."], "Last Updated": "7/29/2025", "_id": 28}, {"Name": "Dry Eye", "Type": "Genetic", "Animal": "Pet and Companion Animals", "Severity": "Moderate", "Contagion": "✅ Non-Contagious", "Symptoms": "Excessive blinking,  squinting,  redness,  a thick,  often yellowish discharge,  and corneal ulcers,  dull or cloudy eyes,  rubbing at the eyes or face. In severe cases,  vision may be impaired.", "Causes": "Genetic,  Injury,  Nutritional Deficeincy", "Treatment Protocol": ["Sterile eyewash:", "Flushing the eyes with sterile eyewash can help remove foreign bodies.", "Lubricating Eye drops."], "Prevention Methods": "Hygiene, prevent trauma, treat systemic infections.", "Standard Prescription": ["1. Eye Drop Teargen – wash the eye twice daily, 5-7 Days.", "2. E/D. Fresh Tear – 3-4 drops 3-4 times daily, 5-7 Days."], "Last Updated": "7/18/2025", "_id": 29}, {"Name": "Ear Hematoma (Cat: 3 kg)", "Type": "Ear Infections", "Animal": "Pet and Companion Animals", "Severity": "Moderate", "Contagion": "✅ Non-Contagious", "Symptoms": "An ear hematoma, also known as cauliflower ear, is a collection of blood under the skin of the ear flap, often caused by trauma. Symptoms include swelling, pain, and a visible lump on the ear.", "Causes": ["Trauma:", "Blunt force trauma to the ear, such as from contact sports (boxing, wrestling, rugby), falls, or accidents, is the most common cause.", "Head Shaking/Scratching:", "Excessive head shaking or scratching, often due to ear infections, allergies, or parasites, can rupture blood vessels in the ear.", "Infections:", "Bacterial or fungal ear infections can lead to inflammation and irritation, causing the dog to scratch or shake its head, potentially resulting in a hematoma.", "Allergies:", "Allergic reactions can cause itching and irritation, prompting scratching and head shaking that may lead to a hematoma.", "Foreign Bodies:", "Objects lodged in the ear canal can cause irritation and lead to head shaking and scratching.", "Underlying Medical Conditions:", "Conditions like Cushing's disease or clotting disorders can increase the risk of hematomas."], "Treatment Protocol": ["Drainage:", "A veterinarian may drain the hematoma using a needle or incision.", "Suturing:", "In some cases, sutures may be placed to keep the ear flap flat and prevent reaccumulation of fluid.", "Pressure Bandaging:", "A pressure bandage is often applied after drainage to minimize swelling and prevent recurrence.", "Medications:", "Antibiotics may be prescribed to treat or prevent infection, and pain medication may be given to manage discomfort.", "Surgery:", "For large or recurring hematomas, surgery may be necessary to remove the blood clot and repair the ear.", "Treat Underlying Cause:", "Addressing the root cause of the hematoma (e.g., ear infection, allergies) is essential for preventing recurrence.", "Surgical wound management with."], "Prevention Methods": ["Prevention focuses on protecting the ear from injury and managing underlying conditions that cause head shaking or scratching.", "Protect Ears During Activities:", "Use protective headgear or take precautions during high-risk activities like contact sports.", "Manage Underlying Conditions:", "Treat ear infections, allergies, and other conditions promptly to reduce scratching and head shaking.", "Regular Ear Cleaning:", "Clean your pet's ears regularly with a veterinarian-approved ear cleaner to prevent infections and irritation.", "Supervise Play:", "Supervise interactions with other animals to prevent ear injuries during play.", "Consider Protective Headgear:", "For pets prone to ear injuries, consider using protective headgear designed for dogs or cats."], "Standard Prescription": ["Cat: 3 kg", "1.  Syp. Cefixime – 100mg, 1.25 ml twice daily, 5-7 Days.", "2. Inj. Mel vet 0.5%- 0.2 ml sc once daily- 1-2 Days, 5-7 Days.", "3. Syp. Alatrol – 2.5ml (1/2tsp) once daily, 5-7 Days.", "4. Inj. Parasitin- 0.05ml per kg, 7 Days Apart.", "5. Dress the wouned area with Viodin Twice daily after Drainage & Surgial Correction."], "Last Updated": "7/19/2025", "_id": 30}, {"Name": "Ear Mites (Cat: 3 kg)", "Type": "Parasitic", "Animal": "Pet and Companion Animals", "Severity": "Moderate", "Contagion": "⚠️ Contagious", "Symptoms": ["Intense itching: Pets will scratch their ears, shake their heads, and may even bite or scratch at the affected ear.", "Dark, waxy discharge: This discharge is often described as looking like coffee grounds.", "Redness and inflammation: The ear canal and flap may be red and inflamed.", "Hair loss: Excessive scratching and head shaking can lead to hair loss around the ears and head.", "Head tilt: Some animals may tilt their heads to one side due to discomfort.", "Pain and sensitivity: The ears may be painful to the touch, and the pet may be reluctant to be petted around the head.", "Secondary infections: Ear mites can create an environment that allows for bacterial or fungal infections, leading to additional symptoms like a foul odor."], "Causes": ["Contagious:", "Ear mites are highly contagious and spread through direct contact with infected animals, including dogs, cats, and even wild animals.", "Environmental:", "Mites can also be picked up from contaminated environments like bedding, grooming tools, and boarding facilities.", "Low Immunity:", "Animals with weakened immune systems may be more susceptible to infestations."], "Treatment Protocol": ["Treatment involves eliminating the mites with antiparasitic medications, cleaning the ears, and preventing reinfestation. .", "Cleaning & Disinfection- Ear Cleaner, H2O2/Tinc. Iodine, Saline, Liquid Antibiotics (IV)", "Topical antibiotics- ear Drop- Civodex/Moxiclox/Opsophenicol", "Systemic Antibiotics if need (if temperature present)", "Antihistamin/+ NSAID / Steroids (single dose, never overdose)", "C & D of Kennel.", "Fly Repellent – Oil of Turpentine, Ectonil(1.5gm/liter water) Spray, Nephthalin- hanging in pet house."], "Prevention Methods": ["Ear Cleaning:", "Cleaning the ear canal with a veterinary-recommended solution is crucial to remove debris and allow medications to work effectively.", "Natural Remedies:", "Mineral oil or olive oil: Can be used to soothe the ear and help loosen debris.", "Diluted apple cider vinegar: A 50:50 solution with water can be used to clean the ears.", "Garlic and oil: Some people crush garlic cloves in oil and let it marinate before applying to the ear.", "Environmental Cleaning:", "Thoroughly clean your pet's bedding, kennel, and living area to eliminate any stray mites.", "Prevention:", "Regularly treat pets with flea, tick, and heartworm preventatives that also target mites."], "Standard Prescription": ["Cat: 3 kg", "1. OTI Ear Cleaner- Apply in Ear and Clean ear with soft gauze/  cotton Bud.", "2. Ear Drop – Moxidex 3/4drops thrice daily, 5-7 Days.", "3. Syp. Alatrol – 2.5ml (1/2tsp) once daily, 5-7 Days.", "4. Inj
