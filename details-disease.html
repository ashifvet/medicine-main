eral or high-magnesium foods.", "✅ Routine urinalysis to detect crystal formation.", "✅ Monitor urine pH as recommended by vet.", "✅ Weight control and exercise.", "✅ Regular vet visits, especially for at-risk breeds."], "Standard Prescription": ["Cat- 3kg", "1. Inj. Acicef-4 (500mg)", "0.20ml, Intra Muscularly, Once daily.", "2. Syrup. Urokit Plus", "3 ml, Twice daily for 15 Days.", "3. Inj. Tracid vet – 10ml", "0.35 ml, Intra Muscularly, Twice Daily (stop if no blood in urine)", "4. Inj. Normasol – 1000ml", "70ml, IV/SC three hourly, if improve then increase interval.", "5. Inj. Sedil-2ml", "50uml, Intra Muscularly, Once daily, 3 days.", "6. Powder Ammonium Chloride", "UB wash with Normal Saline (5gm+50ml Saline)"], "Last Updated": "7/19/2025", "_id": 94}, {"Name": "Uveitis (inflammation inside your eye): (Cat: 3Kgs)", "Type": "Eye Diseases", "Animal": "Pet and Companion Animals", "Severity": "Moderate", "Contagion": "✅ Non-Contagious", "Symptoms": ["Ocular Pain (squinting,  rubbing the eye)", "Redness (conjunctival and scleral blood vessel dilation)", "Cloudy or Bluish Eye (corneal edema)", "Constricted Pupil (miosis) or irregular pupil shape", "Hyphema (blood in the anterior chamber)", "Aqueous Flare (hazy appearance due to protein leakage)", "Photophobia (sensitivity to light)", "Tearing or Discharge", "Vision Loss (if severe or chronic)"], "Causes": ["1. Infectious Causes", "Bacterial: Leptospirosis,  Lyme disease,  brucellosis,  bartonellosis,  systemic infections (e.g.,  sepsis)", "Viral: Feline leukemia virus (FeLV),  feline immunodeficiency virus (FIV),  canine distemper,  feline infectious peritonitis (FIP)", "Fungal: Blastomycosis,  histoplasmosis,  cryptococcosis,  coccidioidomycosis", "Protozoal: Toxoplasmosis (cats),  leishmaniasis (dogs)", "Parasitic: Eye worms (e.g.,  Dirofilaria immitis in dogs)", "2. Immune-Mediated & Autoimmune Causes", "Lens-induced uveitis (due to cataract leakage)", "Immune-mediated diseases (e.g.,  uveodermatologic syndrome in Akitas,  Siberian Huskies)", "3. Trauma or Eye Damage", "Blunt or penetrating injuries (e.g.,  scratches,  foreign bodies)", "Corneal ulcers leading to secondary uveitis", "4. Cancer (Neoplasia)", "Lymphoma,  melanoma,  metastatic tumors", "5. Idiopathic (Unknown Cause)", "Some cases have no identifiable cause", "6. Common Cold,  Cough,  Respiratory Secretory conditions Predispose this condition."], "Treatment Protocol": ["The goal is to reduce inflammation, control pain, and treat the underlying cause.", "1. Anti-inflammatory Medications", "Corticosteroids (topical: prednisolone acetate; oral/systemic: prednisone)", "NSAIDs (e.g., flurbiprofen for dogs, but avoid in cats due to toxicity risk)", "2. Pain Management", "Atropine (dilates the pupil, relieves spasms, but contraindicated in glaucoma)", "Oral pain relievers (e.g., gabapentin, tramadol)", "3. Treat Underlying Cause", "Antibiotics (e.g., doxycycline for tick-borne diseases)", "Antifungals (e.g., itraconazole for blastomycosis)", "Antiparasitics (e.g., clindamycin for toxoplasmosis)", "Immunosuppressants (for autoimmune uveitis)", "4. Surgery (if needed)", "Removal of foreign bodies or tumors"], "Prevention Methods": ["Vaccinate against preventable diseases (e.g., canine distemper, FeLV)", "Parasite Control (tick/flea prevention, heartworm prevention)", "Avoid Trauma (supervise outdoor activities, prevent fights)", "Regular Vet Check-ups (especially for breeds prone to autoimmune uveitis).", "Avoid Stress & respiratory Diseases exposure."], "Standard Prescription": ["Cat: 3 kg 1. Eye drop Teargen – 2-3 drops, wash the eye twice daily, 5-7 days.", "2. E/D. Moxiflox – 2 Drops, Apply locally three/four times daily, 5-7 days.", "3. Inj. Mel vet 0.5%- 0.15 ml sc once daily, 2-3 days.", "4. Syp. Cefixime – 100mg, 1.25 ml twice daily, fed orally, 5-7 days.", "5. Syp. Alatrol – ½ tsp once daily 7 days. \""], "Last Updated": "7/27/2025", "_id": 95}, {"Name": "Vaginitis (Cat: 3Kgs)", "Type": "Bacterial", "Animal": " function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function highlight(text, terms){
  if(!terms.length) return escapeHtml(text);
  let escaped = escapeHtml(text);
  terms.forEach(t => {
    if(!t) return;
    const re = new RegExp('(' + t.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ')', 'ig');
    escaped = escaped.replace(re, '<mark>$1</mark>');
  });
  return escaped;
}

function asList(val){
  return Array.isArray(val) ? val : (val ? [val] : []);
}

function buildAzNav(availableLetters){
  const letters = "ABCDEFGHIJKLMNOPQRSTUVWXYZ".split('');
  azNav.innerHTML = letters.map(L => {
    const has = availableLetters.has(L);
    return `<button data-letter="${L}" class="${has ? '' : 'disabled'}" ${has ? '' : 'disabled'}>${L}</button>`;
  }).join('');
}

function renderList(items, terms){
  if(items.length === 0){
    listEl.innerHTML = '<div class="no-results">No diseases match your search.</div>';
    buildAzNav(new Set());
    return;
  }
  let html = '';
  let lastLetter = null;
  const availableLetters = new Set();
  items.forEach(r => {
    const letter = r.Name.trim()[0].toUpperCase();
    const bucket = /[A-Z]/.test(letter) ? letter : '#';
    availableLetters.add(bucket);
    if(bucket !== lastLetter){
      html += `<div class="letter-header" id="letter-${bucket}">${bucket}</div>`;
      lastLetter = bucket;
    }
    html += `<button class="med-item${r._id === activeId ? ' active' : ''}" data-id="${r._id}">
      <div class="med-name">${highlight(r.Name, terms)}</div>
      <div class="med-brand">${highlight(r.Type, terms)}${r.Animal ? ' &middot; ' + highlight(r.Animal, terms) : ''}</div>
    </button>`;
  });
  listEl.innerHTML = html;
  buildAzNav(availableLetters);
}

function renderSection(title, dotLabel, value, extraClass){
  const items = asList(value);
  if(items.length === 0) return '';
  const body = items.length > 1 || (items.length === 1 && items[0].length > 140)
    ? `<ul>${items.map(i => `<li>${escapeHtml(i)}</li>`).join('')}</ul>`
    : `<p>${escapeHtml(items[0])}</p>`;
  return `
    <div class="section-block ${extraClass || ''}">
      <div class="section-title"><span class="dot">${dotLabel}</span>${title}</div>
      ${body}
    </div>
  `;
}

function renderDetail(r){
  activeId = r._id;
  const contagionClass = /non/i.test(r.Contagion) ? 'contagion-no' : 'contagion-yes';

  const sectionsHtml = [
    renderSection('Symptoms', 'S', r.Symptoms),
    renderSection('Causes', 'C', r.Causes),
    renderSection('Treatment Protocol', 'T', r['Treatment Protocol']),
    renderSection('Prevention Methods', 'P', r['Prevention Methods']),
    renderSection('Standard Prescription', '&#8478;', r['Standard Prescription'], 'rx')
  ].join('');

  contentEl.innerHTML = `
    <button class="back-btn" id="backBtn">&larr; Back to list</button>
    <div class="card">
      <div class="card-eyebrow">${escapeHtml(r.Type)}</div>
      <h2>${escapeHtml(r.Name)}</h2>
      <div class="tags">
        ${r.Animal ? `<span class="tag">${escapeHtml(r.Animal)}</span>` : ''}
        ${r.Severity ? `<span class="tag severity">${escapeHtml(r.Severity)}</span>` : ''}
        ${r.Contagion ? `<span class="tag ${contagionClass}">${escapeHtml(r.Contagion)}</span>` : ''}
      </div>
      <div class="sections">${sectionsHtml}</div>
      ${r['Last Updated'] ? `<div class="card-footer">Last updated: ${escapeHtml(r['Last Updated'])}</div>` : ''}
    </div>
  `;
  document.getElementById('backBtn').addEventListener('click', () => {
    sidebarEl.classList.remove('hidden');
    contentEl.classList.add('hidden');
  });
  applyFilter(searchBox.value, false);
  contentEl.scrollTop = 0;
  if(window.innerWidth <= 760){
    sidebarEl.classList.add('hidden');
    contentEl.classList.remove('hidden');
  }
}

function textOf(val){
  return asList(val).join(' ');
}

function applyFilter(query, resetScroll){
  const q = query.trim().toLowerCase();
  const terms = q.length ? q.split(/\s+/).filter(Boolean) : [];
  let filtered;
  if(!q){
    filtered = DATA;
  } else {
    filtered = DATA.filter(r => {
      const hay = (r.Name + ' ' + r.Type + ' ' + r.Animal + ' ' + textOf(r.Symptoms) + ' ' + textOf(r.Causes)).toLowerCase();
      return terms.every(t => hay.includes(t));
    });
  }
  resultCount.textContent = filtered.length + (filtered.length === 1 ? ' disease' : ' diseases');
  clearSearch.style.display = q ? 'inline' : 'none';
  renderList(filtered, terms);
  if(resetScroll) listEl.scrollTop = 0;
}

listEl.addEventListener('click', (e) => {
  const btn = e.target.closest('.med-item');
  if(!btn) return;
  const id = parseInt(btn.dataset.id, 10);
  const record = DATA.find(r => r._id === id);
  if(record) renderDetail(record);
});

searchBox.addEventListener('input', () => applyFilter(searchBox.value, true));

clearSearch.addEventListener('click', () => {
  searchBox.value = '';
  applyFilter('', true);
  searchBox.focus();
});

azNav.addEventListener('click', (e) => {
  const btn = e.target.closest('button');
  if(!btn || btn.disabled) return;
  const el = document.getElementById('letter-' + btn.dataset.letter);
  if(el) el.scrollIntoView({block:'start'});
});

document.addEventListener('keydown', (e) => {
  if(e.key === '/' && document.activeElement !== searchBox){
    e.preventDefault();
    searchBox.focus();
  }
  if(e.key === 'Escape' && document.activeElement === searchBox){
    searchBox.value = '';
    applyFilter('', true);
  }
});

applyFilter('', true);
</script>
</body>
</html>
