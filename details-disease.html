. Parasitin- 0.05ml per kg, 7 Days Apart."], "Last Updated": "7/18/2025", "_id": 31}, {"Name": "Ear Swelling (Cat: 3 kg)", "Type": "Ear Infections", "Animal": "Pet and Companion Animals", "Severity": "Moderate", "Contagion": "⚠️ Contagious", "Symptoms": ["Head shaking, scratching or rubbing the ear, head tilting, and visible swelling or redness.", "Visible swelling (ear flap or canal)", "Redness & warmth around the ear", "Head shaking or tilting", "Scratching or pawing at the ear", "Foul odor or discharge (pus, wax, blood)", "Pain or sensitivity when touched", "Hearing loss or balance issues (if inner ear affected)", "Crusting or scabbing (from scratching)"], "Causes": ["Ear Infections (Otitis Externa/Media/Interna) – Bacterial, yeast, or fungal infections.", "Allergies – Food or environmental allergies causing inflammation.", "Ear Mites – Common in cats and dogs, leading to irritation and swelling.", "Foreign Bodies – Grass seeds, dirt, or insects stuck in the ear canal.", "Hematoma (Aural Hematoma) – Blood-filled swelling due to trauma or excessive scratching.", "Trauma or Injury – Bites, scratches, or excessive head shaking.", "Polyps or Tumors – Benign or malignant growths in the ear canal.", "Autoimmune Disorders – Rare conditions causing inflammation."], "Treatment Protocol": ["Ear drops (antibiotics or antifungals), pain relievers", "Antibiotics, decongestants, ear cleaning.", "Antibiotics (oral or topical) for bacterial infections.", "Antifungals (for yeast infections).", "Ear mite medication (e.g., Revolution, Bravecto).", "Steroids or anti-inflammatories (for swelling/allergies).", "Ear flushing (for removing debris or foreign objects).", "Surgery (for hematomas, polyps, or severe infections).", "Home Care", "Cleaning with vet-approved ear cleaners (avoid Q-tips).", "Warm compresses (for hematomas).", "E-collar (cone) to prevent scratching."], "Prevention Methods": ["Prevent trauma, parasite control, allergy management", "✔ Regular ear cleaning (use pet-safe solutions).", "✔ Dry ears after baths/swimming (moisture breeds infections).", "✔ Treat allergies early (hypoallergenic diets, antihistamines).", "✔ Check for parasites (flea/mite prevention).", "✔ Avoid inserting objects into the ear canal.", "✔ Routine vet check-ups (especially for floppy-eared breeds)."], "Standard Prescription": ["Cat: 3 kg", "1. OTI Ear Cleaner- Apply in Ear and Clean ear with soft gauze/  cotton Bud.", "2. Ear Drop – Moxidex 3/4drops thrice daily, 5-7 Days.", "3. Syp. Cefixime – 100mg, 1.25 ml twice daily, 5-7 Days.", "4. Inj. Mel vet 0.5%- 0.2 ml sc once daily- 1-2 Days, 5-7 Days.", "5. Syp. Alatrol – 2.5ml (1/2tsp) once daily, 5-7 Days.", "6. Inj. Parasitin- 0.05ml per kg, 7 Days Apart."], "Last Updated": "7/18/2025", "_id": 32}, {"Name": "Ectoparasitic Skin Diseases/ Ectoparasitosis/ Ectoparasitic Infestation", "Type": "Skin Diseases", "Animal": "Pet and Companion Animals", "Severity": "Moderate", "Contagion": "⚠️ Contagious", "Symptoms": ["Skin issues- itching, redness, dryness and flakiness, skin infections, hives or welts, hair loss in patches hot spots, red, oozing bald patches;", "gastrointestial problems- vomiting, diarrhea, increased gas loss of appetite, straining to defecate;", "ear infection- inflammation and redness of the ear, recurrent ear infections;", "Other symptoms- sneezing, facial swelling, eye discharge, weight loss, lack of energy, in rare cases anaphylaxis can occur."], "Causes": ["Parasitic infestation predisposed by Allergic Food, Exposure to external allergens, unhygienic managemnet, humidity etc.", "Mange/Mite/Flea etc)/ Maggot Formation / Myiasis infestation."], "Treatment Protocol": "Hot Spots/ wound – dressing with Tin Iodine / CuSo4 (2-5%) (if Fungal infection suspected)/ Sodi carb (for removal of crust or foreign contaminants/ Xentian Violet/Hexisol/ H2O2. Antihistamin/+ NSAID / Steroids (single dose, never overdose) Ivermectin – to prevent & control ectoparasitic infestation (repeat after 7-14 days, strictly maintain proper dose & route) . Antibiotics – Locally and Parentally if Pyoderma present and localized/ systemic involvement. Drugs of Choice: Penicillin/Ampicillin/Amoxicillin/amoxicillin-clavulanate/ Cephalosporins  Anti fungal (if fungal infection suspected)– Systemic/ Local", "Prevention Methods": "Switching to a low-allergen food such as lamb and Rice may be the key to relieving your Pet’s itchy skin. Avoid Milk, Meat Products.  Ventilation, Humidity, cleaning & Disinfection of Kennel, Bedding Materials, Utensils and Dry Floor. Isolation & Quarantine.  Sunlight exposure daily for hours.", "Standard Prescription": ["Parasitic Skin Diseases (Mange/Mite/Flea etc)/ Maggot Formation / Myiasis/Wound/ Traumatic Wound/ Surgical wound/ Myiasis, Cat, 3kgs", "1. Inj. M Pain Vet 0.5% - 0.15ml, SC, Once daily", "2. Inj. Streptopen – 2.5gm- 0.5ml, IM, Twice Daily", "3. Inj. Phenadryl – 0.5 ml, IM, Once daily", "4. Oint. Neobacrin/Dermasol N/ Pow. Neocin apply Locally Twice daily.", "5. Inj. Parasitin/ Acimec 1% - 0.15ml SC 5 days intervals/ Tab Ivera/Alice (6mg)- 0.3 part", "5. Dressing twice daily –", "H2O2 – 1st One/Two Days, Povin – Twice daily- 3-5days, Then Once daily.", "Fly Repellent – Oil of Turpentine/Ectonil(1.5gm/liter water) Spray/Nephthalin- hanging in kennel"], "Last Updated": "7/27/2025", "_id": 33}, {"Name": "Enterotoxaemia (Cat: 3Kgs)", "Type": "Bacterial", "Animal": "Pet and Companion Animals", "Severity": "Severe", "Contagion": "⚠️ Contagious", "Symptoms": "Hemorregic Enteritis, watery stools, bright red blood in the stool, mucus-covered stools, vomiting, abdominal discomfort, and potentially, fever.", "Causes": ["Bacterial Overgrowth – Clostridium spp. release toxins (e.g., alpha, beta, epsilon toxins).", "Dietary Changes – Sudden diet shifts, overeating, or spoiled food.", "Antibiotic Use – Disrupts normal gut flora, allowing C. difficile overgrowth.", "Weakened Immune System – Stress, illness, or immunosuppression.", "Intestinal Stasis – Slow gut motility (e.g., from obstruction or bloat).", "Parasites or Viral Infections – Can damage the gut, allowing bacterial toxins to enter the bloodstream."], "Treatment Protocol": ["1. Emergency Care", "IV Fluids – To treat dehydration and shock.", "Antitoxins (if available for specific Clostridium toxins).", "Plasma Transfusion – For severe protein loss.", "2. Medications", "Antibiotics (e.g., metronidazole, ampicillin, or tylosin for C. perfringens).", "Probiotics (to restore healthy gut flora).", "Anti-nausea drugs (maropitant, ondansetron).", "Pain relief (e.g., buprenorphine).", "3. Dietary Management", "Fasting for 12-24 hours (to rest the gut).", "Gradual reintroduction of bland diet (boiled chicken + rice or prescription GI food).", "4. Surgery (Rare Cases)", "If intestinal necrosis or obstruction is present."], "Prevention Methods": ["Avoid sudden diet changes.", "Proper food storage (prevent spoilage).", "Routine deworming and parasite control.", "Probiotics during/after antibiotic use.", "Vaccination (some Clostridium vaccines exist for livestock, but not commonly used in pets)."], "Standard Prescription": ["Cat-3kgs (Fever Present)", "1. Syrup. Ciprocin Vet- 0.3ml fed Orally Twice daily , 5-7 Days", "2. Syp. Amodis- 2ml, Fed Orally Twice daily, 5-7 Days", "3. Tab. D-con- 1 tab/2.5-3 kg Body Weight.", "4. Pow. PA Gut – 4-5 gm with per kg Feed/Drinking water.", "5. Pow. PA lyte – 10gm/ 2 Liter drinking water and feed QS as frequent as defecation.", "6. . Inj Cholera Saline (if severe dehydration)", "20-40ml, IV, Twice Daily."], "Last Updated": "7/19/2025", "_id": 34}, {"Name": "Esophagitis (Cat: 3Kgs)", "Type": "Metabolic", "Animal": "Pet and Companion Animals", "Severity": "Moderate", "Contagion": "✅ Non-Contagious", "Symptoms": ["✔Painful swallowing (whining, reluctance to eat)", "✔Excessive drooling (thick, foamy saliva)", "✔Regurgitation (undigested food, mucus, or blood)", "✔Bad breath (sour or metallic smell)", "✔Neck stretching or gulping (discomfort)", "✔Weight loss (due to decreased eating)", "⚠️ Severe Cases:", "Fever (if infection develops)", "Black, tarry stools (melena from bleeding ulcers)", "Difficulty breathing (if aspiration pneumonia occurs)"], "Causes": ["Foreign Bodies, Chemical Burning, Hot Water/Food Intake.", "1. Gastroesophageal Reflux (GERD)", "Stomach acid backs up into the esophagus (common in anesthetized pets).", "Chronic vomiting (e.g., due to kidney disease, pancreatitis).", "2. Foreign Bodies or Trauma", "Bones, toys, or sharp objects scratching the esophagus.", "Improperly placed feeding tubes.", "3. Infections", "Fungal: Candida (in immunocompromised pets).", "Viral: Feline herpesvirus (rare).", "Bacterial: Secondary to ulcers or foreign bodies.", "4. Chemical Irritation", "Ingestion of caustic substances (cleaning products, batteries).", "Pill-induced esophagitis (doxycycline, clindamycin stuck in the esophagus).", "5. Other Causes", "Hiatal hernia (stomach protrudes into the esophagus).", "Megaesophagus (weak esophageal muscles leading to food stagnation)."], "Treatment Protocol": ["1. Medications", "Acid reducers (Famotidine, Omeprazole) – Decrease stomach acid.", "Sucralfate (coats ulcers to promote healing).", "Antibiotics (if infection is present).", "Pain relief (Gabapentin, Buprenorphine).", "2. Dietary Management", "Soft, bland food (boiled chicken + rice, or prescription GI diet).", "Small, frequent meals (to reduce reflux).", "Elevated feeding (for dogs with GERD).", "3. Severe Cases", "IV fluids (for dehydration).", "Feeding tube (if swallowing is too painful).", "Surgery (for strictures or perforations)."], "Prevention Methods": ["Prevent acid reflux, avoid irritants.", "✅ Avoid feeding bones, table scraps, or hard treats.", "✅ Give pills with water or food (never dry).", "✅ Elevate food bowls for pets with reflux.", "✅ Treat vomiting promptly (prevent acid damage)."], "Standard Prescription": ["Cat-3kgs (Fever Present)", "1. Syrup. Ciprocin Vet- 0.3ml fed Orally Twice daily , 5-7 Days", "2. Syp. Amodis- 2ml, Fed Orally Twice daily, 5-7 Days", "3. Tab. D-con- 1 tab/2.5-3 kg Body Weight.", "4. Pow. PA Gut – 4-5 gm with per kg Feed/Drinking water.", "5. Pow. PA lyte – 10gm/ 2 Liter drinking water and feed QS as frequent as defecation.", "6. . Inj Cholera Saline (if severe dehydration)", "20-40ml, IV, Twice Daily."], "Last Updated": "7/19/2025", "_id": 35}, {"Name": "Fatty Liver Disease", "Type": "Metabolic", "Animal": "Pet and Companion Animals", "Severity": "Severe", "Contagion": "✅ Non-Contagious", "Symptoms": ["Early signs may be subtle,  but progression leads to severe symptoms:", "Loss of appetite (anorexia)", "Weight loss (rapid in cats)", "Lethargy & weakness", "Jaundice (yellow gums,  eyes,  skin)", "Vomiting & diarrhea", "Dehydration", "Drooling (especially in cats)", "Neurological signs (confusion,  seizures in advanced cases)"], "Causes": ["Prolonged anorexia (especially in obese cats)", "Rapid fat mobilization to liver", "Stress,  illness,  obesity"], "Treatment Protocol": ["Hospitalization (often required for severe cases)", "Fluid therapy (to treat dehydration)", "Force-feeding or feeding tube (nasogastric or esophageal tube)", "High-protein, high-calorie diet (prescription liver-support diets)", "Appetite stimulants (e.g., mirtazapine for cats)", "Medications (antibiotics if infection is present, liver protectants like SAMe or milk thistle)", "Treat underlying conditions (diabetes, hyperthyroidism, etc.)", "Home Care:", "Strict feeding schedule", "Monitor weight & appetite", "Follow-up blood tests (to check liver function)"], "Prevention Methods": ["Prevent obesity", "Don’t allow sudden fasting", "Early intervention if pet stops eating"], "Standard Prescription": ["1. Hepaclin Oral Powder- 3gm", "1gm/ 2-3 kg wice daily for 1 month.", "2. Liv-52,", "Cat: 5ml twice daily,", "Dog: 5-10ml twice daily"], "Last Updated": "7/23/2025", "_id": 36}, {"Name": "Feline Infectious Peritonitis (FIP)-(Cat: 3kgs)", "Type": "Viral", "Animal": "Pet and Companion Animals", "Severity": "Severe", "Contagion": "⚠️ Contagious", "Symptoms": "Weight loss, poor appetite, persistent fevers, gum and mouth inflammation (gingivitis and stomatitis), and recurrent infections in various areas like the eyes, skin, and respiratory tract. Neurological issues like seizures can also occur.", "Causes": "Feline Infectious Peritonitis Virus", "Treatment Protocol": ["A. Antiviral Therapy (GS-441524 or Remdesivir)", "GS-441524 (oral/injectable):", "Dose: 6-10 mg/kg SC or PO q24h for 84 days (minimum).", "Remdesivir (injectable, early-stage):", "Dose: 10-15 mg/kg IV/SC q24h for 3 days, then switch to GS-441524.", "B. Supportive Care", "Corticosteroids (Prednisolone):", "0.5-1 mg/kg PO q12h (reduces inflammation).", "Antibiotics (if secondary infections):", "Doxycycline (5 mg/kg q12h) for bacterial complications.", "Fluid Therapy (if dehydrated).", "Appetite Stimulants (Mirtazapine).", "Liver Tonics for functional restoration."], "Prevention Methods": ["Keep the cat healthy, cleaning litter boxes, keeping litter boxes away from food and water dishes, avoid overcrowding of pets.", "Prevention & Management", "No effective vaccine, exists but limited efficacy.", "Reduce stress & overcrowding (FCoV spreads in multi-cat households).", "Disinfection:", "Bleach (1:32 dilution) kills FCoV."], "Standard Prescription": ["Cat: 3kgs", "1. Inj. GS441524, 0.3ml/kg, SC, for wet fip once daily for 84 days", "2. Cap. Doxicap, 10mg/kg Bid for 14days", "3. Pet me plus, 5gm, Fed Orally, Twice Daily for 14-21days", "4. Cap. Silybin-70mg, 1 cap 0nce - twice daily -15-30 days.", "5. Syp. Cortan - 2ml Fed Orally Once daily for 7-10 Days.", "1ml/kg--BiD 2nd week", "0.5 ml/kg--Once daily-3rd week", "6. Syp. Femotid- 40mg, 0.5ml Fed Orally before meal twice daily for 1month"], "Last Updated": "7/18/2025", "_id": 37}, {"Name": "Feline Lower Urinary Tract Disease - FLUTD (Cat: 3Kgs)", "Type": "Bacterial", "Animal": "Pet and Companion Animals", "Severity": "Fatal", "Contagion": "⚠️ Contagious", "Symptoms": ["Frequent trips to the litter box with little output.", "Straining and vocalizing while urinating.", "Blood in the urine.", "Urinating outside the litter box.", "Licking the genital area constantly.", "Lethargy,  hiding behavior,  and decreased appetite.", "⚠️ Emergency Signs:", "Complete urinary blockage—especially in male cats (requires immediate attention).", "Vomiting and collapse if left untreated."], "Causes": ["1. Idiopathic (Unknown Cause)", "Most common in young to middle-aged cats.", "2. Urolithiasis (Stones)", "Struvite or calcium oxalate crystals.", "3. Urinary Tract Infections", "Less common in young cats,  more in older or immunocompromised.", "4. Behavioral & Environmental Triggers", "Stress,  indoor confinement,  lack of enrichment.", "Low water intake,  obesity,  and dry food diet.                                                                5. Other Causes", "Urethral plugs (mucus + crystals).", "Bladder tumors (rare)."], "Treatment Protocol": ["1. Antibiotics", "Common antibiotics: Amoxicillin, Clavamox, Enrofloxacin (Baytril), Cephalexin.", "Treatment duration: Typically 7–14 days (even if symptoms improve early).", "2. Pain & Anti-inflammatory Medications", "Pain relief: Meloxicam, Buprenorphine (for severe discomfort).", "Anti-spasmodics: Prazosin (helps relax the bladder).", "3. Dietary & Supportive Care", "Increased water intake (encourage drinking, wet food, water fountains).", "Prescription urinary diets (e.g., Hill’s c/d, Royal Canin Urinary SO) to prevent crystals/stones.", "Cranberry supplements (may help prevent bacterial adhesion, but not a cure).", "4. Surgery (if needed)", "Bladder stone removal (surgery or dietary dissolution).", "Tumor removal (if cancer is present)."], "Prevention Methods": ["✅ High-moisture diet (wet food).", "✅ Ensure constant access to clean water.", "✅ Enriched, low-stress environment.", "✅ Regular litter box cleaning.", "✅ Provide multiple litter boxes in multi-cat homes.", "✅ Encourage physical activity and healthy weight.", "✅ Annual veterinary urinary check-ups."], "Standard Prescription": ["Cat- 3kg", "1. Inj. Acicef-4 (500mg)", "0.20ml, Intra Muscularly, Once daily.", "2. Syrup. Urokit Plus", "3 ml, Twice daily for 15 Days.", "3. Inj. Tracid vet – 10ml", "0.35 ml, Intra Muscularly, Twice Daily (stop if no blood in urine)", "4. Inj. Normasol – 1000ml", "70ml, IV/SC three hourly, if improve then increase interval.", "5. Powder Ammonium Chloride", "UB wash with Normal Saline (5gm+50ml Saline)"], "Last Updated": "7/19/2025", "_id": 38}, {"Name": "Feline Panleukopenia (Feline Parvovirus)-(Cat: 2kgs)", "Type": "Viral", "Animal": "Pet and Companion Animals", "Severity": "Severe", "Contagion": "⚠️ Contagious", "Symptoms": "Vomiting, diarrhea (possibly bloody), fever, lethargy, loss of appetite, and dehydration, painful or tense abdomen.", "Causes": "Feline Panleukopenia (Feline Parvovirus)", "Treatment Protocol": ["1. Immediate Veterinary Care", "Hospitalization is often required due to severe dehydration, vomiting, and diarrhea.", "IV Fluid Therapy (Lactated Ringer’s or 0.9% saline with electrolytes) to combat dehydration and maintain electrolyte balance.", "Anti-emetics (e.g., Ondansetron to control vomiting.)", "Antibiotics (e.g., Ceftiofor/ Ceftriaxone/ Ampicillin/ Enrofloxacin/ Ciprofloxacin/ Marbofloxacin, Metronidazole) to prevent secondary bacterial infections (septicemia from gut bacteria).", "2. Supportive Care", "Nutritional Support:", "NPO (Nothing Per Os) initially if vomiting persists.", "Aminoacids, Vitamin B Complex, Vitamin C etc.", "Fecal Microbiota Transplant (FMT) to restore gut flora post-recovery.", "Gradual feeding with a bland, easily digestible diet (e.g., boiled chicken & rice, or prescription GI diets like Hill’s i/d) once vomiting is controlled.", "Syringe feeding or tube feeding if the dog refuses to eat.", "Anti-diarrheals (e.g., Kaolin-Pectin) may be used cautiously (only if no intestinal obstruction is suspected).", "Pain Management (e.g., Meloxicam) if abdominal discomfort is severe.", "3. Advanced Treatments (if available)", "Plasma/Blood Transfusion (for severely anemic or hypoproteinemic dogs).", "IV Immunoglobulins or Recombinant Interferon-Omega (experimental but may help in early infection)."], "Prevention Methods": ["Vaccination, Hygienic Management, Disinfecton, Regular check-ups.", "Vaccination", "Core Vaccination (PCH) starting at 6-8 weeks, boosters every 3-4 weeks until 16 weeks, then yearly/3-yearly as per vet advice.", "Avoid exposure to unvaccinated Cats or contaminated areas until fully vaccinated.", "Isolate the cat to prevent spreading to other dogs.", "Disinfect environment with bleach (1:30 dilution) or accelerated hydrogen peroxide."], "Standard Prescription": ["Cat: 2kgs", "1. Inj. Acicef-4, 0.1ml., IM/Sc, Once Daily for 5-7 days.", "2. Inj. Zofra/ Anset/ Emiset -0.2ml, IM/IV, Twice Daily for 7 days", "3. Inj. Tracid 10ml : 0.2ml, IM/IV Twice daily for 7 days.", "4. Inj. Seclo/ Omep -40mg, 0.3ml, IV, Twice daily for 7 days.", "5. Inj. Metro IV: 10ml, IV, Twice Daily for 7 days.", "6. Inj. Aminovit Plus vet – 20ml: 0.5ml/5kg IM/IV Once/Twie daily for 10 days.", "7. Vita C - Inj Ascoson -500mg/5ml : 0.2ml, IM, Once daily for 10 days.", "8. Inj. Cholera saline/ Hartsol – 20-40ml/kg IV Twice daily for 7 days."], "Last Updated": "7/18/2025", "_id": 39}, {"Name": "Fluke Infestation / Trematode Infestation", "Type": "Parasitic Diseases", "Animal": "Pet and Companion Animals", "Severity": "Moderate", "Contagion": "⚠️ Contagious", "Symptoms": ["Loss of appetite and weight.", "Intermittent diarrhea or poor digestion.", "Weakness or fatigue.", "Enlarged abdomen or discomfort.", "Jaundice (yellow skin/eyes) in liver flukes.", "Anemia or edema in chronic cases.", "⚠️ Emergency Signs:", "Severe liver damage with collapse.", "Heavy infestation causing intestinal blockage.", "Liver flukes: Vomiting,  jaundice (yellow gums/eyes),  lethargy,  swollen abdomen.", "Lung flukes: Coughing,  wheezing,  respiratory distress.", "Intestinal flukes: Diarrhea (sometimes bloody),  weight loss,  poor coat condition.", "General signs: Loss of appetite,  weakness,  dehydration."], "Causes": ["Waterborne parasites,  raw fish ingestion,  intermediate host (snails).", "Ingestion of Metacercariae", "Consuming plants or water contaminated with infective fluke stages.", "Intermediate Hosts", "Snails and aquatic animals harbor larval stages of liver or intestinal flukes.", "Feeding Raw Fish or Offal", "Eating raw aquatic products can transmit flukes.", "Grazing Near Wetlands or Marshes", "Higher risk for animals in endemic,  swampy areas.", "Liver Flukes (Platynosomum spp.,  Opisthorchis spp.)", "Affect cats,  dogs,  and other animals.", "Found in bile ducts and liver,  leading to hepatitis,  jaundice,  and liver failure.", "Lung Flukes (Paragonimus spp.)", "Infect the lungs,  causing coughing,  difficulty breathing,  and pneumonia-like symptoms.", "Intestinal Flukes (Nanophyetus spp.,  Alaria spp.)"], "Treatment Protocol": ["Antiparasitic drugs (e.g., Triclabendazole, Praziquantel, Fenbendazole, Oxyclozanide, Albendazole).", "Fenbendazole - Praclear-250mg @ 50mg/kg Bwt- once daily for 3 days.", "Supportive care (fluids, liver protectants, antibiotics for secondary infections)."], "Prevention Methods": ["Avoid contaminated water, control snail hosts.", "✅ Avoid grazing near contaminated water bodies.", "✅ Do not allow pets to drink from stagnant or swampy areas.", "✅ Control snail populations in affected regions.", "✅ Use antiparasitic medications as prescribed.", "✅ Avoid feeding raw fish or aquatic plants.", "✅ Maintain hygienic feeding practices.", "✅ Regular fecal tests to monitor infections."], "Standard Prescription": ["1. Syp. Iverzol - 1ml @10kgs, 5-7 days intervals.", "2. Syp. PA Zinc- 100ml, 3-5ml/ day- 1 month.", "3. Syp. D Iron (1ml @ 10kg)/ Dr. PetZ Iromin- 1/2 Tab @ <10kg, 1 Tab @>10kgs, 1 month.", "4. Syp. Liv-52", "1-3ml/ Kg, once Daily for 1 month."], "Last Updated": "7/28/2025", "_id": 40}, {"Name": "Food Allergy/ External Allergen Exposure/ Atopic Dermatitis.", "Type": "Bacterial", "Animal": "Pet and Companion Animals", "Severity": "Moderate", "Contagion": "✅ Non-Contagious", "Symptoms": ["Skin issues- itching, redness, dryness and flakiness, skin infections, hives or welts, hair loss in patches hot spots, red, oozing bald patches;", "Gastrointestial problems- vomiting, diarrhea, increased gas loss of appetite, straining to defecate;", "ear infection- inflammation and redness of the ear, recurrent ear infections;", "Other symptoms- sneezing, facial swelling, eye discharge, weight loss, lack of energy, in rare cases anaphylaxis can occur."], "Causes": "Allergic Food, Exposure to external allergens, unhygienic managemnet, humidity etc.", "Treatment Protocol": ["Hot Spots/ wound – dressing with Tin Iodine / CuSo4 (2-5%) (if Fungal infection suspected)/ Sodi carb (for removal of crust or foreign contaminants/ Xentian Violet/Hexisol/ H2O2.", "- Antihistamin/+ NSAID / Steroids (single dose, never overdose) Ivermectin – to prevent & control ectoparasitic infestation (repeat after 7-14 days, strictly maintain proper dose & route).", "Antibiotics – Locally and Parentally if Pyoderma present and localized/ systemic involvement.", "Drugs of Choice: Penicillin/Ampicillin/Amoxicillin/amoxicillin-clavulanate/ Cephalosporins  Anti fungal (if fungal infection suspected)– Systemic/ Local"], "Prevention Methods": ["Switching to a low-allergen food such as lamb and Rice may be the key to relieving your Pet’s itchy skin.", "Avoid Milk, Meat Products.  Ventilation, Humidity, cleaning & Disinfection of Kennel, Bedding Materials, Utensils and Dry Floor. Isolation & Quarantine.", "Sunlight exposure daily for hours."], "Standard Prescription": ["Allergic Dermatitis/ Pyoderma", "Dog, 20 Kg, 3 Months Allergic, Dermatitis Chronic Pyoderma)", "1.     Inj. Ampicin Vet – 2 ml, Im, Twice Daily.", "2.     Inj. M Pain el Vet –0.5%, 1ml Sc Once Daily.", "3.     Inj. Histavet – 1 Ml, Im, Once Daily.", "4.     Oint. Dermasol N – Apply Locally Twice Daily After Dressing.", "5.     Syp. PA Zinc – 1 Tsp Once Daily.", "6.     Dressing Bath - Xention Violet/ Povin.", "7.     Switch to Lamb, Chicken, Chevon."], "Last Updated": "8/12/2025", "_id": 41}, {"Name": "Food Poisoning", "Type": "Poisoning", "Animal": "Pet and Companion Animals", "Severity": "Severe", "Contagion": "✅ Non-Contagious", "Symptoms": "Vomiting,  diarrhea,  loss of appetite,  lethargy,   include abdominal pain,  seizures,  weakness,  tremors or difficulty breathing,  excessive drooling or salivation and uncoordinated movements.", "Causes": ["Toxic Human Foods", "Onions,  Garlic,  Chives – Cause hemolytic anemia.", "Chocolate – Contains theobromine,  which is toxic.", "Xylitol (Artificial Sweetener) – Causes hypoglycemia & liver failure.", "Grapes & Raisins – Can lead to kidney failure.", "Alcohol & Caffeine – Highly toxic even in small amounts.", "Raw Dough (Yeast) – Expands in the stomach,  causing bloat & alcohol toxicity.", "Spoiled or Contaminated Food", "Bacteria like Salmonella,  E. coli,  or Listeria in raw/expired food.", "Moldy food containing mycotoxins (e.g.,  from spoiled cheese,  bread).", "Dairy Products", "Many cats are lactose intolerant,  leading to diarrhea & vomiting.", "Raw Meat & Fish", "Risk of bacterial infection or thiamine deficiency (in raw fish).", "Household Chemicals & Plants", "Certain plants (lilies,  poinsettias) and cleaning agents can mimic food poisoning symptoms."], "Treatment Protocol": ["Activated Charcoal – Binds toxins in the stomach.", "Antibiotics, Antiamobic orally or Systemically.", "IV Fluids – For dehydration and toxin flushing.", "Anti-Nausea Medications (e.g., Cerenia).", "Blood Tests & Supportive Care – For organ damage.", "Hospitalization in severe cases."], "Prevention Methods": ["Avoid spoiled food, proper storage.", "✔ Keep human food out of reach.", "✔ Avoid feeding raw or spoiled meat.", "✔ Store trash securely.", "✔ Check pet food recalls.", "✔ Be cautious with new treats or table scraps."], "Standard Prescription": ["Dog: 15kgs", "1. Syp. Oxecone MS – 3tsp (Twice 12 hourly only)", "2. Tab. Amodis vet – 1+0+1, 5 days.", "3. Cap. Maxpro – 20mg, 1+0+1, 5 days.", "4. ORS – QS."], "Last Updated": "7/29/2025", "_id": 42}, {"Name": "Food Poisoning (Cat:3Kgs)", "Type": "Metabolic", "Animal": "Pet and Companion Animals", "Severity": "Severe", "Contagion": "✅ Non-Contagious", "Symptoms": ["✔Vomiting & diarrhea (sometimes bloody)", "✔Abdominal pain (whining, hunched posture)", "✔Lethargy or weakness", "✔Drooling/excessive thirst", "✔Tremors or seizures (neurotoxins like xylitol, mold)", "✔Pale gums (anemia from onions/garlic)", "✔Jaundice (yellow gums – liver damage)", "⚠️ Severe Cases:", "Collapse (shock, hypoglycemia)", "Difficulty breathing (neuromuscular toxins)"], "Causes": ["1. Toxic Human Foods", "Canned Food, wast food, Rotten food, Dry food (contaminated)", "Chocolate (theobromine toxicity)", "Xylitol (sugar-free gum, candy – causes liver failure)", "Grapes/Raisins (kidney damage)", "Onions/Garlic (hemolytic anemia)", "Alcohol (neurological depression)", "Raw yeast dough (stomach expansion & alcohol toxicity)", "2. Bacterial Contamination", "Salmonella (raw chicken, eggs)", "E. coli (contaminated meat)", "Listeria (deli meats, unpasteurized dairy)", "Botulism (spoiled canned food)", "3. Mold & Mycotoxins", "Penitrem A (moldy dairy, nuts, garbage) – causes tremors/seizures", "Aflatoxins (moldy grains, peanuts) – liver damage", "4. Other Toxins", "Spoiled meat (rancid fats cause pancreatitis)", "Compost/garbage toxins (mycotoxins, rotting bacteria)"], "Treatment Protocol": ["1. Decontamination", "Induce vomiting (only if recent ingestion & vet-approved)", "Activated charcoal (binds toxins in the gut)", "IV fluids (flush toxins, support kidneys)", "2. Specific Antidotes", "Xylitol poisoning → IV dextrose & liver protectants", "Chocolate toxicity → Anti-seizure meds, heart monitoring", "Onion/garlic toxicity → Blood transfusion if severe", "3. Supportive Care", "Anti-nausea meds (Cerenia, ondansetron)", "Antibiotics (for Salmonella, E. coli)", "Pain relief (for pancreatitis)"], "Prevention Methods": ["Avoid spoiled food, proper storage.", "✅ Keep human food out of reach (especially chocolate, gum, grapes).", "✅ Avoid raw diets unless properly handled.", "✅ Secure trash cans (moldy food is a risk).", "✅ Check pet treats for recalls (e.g., aflatoxin contamination)."], "Standard Prescription": ["Cat-3kgs (Fever Present)", "1. Syrup. Ciprocin Vet- 0.3ml fed Orally Twice daily , 5-7 Days", "2. Syp. Amodis- 2ml, Fed Orally Twice daily, 5-7 Days", "3. Tab. D-con- 1 tab/2.5-3 kg Body Weight.", "4. Pow. PA Gut – 4-5 gm with per kg Feed/Drinking water.", "5. Pow. PA lyte – 10gm/ 2 Liter drinking water and feed QS as frequent as defecation.", "6. . Inj Cholera Saline (if severe dehydration)", "20-40ml, IV, Twice Daily."], "Last Updated": "7/19/2025", "_id": 43}, {"Name": "Fracture", "Type": "Musculo Skeletal System Disorders", "Animal": "Pet and Companion Animals", "Severity": "Severe", "Contagion": "✅ Non-Contagious", "Symptoms": "Limping,  pain,  swelling,  behavioral changes like hiding or vocalizing,  pain and ensitivity when touched or manipulated,  visible deformity- the limb may appear bent,  twisted,  or misshapen. In some cases,  the bone may protrude through the skin,  indicating an open fracture.", "Causes": "Traumatic Injury,  Accident,  Hurt,  Sudden Fall", "Treatment Protocol": ["ABCs (Airway, Breathing, Circulation) – Ensure patient stability, especially in trauma.", "Secondary Survey – Check for other injuries (head, chest, abdomen, spine).", "Neurovascular Exam – Assess distal pulses, sensation, and motor function (e.g., compartment syndrome risk).", "Pain Control – NSAIDs, opioids, or nerve blocks as needed.", "wound management, Dressing.", "Fracture Management:", "Fixation, Immobilization.", "Infection Control: Antibiotics, Dressing.", "Nutritional Supplimnet if Oral Fed stop and weekness present."], "Prevention Methods": ["1. Strengthen Your Bones", "Calcium-Rich Diet: Consume dairy products (milk, cheese, yogurt), leafy greens (kale, spinach), almonds, and fortified foods.", "Vitamin D: Get sunlight exposure or eat fatty fish (salmon, tuna), egg yolks, or take supplements to help absorb calcium.", "Protein & Nutrients: Include lean meats, beans, nuts, and foods rich in magnesium, phosphorus, and vitamin K.", "2. Exercise Regularly", "Weight-Bearing Exercises: Walking, jogging, dancing, and hiking strengthen bones.", "Strength Training: Lifting weights or using resistance bands improves bone density.", "Balance & Flexibility: Yoga or tai chi reduces fall risks by improving coordination.", "3. Fall Prevention", "Home Safety: Remove tripping hazards (rugs, clutter), install grab bars in bathrooms, and ensure good lighting.", "Footwear: Wear non-slip, supportive shoes.", "Vision Checks: Regular eye exams ensure clear vision to avoid obstacles.", "4. Lifestyle Adjustments", "Avoid Smoking & Excessive Alcohol: Both weaken bones.", "Maintain a Healthy Weight: Being underweight increases osteoporosis risk; obesity raises fall risks.", "5. Medical Care", "Bone Density Tests: Especially for postmenopausal women or older adults, to detect osteoporosis early.", "Medications: If at high risk for osteoporosis, consult a doctor about bone-strengthening drugs (e.g., bisphosphonates).", "Review Medications: Some drugs cause dizziness or bone loss—discuss alternatives with your doctor.", "6. Protective Gear", "Use helmets when biking or skating, and wear wrist guards during high-risk activities (e.g., skating).", "7. Posture & Body Mechanics", "Lift heavy objects properly (bend knees, not waist).", "Avoid twisting motions that could strain bones.", "Older adults, postmenopausal women, people with osteoporosis, or those with a history of fractures should take extra precautions."], "Standard Prescription": ["Cat: 3kgs.", "1. Inj. Acicef-4", "Sig. 0.16 ml, IM, Once Daily for 5 days.", "2. Inj. Phenadryl – 10", "Sig. 0.3ml, IM, Once Daily for 5 days.", "3. Tab. Amantril – 100mg", "1/6 Part feed Orally twice daily for 3 days.", "4. Inj. Sedil-10mg/2ml", "0.3 ml once/ twice daily for light sedation for one-two days.", "5. Inj. Aminovit Plus vte- 20ml", "0.5ml, Once/ twice daily for light sedation for one-two days.", "6. Inj. Acoson - 500mg", "0.25ml, IM, Once daily 5-7 days.", "7. Dressing with Viodin one daily.", "8. Inj. Roxadex- 0.3ml, IM, Once Daily for 3 days."], "Last Updated": "7/28/2025", "_id": 44}, {"Name": "Gastritis/ Enteritis/ GIT Infection (Cat: 2Kgs)", "Type": "Bacterial", "Animal": "Pet and Companion Animals", "Severity": "Severe", "Contagion": "⚠️ Contagious", "Symptoms": ["Vomiting (with or without blood), decreased appetite, abdominal pain, and excessive drooling, Dehydration, Blood in Feces, Weight Loss", "Gastritis (Stomach Inflammation):", "Vomiting (acute or chronic)", "Nausea (drooling, lip-smacking)", "Decreased appetite", "Abdominal discomfort", "Enteritis (Intestinal Inflammation):", "Diarrhea (watery, bloody, or mucus-filled)", "Increased bowel movements", "Flatulence", "Weight loss (chronic cases)", "Severe Cases (Emergency Signs):", "Blood in vomit (hematemesis) or stool (melena/hematochezia)", "Severe dehydration (sunken eyes, dry gums, lethargy)", "Fever or hypothermia", "Abdominal pain/distension"], "Causes": ["Dietary-Related:", "Dietary indiscretion (eating garbage, spoiled food, foreign objects)", "Sudden diet changes.", "Food allergies/intolerances.", "Infectious:", "Viral: Parvovirus (dogs), panleukopenia (cats), coronavirus, distemper", "Bacterial: Salmonella, E. coli, Clostridium, Campylobacter", "Parasitic: Roundworms, hookworms, giardia, coccidia", "Fungal (rare): Histoplasma", "Toxic/Irritants:", "Toxins (chocolate, xylitol, plants, NSAIDs)", "Foreign bodies (bones, toys, hairballs in cats)", "Other Causes:", "Stress (boarding, travel, anxiety)", "Systemic diseases (kidney/liver disease, pancreatitis, IBD, cancer)", "Autoimmune conditions", "Inflammatory/ Irritating Bowel Syndrome"], "Treatment Protocol": ["A. Acute Mild Cases (Supportive Care)", "Fasting (12-24 hours for dogs, 6-12 hours for cats) → then bland diet (boiled chicken + rice or prescription GI food)", "Hydration (oral rehydration solutions, subcutaneous/IV fluids if severe)", "Anti-emetics (Atropine, ondansetron for vomiting)", "Antidiarrheals (only if no infection/toxin: e.g., metronidazole, probiotics)", "Gastroprotectants (famotidine, omeprazole for stomach acid)", "B. Specific Treatments (Based on Cause)", "Antibiotics (for bacterial infections: metronidazole, tylosin)", "Deworming (fenbendazole, praziquantel for parasites)", "Diet change (hypoallergenic, low-fat, or hydrolyzed protein diets)", "Pain relief (if needed -Tiemonium Methylsulfate, but avoid NSAIDs unless prescribed)", "C. Severe Cases (Hospitalization Needed)", "IV fluids & electrolytes (for dehydration)", "Blood plasma/transfusion (parvovirus/panleukopenia cases)", "Surgery (if foreign body or obstruction)"], "Prevention Methods": ["Proper diet (avoid sudden changes, table scraps, rotten/spoiled food/ unusual food/ oily food)", "Parasite control (regular deworming, flea prevention)", "Vaccinations (parvo, distemper, panleukopenia)", "Avoid toxins & garbage (pet-proof home)", "Stress management (for sensitive pets)", "Clean food/water, avoid sudden diet changes"], "Standard Prescription": ["Cat: 2kgs (Infectious Vomiting)", "1. Inj. Acicef-4, 0.1ml., IM/Sc, Once Daily for 5-7 days.", "2. Inj. Zofra/ Anset/ Emiset -0.2ml, IM/IV, Twice Daily for 7 days", "3. Inj. Tracid 10ml : 0.2ml, IM/IV Twice daily for 7 days.", "4. Inj. Seclo/ Omep -40mg, 0.3ml, IV, Twice daily for 7 days.", "5. Inj. Metro IV: 10ml, IV, Twice Daily for 7 days.", "6. Inj. Aminovit Plus vet – 20ml: 0.5ml/5kg IM/IV Once/Twie daily for 10 days.", "7. Vita C - Inj Ascoson -500mg/5ml : 0.2ml, IM, Once daily for 10 days.", "8. Inj. Cholera saline/ Hartsol – 20-40ml/kg IV Twice daily for 7 days."], "Last Updated": "7/19/2025", "_id": 45}, {"Name": "Gingivitis (Cat:3 Kgs)", "Type": "Bacterial", "Animal": "Pet and Companion Animals", "Severity": "Moderate", "Contagion": "✅ Non-Contagious", "Symptoms": ["✔Red, swollen gums (especially along the gum line)", "✔Bad breath (halitosis)", "✔Bleeding gums (when eating or chewing toys)", "✔Yellow/brown tartar on teeth", "✔Drooling (sometimes bloody)", "✔Difficulty eating (chewing on one side, dropping food)", "✔Pawing at the mouth (sign of pain), Loose teeth, sensitivity to touch, lack of appetite, Severe cases may lead to tooth loss, abscesses, or systemic infections."], "Causes": ["Injury, Infection, Micronutrient deficiency.", "1. Plaque & Tartar Buildup", "Bacteria accumulate on teeth, forming plaque, which hardens into tartar (calculus).", "Tartar irritates the gums, leading to inflammation.", "2. Poor Dental Hygiene", "Lack of brushing or dental cleanings.", "3. Diet", "Soft, sticky foods promote plaque buildup.", "Lack of chewing (which helps clean teeth naturally).", "4. Underlying Health Issues", "Diabetes (increases infection risk)", "Kidney disease (can cause uremic stomatitis)", "Autoimmune diseases (e.g., pemphigus)", "Viral infections (Feline Calicivirus, Feline Leukemia Virus)", "5. Other Factors", "Misaligned teeth (crowding traps food)", "Trauma (chewing hard objects, electric burns in puppies/kittens)"], "Treatment Protocol": ["1. Professional Dental Cleaning", "Scaling & polishing under anesthesia to remove tartar.", "Tooth extractions if teeth are severely damaged.", "2. Medications", "Antibiotics (clindamycin, amoxicillin-clavulanate) if infection is present.", "Anti-inflammatory pain relief (meloxicam, buprenorphine).", "Chlorhexidine oral rinse or gel (to reduce bacteria).", "3. Home Care", "Daily tooth brushing (use pet-safe toothpaste).", "Dental chews & toys (VOHC-approved products).", "Water additives (to reduce plaque).", "4. Diet Adjustments", "Prescription dental diets (e.g., Hill’s t/d, Royal Canin Dental).", "Raw bones (only under supervision) – helps scrape off plaque.", "5. Treat Underlying Conditions", "Diabetes management", "Kidney disease support."], "Prevention Methods": ["High-quality diet, Regular teeth cleaning, dental chews.", "✅ Brush teeth daily (ideal) or 3+ times a week.", "✅ Annual veterinary dental check-ups.", "✅ Provide dental chews/toys (avoid hard bones that fracture teeth).", "✅ Feed dry kibble or dental diets (helps reduce plaque).", "✅ Avoid sugary treats & human food."], "Standard Prescription": ["Cat:3kgs", "1. Gelora/Micoral/Oroconazol 2% Oral Gel – 3ml/kg, Twice daily.", "2. Syp. Cefixime – 100mg, 1.25 ml Twice Daily.", "3. Inj. MPain vet 0.5%- 0.2 ml sc once daily.", "4. Povin mouth wash – twice daily.", "5. Tab. Ribosin- once daily 15 days."], "Last Updated": "7/19/2025", "_id": 46}, {"Name": "Gingivitis — Digestive System Disorder", "Type": "Digestive System Disorder", "Animal": "Pet and Companion Animals", "Severity": "Moderate", "Contagion": "✅ Non-Contagious", "Symptoms": ["Red,  Swollen Gums (especially along the tooth line)", "Bad Breath (Halitosis)", "Bleeding Gums (when chewing or brushing)", "Drooling or Pawing at Mouth (due to discomfort)", "Difficulty Eating (chewing on one side,  dropping food)", "Yellow/Brown Tartar on Teeth", "Receding Gums & Loose Teeth (in advanced cases)"], "Causes": ["1. Plaque & Tartar Buildup", "Bacteria in plaque irritate the gums,  leading to inflammation.", "Hardened plaque (tartar) worsens gum disease.", "2. Poor Dental Hygiene", "Lack of brushing or dental chews allows plaque accumulation.", "3. Diet (Soft Foods)", "Wet or soft food does not scrape teeth clean like dry kibble.", "4. Underlying Diseases", "Feline Chronic Gingivostomatitis (FCGS) – Severe immune-mediated inflammation in cats.", "Diabetes,  Kidney Disease,  Au g at Mouth (due to discomfort)", "Difficulty Eating (chewing on one side, dropping food)", "Yellow/Brown Tartar on Teeth", "Receding Gums & Loose Teeth (in advanced cases)"], "Causes": ["1. Plaque & Tartar Buildup", "Bacteria in plaque irritate the gums, leading to inflammation.", "Hardened plaque (tartar) worsens gum disease.", "2. Poor Dental Hygiene", "Lack of brushing or dental chews allows plaque accumulation.", "3. Diet (Soft Foods)", "Wet or soft food does not scrape teeth clean like dry kibble.", "4. Underlying Diseases", "Feline Chronic Gingivostomatitis (FCGS) – Severe immune-mediated inflammation in cats.", "Diabetes, Kidney Disease, Autoimmune Disorders – Increase susceptibility.", "Viral Infections – Feline calicivirus (FCV), feline immunodeficiency virus (FIV).", "5. Breed Predisposition", "Small breeds (e.g., Yorkshire Terriers, Chihuahuas) and brachycephalic breeds (e.g., Bulldogs, Persians) are more prone."], "Treatment Protocol": ["1. Professional Dental Cleaning", "Anesthesia required for scaling and polishing.", "Extractions if teeth are loose or infected.", "2. Home Dental Care", "Tooth Brushing (2-3 times/week with pet-safe toothpaste).", "Dental Wipes or Gels (if brushing isn’t possible).", "Antiseptic Mouth Rinses (e.g., chlorhexidine).", "3. Medications", "Antibiotics (e.g., clindamycin) for severe infections.", "Anti-inflammatory/Pain Relief (e.g., meloxicam for dogs).", "Immunosuppressants (for FCGS in cats, e.g., steroids).", "4. Diet & Dental Chews", "Veterinary Dental Diets (e.g., Hill’s t/d, Royal Canin Dental).", "Chew Toys (VOHC-approved, like Greenies)."], "Prevention Methods": ["1. Regular Brushing", "Use a finger brush or pet toothbrush with enzymatic toothpaste.", "2. Dental Treats & Toys", "Helps mechanically remove plaque.", "3. Annual Vet Dental Check-ups", "Early detection prevents progression.", "4. Water Additives", "Products like Oxyfresh reduce bacteria.", "5. Avoid Human Food & Sugary Treats", "Promotes bacterial growth."], "Standard Prescription": ["1. Povin Mouth Wash: Twice daily.", "2. Mycoral Oral Gel- Apply Locally Twice daily for 7 days.", "3. Tab. Ribosina, Fed Orally, Once Daily for 7 Days."], "Last Updated": "7/27/2025", "_id": 48}, {"Name": "Glucoma", "Type": "Chronic", "Animal": "Pet and Companion Animals", "Severity": "Severe", "Contagion": "✅ Non-Contagious", "Symptoms": ["Cloudy or bluish-tinged cornea: The eye may appear hazy or foggy.", "Redness and bloodshot appearance: Blood vessels in the white of the eye may be dilated and visible.", "Dilated pupils: Pupils may be larger than normal and not constrict properly in response to light.", "Eye pain: Animals may squint,  paw at their eyes,  or show signs of discomfort when the affected eye is touched.", "Bulging or enlarged eye: In severe cases,  the eyeball may appear larger or protrude more than normal.", "Vision loss: Dogs and cats may become clumsy,  bump into things,  or show signs of decreased vision.", "Behavioral changes: Some animals may become lethargic,  irritable,  or show other signs of discomfort due to pain."], "Causes": ["Primary Glaucoma:", "This is often inherited and occurs due to a problem with the eye's drainage angle,  preventing fluid from properly draining,  leading to fluid buildup and increased pressure.", "Secondary Glaucoma:", "This develops as a result of other eye conditions,  such as inflammation (uveitis),  cataracts,  lens displacement (luxation),  tumors,  or eye injuries."], "Treatment Protocol": ["Medications:", "Topical medications: Eye drops like prostaglandin analogs (latanoprost, travoprost, bimatoprost), carbonic anhydrase inhibitors (dorzolamide, brinzolamide), and beta-blockers (timolol) can help reduce intraocular pressure.", "Systemic medications: Mannitol may be administered intravenously to quickly lower eye pressure.", "Surgical procedures:", "Laser surgery: To reduce fluid production or improve drainage.", "Shunt placement: To create a new drainage pathway for fluid.", "Enucleation (eye removal): In severe cases, when the eye is severely damaged and painful, removal of the eye may be necessary."], "Prevention Methods": ["Prompt treatment of eye infections and injuries: To prevent secondary glaucoma.", "Monitoring for signs of glaucoma in predisposed breeds: Early detection is key to preserving vision."], "Standard Prescription": ["1. Eye Drop Lubrex/ Cofresh  – wash the eye twice daily.", "2. Ed. Timolol/Timosol - 1 drops 2-3 times daily- Gradually Once daily.", "3. Ed. Optibet/ Locular - 1 drops 2-3 times daily- Gradually Once daily.", "4. Syp. PB Tonic – 2 ml once daily orally for 7 days."], "Last Updated": "7/18/2025", "_id": 49}, {"Name": "Heavy Metal Toxicity", "Type": "Poisoning", "Animal": "Pet and Companion Animals", "Severity": "Severe", "Contagion": "✅ Non-Contagious", "Symptoms": ["Symptoms vary depending on the metal,  dose,  and duration of exposure.", "General Signs:", "Gastrointestinal: Vomiting,  diarrhea (sometimes bloody),  loss of appetite,  drooling.", "Neurological: Tremors,  seizures,  weakness,  disorientation,  blindness,  aggression.", "Hematological: Anemia,  pale gums,  weakness.", "Renal: Increased thirst,  kidney failure (arsenic,  cadmium,  lead).", "Other: Jaundice (liver damage),  weight loss,  lethargy.", "Lead:  Seizures,  vomiting,  abdominal pain,  blindness,  behavior changes.", "Zinc: Hemolytic anemia (pale/yellow gums,  dark urine),  kidney failure.", "Arsenic: Severe vomiting,  bloody diarrhea,  collapse,  shock.", "Mercury: Ataxia,  tremors,  blindness,  kidney damage.", "Cadmium: Breathing difficulty,  bone pain,  kidney damage.", "Iron: Vomiting blood,  liver failure,  shock."], "Causes": ["Lead", "Sources: Old paint,  batteries,  fishing weights,  plumbing materials,  contaminated soil,  or toys.", "Symptoms: Vomiting,  diarrhea,  seizures,  lethargy,  blindness,  behavioral changes.", "Zinc", "Sources: Pennies (post-1982 U.S. coins),  galvanized metal,  zinc oxide creams,  certain supplements.", "Symptoms: Hemolytic anemia (pale gums,  weakness,  jaundice),  vomiting,  kidney failure.", "Arsenic", "Sources: Pesticides,  herbicides,  contaminated water,  wood preservatives.", "Symptoms: Severe vomiting,  bloody diarrhea,  abdominal pain,  collapse.", "Mercury", "Sources: Fish (methylmercury),  broken thermometers,  industrial waste.", "Symptoms: Neurological signs (tremors,  incoordination),  kidney damage.", "Iron", "Sources: Overdose of supplements,  vitamin tablets,  certain fertilizers.", "Symptoms: Vomiting (sometimes bloody),  liver failure,  shock."], "Treatment Protocol": ["A. Immediate Decontamination", "Induce vomiting (if recent ingestion and no seizures).", "Activated charcoal (binds some metals).", "Endoscopy/surgery (if large metal objects are present).", "B. Chelation Therapy (Binds metals for excretion)", "Lead: Calcium EDTA, Succimer (DMSA).", "Zinc/Copper: Penicillamine.", "Arsenic/Mercury: Dimercaprol (BAL).", "Iron: Deferoxamine.", "C. Supportive Care", "IV fluids (for dehydration and kidney support).", "Blood transfusions (for severe anemia).", "Anticonvulsants (for seizures).", "Liver/kidney protectants (SAMe, milk thistle)."], "Prevention Methods": ["Keep hazardous materials out of reach (batteries, paints, coins, pesticides).", "Avoid feeding pets table scraps (some foods may contain heavy metals).", "Use pet-safe products (check toys, bowls, and supplements).", "Regular vet check-ups if exposure is suspected.", "Proper disposal of toxic items (old electronics, batteries)."], "Standard Prescription": ["1. Syp. Rox (Activated Charcol) – 300ml", "5ml/kg, 3 hourly up to complete disappear of signs.", "2. Inj. Normal Saline – 10-20 ml , IV/SC/ Kg Bwt.", "3. Syrup. Avolac - 100ml,", "1-2 TSP 6 hourly up to evacuation of stomach.", "4. Syp. Liv-52,", "1-2ml/kg Orally- Twice daily.", "5. SYp. Urokid -", "1-2ml/kg Orally- Twice daily."], "Last Updated": "7/29/2025", "_id": 50}, {"Name": "Hyperthyroidism (Common in Cats)", "Type": "Metabolic", "Animal": "Pet and Companion Animals", "Severity": "Moderate", "Contagion": "✅ Non-Contagious", "Symptoms": ["Weight loss (despite increased appetite)", "Increased thirst & urination", "Hyperactivity, restlessness, or aggression", "Vomiting or diarrhea", "Poor coat condition, greasy or matted fur", "Rapid heart rate (tachycardia) & heart murmurs", "High blood pressure (hypertension) → Risk of blindness, kidney damage", "Muscle weakness, panting"], "Causes": ["Overproduction of thyroid hormone (T4)", "Thyroid adenoma (benign tumor)", "Possible dietary/environmental factors"], "Treatment Protocol": ["\"Medication (Methimazole)", "Dogs (Rare Use – Thyroid Neoplasia or TSH-secreting Pituitary Tumor)", "Dose: 0.2–1 mg/kg PO every 12 hours (much higher than cats).", "Cats (Hyperthyroidism)", "Oral Tablets (Felimazole®, Tapazole®) or Transdermal Gel (Compounded)", "Starting dose: 2.5 mg/cat PO every 12 hours (or 5 mg once daily if tolerated).", "Note: Rarely used; levothyroxine is more common for canine hypothyroidism.", "Daily pills or transdermal gel to block thyroid hormone production.", "Lifelong treatment; requires regular blood monitoring.", "Radioactive Iodine (I-131) Therapy", "Gold standard treatment; destroys overactive thyroid tissue.", "Single dose, highly effective (~95% cure rate), but requires isolation.", "Surgical Thyroidectomy", "Removal of the thyroid gland (effective but risky in older cats).", "Prescription Diet (Hill’s y/d)", "Low-iodine food to manage mild cases (must be fed exclusively).", "Supportive Care", "Treat secondary issues (heart disease, hypertension).", "\"", "Radioactive Iodine\tDestroys thyroid tissue\tDefinitive therapy (Graves’, nodules)\tHighly effective, non-surgical\tCauses permanent hypothyroidism.", "Symptom Control: Beta-Blockers", "These do not reduce thyroid hormone levels but block their effects on the body, providing rapid relief from symptoms.", "Common Drugs: Propranolol, Atenolol, Metoprolol.", "How they work: Block the action of thyroid hormones on the cardiovascular and nervous systems.", "Typical Use: Used adjunctively at diagnosis to control symptoms like rapid heart rate, palpitations, tremors, anxiety, and heat intolerance while waiting for definitive treatments to take effect.", "- Propranolol", "For Dogs:", "Dose Range: 0.2 - 1.0 mg/kg by mouth, every 8-12 hours.", "For Cats (for hyperthyroidism symptom control):", "Dose Range: This roughly equates to 0.5 - 1.0 mg/kg for an average sized cat.", ", every 8-12 hours."], "Prevention Methods": ["Regular screening in older cats", "Avoid high-iodine or soy-rich diets", "Annual thyroid function tests"], "Standard Prescription": ["Dog:", "1. Tab. Tapazol/ Thyzol - 5mg", "1 tab for 5-20kg, Twice daily, continue upto recovery.", "2. Tab. Tryptin - 10mg", "1 tab for 10-50kgs, Twice Daily Continue upto recovery.", "3. Tab. Cortan - 5mg", "1 tab. 1 Tab for 5-10kgs.", "Cat:", "1. Tab. Tapazol/ Thyzol - 5mg", "1 Tab for 2kg, Twice daily, continue upto recovery.", "2. Tab. Tryptin - 10mg", "1 tab for 10-50kgs, Twice Daily Continue upto recovery.", "3. Tab. Cortan - 5mg", "1 tab. 1 Tab for 5-10kgs.", "1 tab. 1 Tab for 5-10kgs."], "Last Updated": "12/9/2025", "_id": 51}, {"Name": "Hypothyroidism (Common in Dogs) — Hormonal Disorders", "Type": "Hormonal Disorders", "Animal": "Pet and Companion Animals", "Severity": "Moderate", "Contagion": "✅ Non-Contagious", "Symptoms": ["Weight gain (without increased appetite)", "Lethargy & exercise intolerance", "Hair loss (alopecia),  especially on the trunk,  tail,  and hind legs", "Dry,  flaky skin & dull coat", "Cold intolerance (seeking warm spots)", "Slow heart rate (bradycardia)", "Recurrent skin/ear infections", "Neurological signs (rare,  but may include weakness or facial nerve paralysis)"], "Causes": ["Primary Hypothyroidism (Most Common) – Caused by:", "Lymphocytic thyroiditis (autoimmune destruction of the thyroid).", "Idiopathic atrophy (shrinkage of thyroid tissue).", "Secondary Hypothyroidism (Rare) – Due to pituitary gland dysfunction (low TSH secretion).", "Congenital Hypothyroidism (Very Rare) – Puppies/kittens born with underdeveloped thyroid glands.", "Iatrogenic Hypothyroidism – Caused by thyroidectomy or radioactive iodine treatment (for hyperthyroidism in cats)."], "Treatment Protocol": ["Daily Synthetic Thyroid Hormone (Levothyroxine, L-Thyroxine) – Given orally, usually twice daily initially, then adjusted based on response.", "Regular Monitoring: Blood tests (T4 levels checked 4-6 hours after medication) to adjust dosage.", "Lifelong Therapy Required in most cases.", "Dogs (Hypothyroidism)", "Starting dose: 0.02 mg/kg (20mcg) PO every 12 hours", "or 0.04–0.06 mg/kg once daily(40-60mcg).", "Maintenance dose: Typically 0.02–0.04 mg/kg (20-40mcg) every 12 hours (or adjusted based on T4 monitoring).", "Cats (Hypothyroidism - Rare, or Post-Radioiodine Therapy)", "Dose: 0.05–0.1 mg/cat PO every 24 hours (much lower than dogs).", "(50mcg - 100mcg)", "Note: Hypothyroidism is uncommon in cats; levothyroxine is more often used after thyroidectomy or radioactive iodine treatment."], "Prevention Methods": ["1. Balanced Nutrition", "Feed a high-quality, well-balanced diet that meets your pet’s nutritional needs.", "Avoid excessive iodine deficiency or excess, as both can affect thyroid function.", "Consult your veterinarian before adding supplements (especially iodine or raw thyroid gland supplements).", "2. Regular Veterinary Check-ups", "Routine blood tests (including thyroid panels) can help detect early signs of thyroid dysfunction.", "Senior pets (especially dogs over 7 years) should have annual or biannual screenings.", "3. Avoid Toxins and Environmental Triggers", "Endocrine Disruptors: Limit exposure to chemicals (pesticides, herbicides, BPA in plastics) that may interfere with thyroid function.", "Heavy Metals: Ensure your pet isn’t exposed to lead or mercury, which can harm the thyroid.", "Certain Medications: Long-term use of some drugs (e.g., sulfa antibiotics, glucocorticoids) may affect thyroid health.", "4. Maintain a Healthy Weight", "Obesity can contribute to metabolic and endocrine imbalances. Keep your pet at an ideal weight through diet and exercise.", "Hypothyroidism itself can cause weight gain, so early detection is key.", "5. Genetic and Breed Awareness", "Some breeds are predisposed to hypothyroidism (e.g., Golden Retrievers, Dobermans, Dachshunds, Cocker Spaniels).", "If you have a high-risk breed, discuss preventive screening with your vet.", "6. Avoid Over-Vaccination", "Some studies suggest a potential link between excessive vaccinations and autoimmune thyroiditis (a common cause of hypothyroidism in dogs).", "Follow your vet’s advice on a tailored vaccine schedule.", "7. Monitor for Early Signs", "Symptoms like lethargy, weight gain, hair loss, skin infections, or cold intolerance warrant a thyroid check.", "Early treatment can prevent complications.", "8. Spay/Neuter Considerations", "Some evidence suggests that spayed/neutered dogs may have a higher risk of hypothyroidism, though this is debated. Discuss pros and cons with your vet.", "9. Autoimmune Prevention (Limited Control)", "Lymphocytic thyroiditis (an autoimmune cause) is hereditary in some breeds. Responsible breeding practices can reduce prevalence.", "10. Stress Management", "Chronic stress may impact immune and endocrine health. Provide a stable, low-stress environment."], "Standard Prescription": ["Dog:", "1. Tab. Euthycin/ Thyrox/ Thynor- 100mcg.", "1Tab/ 5Kgs, Once daily- Continue.", "2. Syp. PA Zinc - 100ml,", "1-2 Spoon/ Dog Once Daily for 1 Month.", "Cat:", "Tab. Euthycin/ Thyrox/ Thynor- 50mcg.", "1Tab/ Cat, Once daily- Continue.", "2. Syp. PA Zinc - 100ml,", "1/2-1 Spoon/ Dog Once Daily for 1 Month."], "Last Updated": "8/8/2025", "_id": 52}, {"Name": "Hypothyroidism (Common in Dogs) — Metabolic", "Type": "Metabolic", "Animal": "Pet and Companion Animals", "Severity": "Moderate", "Contagion": "✅ Non-Contagious", "Symptoms": ["Weight gain (without increased appetite)", "Lethargy & exercise intolerance", "Hair loss (alopecia),  especially on the trunk,  tail,  and hind legs", "Dry,  flaky skin & dull coat", "Cold intolerance (seeking warm spots)", "Slow heart rate (bradycardia)", "Recurrent skin/ear infections", "Neurological signs (rare,  but may include weakness or facial nerve paralysis)"], "Causes": "endocrine disorder", "Treatment Protocol": ["Daily Synthetic Thyroid Hormone (Levothyroxine, L-Thyroxine) – Given orally, usually twice daily initially, then adjusted based on response.", "Regular Monitoring: Blood tests (T4 levels checked 4-6 hours after medication) to adjust dosage.", "Lifelong Therapy Required in most cases.", "Dogs (Hypothyroidism)", "Starting dose: 0.02 mg/kg (20mcg) PO every 12 hours", "or 0.04–0.06 mg/kg once daily(40-60mcg).", "Maintenance dose: Typically 0.02–0.04 mg/kg (20-40mcg) every 12 hours (or adjusted based on T4 monitoring).", "Cats (Hypothyroidism - Rare, or Post-Radioiodine Therapy)", "Dose: 0.05–0.1 mg/cat PO every 24 hours (much lower than dogs).", "(50mcg - 100mcg)", "Note: Hypothyroidism is uncommon in cats; levothyroxine is more often used after thyroidectomy or radioactive iodine treatment."], "Prevention Methods": ["Regular screening in older cats", "Avoid high-iodine or soy-rich diets", "Annual thyroid function tests"], "Standard Prescription": ["Dog:", "1. Tab. Euthycin/ Thyrox/ Thynor- 100mcg.", "1Tab/ 5Kgs, Once daily- Continue.", "2. Syp. PA Zinc - 100ml,", "1-2 Spoon/ Dog Once Daily for 1 Month.", "Cat:", "Tab. Euthycin/ Thyrox/ Thynor- 50mcg.", "1Tab/ Cat, Once daily- Continue.", "2. Syp. PA Zinc - 100ml,", "1/2-1 Spoon/ Dog Once Daily for 1 Month."], "Last Updated": "7/23/2025", "_id": 53}, {"Name": "Infectious Canine Hepatitis (ICH)- (Dog: 20kgs )", "Type": "Viral", "Animal": "Pet and Companion Animals", "Severity": "Severe", "Contagion": "⚠️ Contagious", "Symptoms": "Degeneration of Liver, Jaundice, Loss of Appetite, Vomiting, Abdomina Pain, Tender abdomen, Blue eye: Corneal clouding (edema) can occur, also known as \"hepatitis blue eye\". Hemorrhagic diarrhea, conjunctivitis, petechial hemorrhages, and in severe cases, neurological signs.", "Causes": ["Canine Hepatitis Virus/", "Canine Adenovirus 1 (CAV-1)"], "Treatment Protocol": ["1. Immediate Veterinary Care", "A. Hospitalization & Supportive Care", "IV Fluid Therapy (Lactated Ringer’s or balanced crystalloids) to correct dehydration and electrolyte imbalances.", "Anti-emetics (e.g., Maropitant [Cerenia]) if vomiting is present.", "Liver Support:", "Liver protectant.", "Vitamin K1 (if coagulopathy is present due to liver damage).", "Ursodeoxycholic Acid – Helps bile flow in cholestatic cases.", "B. Antibiotics (for secondary bacterial infections)", "Ceftiofor/ceftriaxone/Ampicillin/ Ciprofloxacin/ marbofloxacin/Enrofloxacin (avoid in young pups due to cartilage risk).", "Metronidazole (if hepatic encephalopathy is suspected).", "C. Blood/Plasma Transfusion", "Needed in severe cases with hypoproteinemia or coagulopathy.", "2. Specific Treatments for Complications", "A. Hepatic Encephalopathy", "Lactulose (oral or enema) to reduce ammonia absorption.", "Low-protein diet (temporarily) to decrease ammonia production.", "B. Uveitis (Blue Eye Phenomenon)", "Topical Steroids (e.g., Prednisolone acetate 1% eye drops).", "Atropine (if corneal edema or pain is present).", "C. Acute Kidney Injury", "Fluid diuresis (0.9% NaCl + potassium supplementation if needed).", "Dopamine or Furosemide (in oliguric/anuric cases).", "Bland Diet (e.g., boiled chicken, rice, or hepatic prescription diet)."], "Prevention Methods": ["Prevention & Vaccination", "Core Vaccination (CAV-2 vaccine, part of DHPP) – Protects against both CAV-1 and CAV-2.", "Puppies: Start at 6-8 weeks, boost every 3-4 weeks until 16 weeks.", "Adults: Yearly or triennial booster (as per vet recommendation).", "Avoid exposure to infected dogs or contaminated environments."], "Standard Prescription": ["Dog: 20kgs", "1. Cap. Silybin-140mg, 1 cap 0nce - twice daily -15-30 days.", "2. Syp. Femotid- 40mg, 0.5ml Fed Orally before meal twice daily for 1month", "3. Syp. Pepto care – 87.5 mg/5 ml-  10m, Fed Orally Twice Daily for 15 Days.", "4. Inj. Hartsol - 20-4-ml, IV, Twice Daily For 7 Days.", "5. Syp. Cortan - 10ml Fed Orally Once daily for 7-10 Days."], "Last Updated": "7/18/2025", "_id": 54}, {"Name": "Infertility in Female", "Type": "Chronic", "Animal": "Pet and Companion Animals", "Severity": "Moderate", "Contagion": "✅ Non-Contagious", "Symptoms": ["No Heat Cycles (Absent or irregular estrus).", "Repeated Mating Without Pregnancy.", "Abnormal Discharge (Bloody,  pus-filled,  or foul-smelling).", "Miscarriages or Stillbirths.", "Behavioral Changes (Lethargy,  loss of appetite).", "Weight Fluctuations (Sudden gain or loss)."], "Causes": ["Uterine infections (pyometra)", "Hormonal imbalance", "Cystic ovaries", "Malnutrition or obesity"], "Treatment Protocol": ["A. Medical Treatments", "Hormonal Therapy (Progesterone, Estrogen, or GnRH injections to regulate cycles).", "Antibiotics (For bacterial infections like Brucellosis or Pyometra).", "Ovulation Inducers (e.g., Cabergoline for cystic ovaries).", "B. Surgical Interventions", "Ovariohysterectomy (Spaying) – Recommended for pets not intended for breeding.", "Cyst Removal – If ovarian cysts are present.", "Repair of Anatomical Defects – Correcting uterine or vaginal abnormalities.", "C. Assisted Reproductive Techniques", "Artificial Insemination (Using high-quality semen).", "Embryo Transfer (For high-value breeding animals).", "D. Lifestyle & Management Adjustments", "Optimal Breeding Timing (Track heat cycles via progesterone testing).", "Weight Management – Maintain ideal body condition.", "Reduced Stress Environment – Calm, clean, and comfortable housing."], "Prevention Methods": ["Monitor estrous cycles", "Maintain body condition score", "Screen for infections and endocrine disorders"], "Standard Prescription": ["1. Tab. Helminthicide L", "1 Tab for 10 kgs at 5 days intervals (2 dose).", "2. Syp. ES Plus- 100ml", "1ml/ cat,", "3ml Dog fed orally once daily for 0ne month.", "If not response then:", "Acyclic Animals:", "Inj. Fertilon- 5ml,", "Dog: 2-3 ml, IM, multiple dose 7 days intervals.", "Cat: 1ml, IM, multiple dose 7 days intervals.", "Cyclic Animals:", "Inj. Prostenol - 2ml,", "Dog: 1-2 ml, IM, multiple dose 10-11 days intervals.", "Cat: 0.5- 1ml, IM, multiple dose 10-11 days intervals."], "Last Updated": "7/23/2025", "_id": 55}, {"Name": "Infertility in Male", "Type": "Chronic", "Animal": "Pet and Companion Animals", "Severity": "Moderate", "Contagion": "✅ Non-Contagious", "Symptoms": ["Low libido (lack of interest in mating)", "Small or soft testicles (indicating atrophy)", "Pain or swelling in the scrotum (orchitis/epididymitis)", "Abnormal semen (low sperm count,  poor motility,  or abnormal morphology)", "Difficulty mating (erectile dysfunction or anatomical defects)", "Systemic illness (fever,  lethargy,  weight loss – if due to infection)"], "Causes": ["Testicular atrophy or infections", "Hormonal disorders", "Genetic defects", "High environmental temperature"], "Treatment Protocol": ["A. Medical Treatments", "Antibiotics – For bacterial infections (e.g., Brucellosis, prostatitis).", "Hormone Therapy – Testosterone or GnRH analogs if hormonal deficiency is confirmed.", "Anti-inflammatory drugs – For orchitis/epididymitis.", "B. Surgical Interventions", "Neutering – Recommended if infertility is due to untreatable conditions.", "Orchiopexy – Surgical correction for cryptorchidism (if detected early).", "C. Assisted Reproductive Techniques (ART)", "Semen collection & evaluation – Assess sperm quality.", "Artificial Insemination (AI) – Using high-quality sperm.", "Sperm freezing – For valuable breeding males.", "D. Lifestyle & Management Adjustments", "Weight management – If obesity is a factor.", "Stress reduction – Provide a calm environment.", "Supplementation – Antioxidants (CoQ10, vitamin C) to improve sperm health."], "Prevention Methods": ["Protect from heat/stress", "Avoid inbreeding", "Good nutrition (zinc, selenium)", "Routine veterinary checks"], "Standard Prescription": ["1. Tab. Helminthicide L", "1 Tab for 10 kgs at 5 days intervals (2 dose).", "2. Syp. ES Plus- 100ml", "1ml/ cat,", "3ml Dog fed orally once daily for 0ne month.", "3."], "Last Updated": "7/23/2025", "_id": 56}, {"Name": "Inflammatory Bowel Disease (IBD) (Dog: 20kgs)", "Type": "Metabolic", "Animal": "Pet and Companion Animals", "Severity": "Mild", "Contagion": "✅ Non-Contagious", "Symptoms": ["Chronic diarrhea (with or without blood/mucus)", "Vomiting (off and on, sometimes after meals)", "Weight loss (despite eating normally)", "Poor appetite (or sometimes increased appetite)", "Flatulence (gas)", "Abdominal discomfort (may whine, stretch, or avoid touch)", "Other Possible Signs:", "Lethargy (less active)", "Dehydration", "Borborygmi (loud stomach gurgling)", "Pica (eating non-food items)", "dull fur"], "Causes": ["Causes & Risk Factors:", "Immune-mediated response (overreaction to gut bacteria/food antigens)", "Genetic predisposition (certain breeds are more prone)", "Dietary intolerance/allergies (e.g., protein sources, additives)", "Dysbiosis (imbalance in gut microbiome)", "Chronic parasitic/fungal/bacterial infections (e.g., Giardia, Clostridium)", "Common Breeds Affected:", "Dogs: German Shepherds, Boxers, Yorkshire Terriers, Shar-Peis", "Cats: Siamese, domestic shorthairs"], "Treatment Protocol": ["1. Dietary Management (Most Important!)", "✔ Hypoallergenic or Novel Protein Diet", "Hydrolyzed protein diets (e.g., Royal Canin HP, Hill’s z/d)", "Limited-ingredient diets (e.g., duck, rabbit, venison)", "✔ High-Fiber Diets (for some cases of large bowel diarrhea)", "✔ Probiotics & Prebiotics (e.g., FortiFlora, Proviable)", "2. Medications", "Steroids (Prednisone, Budesonide) → Reduce inflammation (mainstay treatment).", "Immunosuppressants (if steroids fail):", "Azathioprine (dogs)", "Chlorambucil (cats)", "Antibiotics (if bacterial overgrowth is suspected, e.g., Tylosin, Metronidazole).", "Anti-nausea/Anti-vomiting Drugs (e.g., Cerenia, Ondansetron).", "B12 (Cobalamin) Supplements → Many IBD pets have B12 deficiency.", "3. Alternative Therapies", "Omega-3 Fatty Acids (fish oil) → Anti-inflammatory effects.", "Bone Broth or Gut-Soothing Supplements (e.g., Slippery Elm, L-Glutamine)."], "Prevention Methods": ["Hypoallergenic diet, stress reduction.", "✔ Feed a consistent, high-quality diet.", "✔ Avoid sudden food changes.", "✔ Use probiotics regularly.", "✔ Minimize stress (pheromone diffusers, routine)."], "Standard Prescription": ["Dog: 20kgs", "1. Cap. Silybin-140mg, 1 cap 0nce - twice daily -15-30 days.", "2. Syp. Femotid- 40mg, 0.5ml Fed Orally before meal twice daily for 1month", "3. Syp. Pepto care – 87.5 mg/5 ml-  10m, Fed Orally Twice Daily for 15 Days.", "4. Inj. Hartsol - 20-4-ml, IV, Twice Daily For 7 Days.", "5. Syp. Cortan - 10ml Fed Orally Once daily for 7-10 Days."], "Last Updated": "7/19/2025", "_id": 57}, {"Name": "Ivermectin Poisoning", "Type": "Poisoning", "Animal": "Pet and Companion Animals", "Severity": "Severe", "Contagion": "✅ Non-Contagious", "Symptoms": ["Signs typically appear within 4–12 hours of ingestion and may include:", "Neurological symptoms:", "Tremors,  seizures", "Disorientation,  wobbliness (ataxia)", "Dilated pupils", "Blindness", "Coma", "Gastrointestinal signs:", "Drooling", "Vomiting", "Diarrhea", "Other symptoms:", "Lethargy or weakness", "Slow heart rate (bradycardia)", "Difficulty breathing", "Severe poisoning can lead to respiratory failure and death if untreated."], "Causes": ["Accidental ingestion of livestock or dog formulations (e.g.,  horse paste,  cattle injections).", "Incorrect dosing (cats require much lower doses than dogs or livestock).", "Topical exposure (some flea products for dogs contain ivermectin and can poison cats if licked or applied incorrectly).", "💡 Toxic Dose: As little as 0.1 mg/kg can cause toxicity in some cats,  while doses >0.5 mg/kg are often severe or fatal."], "Treatment Protocol": ["Decontamination (if recent ingestion):", "Inducing vomiting (only if within 1–2 hours and the cat is alert).", "Neostigmine as repolarozing agent.", "Activated charcoal to prevent further absorption.", "Supportive Care:", "IV fluids to maintain hydration.", "Temperature regulation (cats may become hypothermic).", "Neurological Support:", "Anti-seizure medications (e.g., diazepam).", "Drugs to counteract CNS depression (e.g., lipid emulsion therapy in severe cases).", "Monitoring:", "Hospitalization for 24–72 hours, as symptoms can worsen over time.", "⚠️ No specific antidote exists, so treatment focuses on managing symptoms."], "Prevention Methods": ["Never use livestock or dog ivermectin products on cats unless prescribed by a vet.", "Store medications securely—keep horse paste, cattle injections, and dog preventives away from cats.", "Consult a vet before using any antiparasitic—some \"\"cat-safe\"\" products may still contain ivermectin (e.g., some ear mite treatments at low doses)."], "Standard Prescription": ["1. Inj. Stigmin/G-Neostigmin- 1ml ample @12.5-25 kg.", "2. Inj. Normal saline (IV/SC 10-20ml/kg).Nerve Tonic", "3. Inj. Roxadex- 0.1ml/IM/ Once-Twice daily 1- days.", "4. Sedation (if excitement)", "• Tab. 1-2.5/kg or inj. Sedil - 1ml -2-5kgs. Or", "• Tab Xyril – ½-5kg."], "Last Updated": "7/29/2025", "_id": 58}, {"Name": "Jaundice (Dog: 20kgs)", "Type": "Metabolic", "Animal": "Pet and Companion Animals", "Severity": "Severe", "Contagion": "✅ Non-Contagious", "Symptoms": "Yellowing of skin, eyes, and gums, Lethargy and decreased activity, Loss of appetite or anorexia, Vomiting and diarrhea, Weight loss, Fever, abdominal pain, changes in urine color (dark yellow), and increased thirst are also possible.", "Causes": ["1. Pre-Hepatic (Before the Liver – Excessive Red Blood Cell Breakdown)", "Hemolytic anemia (immune-mediated, infections, toxins)", "Infections: Babesia, Mycoplasma (hemotropic mycoplasmosis)", "Toxins: Onions, zinc, certain medications", "Immune-mediated hemolytic anemia (IMHA) (autoimmune destruction of RBCs)", "2. Hepatic (Liver Disease – Impaired Bilirubin Processing)", "Hepatitis (infectious or toxic)", "Liver cirrhosis (chronic scarring)", "Liver cancer (e.g., hepatocellular carcinoma, lymphoma)", "Leptospirosis (bacterial infection, more common in dogs)", "Feline Infectious Peritonitis (FIP) (in cats)", "Toxins (acetaminophen, xylitol, aflatoxins in moldy food)", "3. Post-Hepatic (Bile Duct Obstruction – Bilirubin Can’t Exit)", "Gallbladder obstruction (stones, sludge, tumors)", "Pancreatitis (inflammation pressing on bile ducts)", "Bile duct cancer or strictures"], "Treatment Protocol": ["1. Treating the Underlying Cause", "Hemolytic anemia → Immunosuppressants (steroids), blood transfusion", "Infections (Leptospirosis, Babesia) → Antibiotics (doxycycline), antiparasitics", "Liver disease → Antioxidants (SAMe, milk thistle), liver-support diets", "Bile duct obstruction → Surgery (removal of gallstones, stent placement)", "Toxins (e.g., acetaminophen poisoning in cats) → Antidotes (N-acetylcysteine), IV fluids", "2. Supportive Care", "✔ Fluid therapy (for dehydration)", "✔ Anti-nausea meds (maropitant, ondansetron)", "✔ Liver protectants (Denamarin, Ursodiol)", "✔ Dietary management (low-fat, high-quality protein, hepatic prescription diets)"], "Prevention Methods": ["Vaccinate against Leptospirosis (dogs) and prevent tick-borne diseases", "✔ Avoid toxic foods (onions, xylitol, acetaminophen)", "✔ Regular vet check-ups for senior pets", "✔ Feed a balanced diet to support liver health"], "Standard Prescription": ["Dog: 20kgs", "1. Syp. Liv-52, 20ml Fed Orally, Twice daily for 15 days.", "2. Syp. Femotid- 40mg, 0.5ml Fed Orally before meal twice daily for 1month", "3. Syp. Pepto care – 87.5 mg/5 ml-  10m, Fed Orally Twice Daily for 15 Days.", "4. Inj. Hartsol - 20-4-ml, IV, Twice Daily For 7 Days.", "5. Syp. Cortan - 10ml Fed Orally Once daily for 7-10 Days."], "Last Updated": "7/19/2025", "_id": 59}, {"Name": "Keratoconjunctivitis (Cat: 3 kg)", "Type": "Bacterial", "Animal": "Pet and Companion Animals", "Severity": "Severe", "Contagion": "⚠️ Contagious", "Symptoms": ["Redness and Swelling:", "The conjunctiva (the membrane lining the eyelid and eyeball) and eyelids may appear red and swollen.", "Discharge:", "Eye discharge can range from clear and watery to thick and yellowish or greenish.", "Squinting and Blinking:", "Sensitivity to light or pain can cause the animal to squint or blink excessively.", "Rubbing or Pawing at the Eye:", "Animals may try to relieve itching or irritation by rubbing their face or pawing at their eye.", "Other Symptoms:", "Nasal discharge, sneezing, or coughing can sometimes accompany conjunctivitis, especially when caused by a systemic infection."], "Causes": ["Infections:", "Bacterial infections (e.g., Streptococcus, Staphylococcus) and viral infections (e.g., feline herpesvirus-1 in cats) are common culprits.", "Allergies:", "Allergic reactions to pollen, dust, or other environmental allergens can trigger conjunctivitis.", "Dry Eye (Keratoconjunctivitis Sicca - KCS):", "Insufficient tear production leads to inflammation and irritation.", "Eye Injuries:", "Trauma to the eye or foreign bodies (like grass seeds) can cause inflammation.", "Eyelid and Eyelash Abnormalities:", "Conditions like entropion (inward turning eyelid) or eyelashes growing in the wrong direction can irritate the eye.", "Other Conditions:", "Glaucoma, uveitis (inflammation of the middle layer of the eye), and tumors can also lead to conjunctivitis."], "Treatment Protocol": ["Topical Medications:", "Antibiotics, anti-inflammatories, and artificial tears are often prescribed to treat infections and reduce inflammation.", "Artificial Tears:", "Help to keep the eyes moist and comfortable, particularly in cases of dry eye.", "Allergy Management:", "In cases of allergic conjunctivitis, your veterinarian may recommend antihistamines, steroids, or allergen avoidance strategies.", "Surgery:", "In some cases, surgery may be necessary to correct eyelid or eyelash problems or to remove tumors.", "Home Care:", "Saline Solution: Flush the eye with a saline solution (1/4 teaspoon of salt in 1 cup of lukewarm water) several times a day to remove discharge.", "Warm Compress: Apply a warm compress to the affected eye to soothe irritation.", "Clean the Area: Gently clean any discharge from around the eye with a soft, damp cloth."], "Prevention Methods": ["Maintain Good Hygiene: Keep living areas, bedding, and toys clean to minimize exposure to irritants.", "Regular Eye Exams: Schedule regular checkups with your veterinarian to detect and address eye problems early.", "Manage Allergies: Work with your veterinarian to identify and manage your pet's allergies.", "Minimize Exposure to Irritants: Avoid cigarette smoke, dust, and other potential irritants.", "Keep Vaccinations Up-to-Date: Protect your pet against infectious diseases that can lead to conjunctivitis.", "Good Personal Hygiene: Wash your hands after handling your pet and before touching your own eyes."], "Standard Prescription": ["Cat: 3 kg", "1. Eye drop Teargen – 2-3 drops, wash the eye twice daily, 5-7 days.", "2. E/D. Moxiflox – 2 Drops, Apply locally three/four times daily, 5-7 days.", "3. Inj. Mel vet 0.5%- 0.15 ml sc once daily, 2-3 days.", "4. Syp. Cefixime – 100mg, 1.25 ml twice daily, fed orally, 5-7 days.", "5. Syp. Alatrol – ½ tsp once daily 7 days."], "Last Updated": "7/18/2025", "_id": 60}, {"Name": "Kidney Disease (Chronic Kidney Disease – CKD)", "Type": "Chronic", "Animal": "Pet and Companion Animals", "Severity": "Severe", "Contagion": "✅ Non-Contagious", "Symptoms": ["Early signs may be subtle,  but symptoms worsen as kidney function declines:", "Increased thirst and urination (early sign)", "Decreased appetite & weight loss", "Lethargy and weakness", "Vomiting and diarrhea", "Bad breath (ammonia-like odor due to uremia)", "Poor coat condition", "Mouth ulcers", "Dehydration (dry gums,  sunken eyes)", "High blood pressure (can lead to blindness)"], "Causes": ["Age-related kidney degeneration", "Toxins (e.g.,  antifreeze,  grapes)", "Infections (leptospirosis)", "Polycystic kidney disease (genetic)"], "Treatment Protocol": ["CKD is not curable, but proper management can slow progression and improve quality of life.", "A. Dietary Management", "Low-protein, low-phosphorus diet (prescription kidney diets like Hill’s k/d or Royal Canin Renal).", "Increased omega-3 fatty acids (anti-inflammatory benefits).", "Wet food for hydration or subcutaneous fluids if needed.", "B. Medications & Supplements", "Phosphate binders (e.g., aluminum hydroxide) to reduce phosphorus levels.", "ACE inhibitors (e.g., benazepril) to control blood pressure.", "Anti-nausea drugs (e.g., maropitant, famotidine).", "Potassium supplements (if blood levels are low).", "Erythropoietin injections (for anemia in advanced cases).", "C. Fluid Therapy", "Subcutaneous (SQ) fluids at home to maintain hydration.", "D. Regular Monitoring", "Blood tests (BUN, creatinine, SDMA)", "Urinalysis (checking protein loss & concentration)", "Blood pressure monitoring"], "Prevention Methods": ["Adequate hydration", "Avoid nephrotoxic substances", "Early screening in senior pets", "Kidney-friendly diets"], "Standard Prescription": ["1. Syp. UTKid- Cat: 2.5 ml/ Twice daily. Dog: 5-10ml/ Twice daily.", "2. Inj. Normasol + Ammonium Chloride", "100 ml + 5Gm, UB Flash, 6 Hours Intervals for 7 Days. Or Fed Orally.", "3. 1. Inj. Acicef -4", "0.2 ml, IM Daily for 7 Days (If Infection Present)", "4.  Kidney/ Urinery Formula Feed/ Liquid feed", "Fed ad lib daily."], "Last Updated": "7/23/2025", "_id": 61}, {"Name": "Lacrimitis (Cat-2kg)", "Type": "Bacterial", "Animal": "Pet and Companion Animals", "Severity": "Severe", "Contagion": "⚠️ Contagious", "Symptoms": ["Excessive tearing (epiphora): The most noticeable symptom, where the eye consistently waters.", "Redness and inflammation: The conjunctiva (the membrane lining the eyelid and covering the white of the eye) may appear red and swollen.", "Discharge: Thick, yellow or green discharge from the eye, especially from the inner corner where the tear ducts drain.", "Foul odor: Infected or obstructed tear ducts can lead to a noticeable odor around the eyes due to bacterial growth.", "Eye rubbing or pawing: The pet may try to rub or scratch at the affected eye due to irritation.", "Tear staining: Chronic tearing can cause reddish-brown stains on the fur around the eyes."], "Causes": ["Obstruction:", "Blockages in the nasolacrimal duct, which drains tears from the eye, can be caused by foreign bodies, inflammation, or even tumors.", "Infection:", "Bacterial or viral infections can inflame the tear drainage system.", "Inflammation:", "Conditions like conjunctivitis or other eye infections can lead to inflammation and swelling of the tear ducts.", "Foreign bodies:", "Things like dust, dirt, or even eyelashes can irritate the eye and cause inflammation and potential blockage of the tear ducts.", "Anatomical abnormalities:", "Some breeds are more prone to tear duct issues due to their facial structure."], "Treatment Protocol": ["Antibiotics: Prescription eye drops or oral medications to treat bacterial infections.", "Anti-inflammatories: Topical or oral medications to reduce swelling and inflammation.", "Flushing: In some cases, the tear ducts may be flushed with sterile saline to remove blockages.", "Surgery: In severe cases, surgery may be necessary to correct anatomical abnormalities or remove obstructions.", "Addressing underlying causes: Treating the root cause of the problem, such as allergies or infections, is crucial for long-term management."], "Prevention Methods": ["egular cleaning:", "Gently cleaning the area around
