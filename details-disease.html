the eyes with a damp cloth or pet-safe wipes can help prevent tear buildup and potential infections.", "Fly control:", "Minimizing exposure to flies, which can carry bacteria, can reduce the risk of infection.", "Addressing underlying conditions:", "Managing allergies, infections, or other eye conditions that can contribute to lacrimitis can help prevent future issues.", "Routine veterinary checkups:", "Regular visits to the vet can help identify and address potential problems early."], "Standard Prescription": ["Cat-2kg,", "1. Eye drop Teargen – 2-3 drops, wash the eye twice daily.", "2. E/D. Civodex/Moxidex – Apply locally three/four times daily.", "3. Inj. MPain vet 0.5%- 0.2 ml sc once daily.", "4. Syp. Cefixime – 100mg, 1.25 ml Twice Daily.", "5. Syp. Alatrol – ½ TSP once daily 7 days."], "Last Updated": "7/18/2025", "_id": 62}, {"Name": "Leishmaniasis", "Type": "Parasitic Diseases", "Animal": "Pet and Companion Animals", "Severity": "Severe", "Contagion": "⚠️ Contagious", "Symptoms": ["Weight loss and poor body condition.", "Hair loss around eyes and ears (“spectacle sign”).", "Skin ulcers,  crusts,  and thickened areas.", "Nosebleeds and swollen limbs or joints.", "Enlarged lymph nodes or spleen.", "Chronic kidney issues in later stages.", "⚠️ Emergency Signs:", "Kidney failure signs (vomiting,  no urination).", "Severe anemia or collapse.", "1. Types of Leishmaniasis in Pets", "Visceral Leishmaniasis (VL) – Affects internal organs (liver,  spleen,  bone marrow).", "Cutaneous Leishmaniasis (CL) – Causes skin lesions and ulcers.", "Mucocutaneous Leishmaniasis – Affects mucous membranes (rare in pets).", "2. Symptoms in Dogs", "Weight loss,  lethargy,  fever", "Skin lesions (ulcers,  scaling,  hair loss,  hyperkeratosis)", "Enlarged lymph nodes and spleen", "Ocular lesions (conjunctivitis,  keratitis)", "Lameness due to joint inflammation", "Chronic kidney disease (a leading cause of death)"], "Causes": ["Protozoal infection,  sandfly bites,  endemic exposure,  immune response.", "Leishmania spp. Parasite", "Spread by bite of infected female sandflies.", "Geographic Distribution", "Found in Mediterranean,  Middle East,  South Asia,  parts of Latin America.", "Weakened Immunity", "Some breeds and immunocompromised animals are more susceptible.", "Environmental Exposure", "Outdoor housing near sandfly habitats increases risk.", "Leishmaniasis is a parasitic disease caused by protozoa of the Leishmania genus,  transmitted through the bite of infected female sandflies (primarily Phlebotomus and Lutzomyia species). It affects both humans and animals,  including pets like dogs,  which are the primary reservoir for zoonotic visceral leishmaniasis."], "Treatment Protocol": ["Antimonials (Meglumine antimoniate) + Allopurinol (commonly used).", "Miltefosine (oral drug, effective in some cases).", "Supportive care (kidney protection, skin treatments).", "1. Visceral Leishmaniasis (VL, Kala-azar)", "First-line drugs:", "Liposomal Amphotericin B (preferred, especially in immunocompetent patients).", "Dose: 0.5–1 mg/kg IV in 5% dextrose, given slowly (over 4–6 hours) to reduce nephrotoxicity.", "Frequency: Every 48–72 hours (or 2–3 times per week) for 4–8 weeks (cumulative dose ~8–12 mg/kg).", "Miltefosine (oral, effective in India): 2 mg/kg PO once daily for 4 weeks.", "Pentavalent antimonials (e.g., Sodium stibogluconate, Meglumine antimoniate)", "Paromomycin (aminosidine)", "Alternative/Combination Therapies:", "Amphotericin B deoxycholate (less preferred due to toxicity)", "Combination therapy (e.g., liposomal amphotericin B + miltefosine or paromomycin) for better efficacy", "HIV/VL co-infection:", "Prolonged therapy with liposomal amphotericin B + miltefosine, followed by secondary prophylaxis (e.g., monthly amphotericin B)", "2. Cutaneous Leishmaniasis (CL)", "Localized lesions (may self-heal in some species):", "Topical treatments:", "Paromomycin ointment (15% + 12% methylbenzethonium chloride)", "Imiquimod cream (immune modulator, adjunctive)", "Intralesional antimonials (e.g., sodium stibogluconate) weekly until healing", "Systemic therapy (for large, multiple, or cosmetically sensitive lesions):", "Miltefosine", "Oral azoles (fluconazole, itraconazole—variable efficacy depending on species)", "3. Mucocutaneous Leishmaniasis (MCL)", "Requires aggressive systemic treatment:", "Pentavalent antimonials", "Liposomal amphotericin B", "Miltefosine (28-day course, useful in L. braziliensis)", "4. Post-Kala-azar Dermal Leishmaniasis (PKDL)", "Treatment needed to prevent transmission (especially in endemic areas):", "Liposomal amphotericin B", "Miltefosine (12-week course in India"], "Prevention Methods": ["Insect control, avoid outdoor exposure at night.", "✅ Use insect repellents and protective collars.", "✅ Avoid outdoor walks at dawn/dusk (when sandflies are active).", "✅ Keep sleeping areas protected with mosquito nets/screens.", "✅ Eliminate breeding areas (moist, dark places).", "✅ Vaccinate in endemic areas (if available).", "✅ Test regularly in endemic zones.", "✅ Use topical prevention in high-risk areas."], "Standard Prescription": ["1. Amphotericin-B:", "Inj. Amphoject/ Tericin-50mg/vial", "(10ml vial).", "1ml @ 1-2kg, IV with NS, 2-3Times per week.", "2. Miltefosine: 2 mg/kg PO once daily for 4 weeks.", "Capsule Miltefosine - 50 mg.", "1 Capsule @ 25kg, Once daily for 4 weeks.", "3. Inj. Acimec-1%, 0.05ml/ kg, 7-14 days intervals.", "4. Oint. Dermasol N, APply Locally twice daily- 15-20days."], "Last Updated": "7/28/2025", "_id": 63}, {"Name": "Leptospirosis (Cat: 3Kgs)", "Type": "Bacterial", "Animal": "Pet and Companion Animals", "Severity": "Critical", "Contagion": "✅ Non-Contagious", "Symptoms": ["Increased thirst and urination.", "Lethargy and vomiting.", "Weight loss.", "Bad breath (uremic odor).", "Abdominal pain in kidney area.", "Loss of appetite.", "Swelling of limbs (in chronic cases).", "Possible blood in urine.", "Fever,  diarrhea", "Jaundice (yellow gums/eyes)", "Increased thirst/urination (kidney involvement)", "Muscle pain,  stiffness", "Severe cases: Liver/kidney failure,  bleeding disorders,  death."], "Causes": ["1. Bacterial Infections", "Leptospira spp.,  E. coli,  ascending UTIs.", "2. Immune-Mediated Reactions", "Glomerulonephritis due to immune complex deposition.", "3. Toxins & Drugs", "NSAIDs,  aminoglycosides,  ethylene glycol.", "4. Systemic Illnesses", "Diabetes,  hypertension,  or autoimmune diseases."], "Treatment Protocol": ["Antibiotics (e.g., doxycycline, penicillin)", "Supportive care (IV fluids, liver/kidney support)", "Isolation (to prevent spread to humans/other pets)", "Alteration of Urine Ph."], "Prevention Methods": ["✅ Prevent infections (Leptospirosis vaccine, good hygiene).", "✅ Avoid nephrotoxic drugs or toxins.", "✅ Maintain clean drinking water.", "✅ Regular blood and urine screening.", "✅ Manage chronic illnesses (diabetes, hypertension)."], "Standard Prescription": ["Cat- 3kg", "1. Inj. Streptopen-2.5gm", "0.30ml, Intra Muscularly, Twice Daily daily - 5-7 Days.", "2. Tab. Dr. Petz Iromin", "Body weight upto 1/2 Tab Once Daily 15 days.", "3. Liv 52-", "5ml, Fed Orally Once daily for 1month", "4. Syp UTKid", "2.5 ml, Fed Orally Twice Daily for 15 Days."], "Last Updated": "7/19/2025", "_id": 64}, {"Name": "Listeriosis", "Type": "Bacterial", "Animal": "Pet and Companion Animals", "Severity": "Moderate", "Contagion": "⚠️ Contagious", "Symptoms": ["Symptoms vary based on the form of infection:", "1. Neurological Form (Most Common in Dogs & Cats)", "Head Tilt,  Circling,  Loss of Balance (vestibular disease)", "Seizures,  Muscle Tremors", "Facial Paralysis,  Drooling", "Depression,  Lethargy", "Fever (but sometimes normal or low temperature)", "2. Gastrointestinal Form", "Vomiting,  Diarrhea (sometimes bloody)", "Loss of Appetite,  Dehydration", "Abdominal Pain", "3. Septicemic Form (Rare,  Severe)", "High Fever,  Shock", "Multi-organ Failure"], "Causes": ["1. Ingestion of Contaminated Food", "Raw/Uncooked Meat (especially poultry,  beef)", "Unpasteurized Dairy (milk,  cheese)", "Rotten Vegetables & Silage (common in farm animals)", "2. Weakened Immune System", "Young,  old,  or immunocompromised pets are at higher risk.", "3. Direct Contact with Infected Animals", "Common in livestock (sheep,  cattle),  which can spread it to dogs/cats."], "Treatment Protocol": ["1. Antibiotics (Critical for Survival)", "Ampicillin or Penicillin (first-line treatment)", "Trimethoprim-Sulfa or Enrofloxacin (alternatives)", "Long-term therapy (3-6 weeks) may be needed for CNS infections.", "2. Supportive Care", "IV Fluids (for dehydration)", "Anti-seizure Meds (e.g., diazepam if tremors/seizures occur)", "Steroids (for severe brain inflammation)", "3. Isolation & Hygiene", "Highly contagious to other pets/humans—strict hygiene needed."], "Prevention Methods": ["1. Avoid High-Risk Foods", "No raw meat or unpasteurized dairy for pets.", "Properly store pet food (avoid moldy/rotten food).", "2. Good Hygiene Practices", "Wash hands after handling raw meat.", "Disinfect bowls & surfaces regularly.", "3. Protect Livestock & Farm Animals", "Avoid feeding spoiled silage to cattle/sheep (common source).", "4. High-Risk Pets", "Immunocompromised pets should not eat raw diets."], "Standard Prescription": ["1. Inj. Strepto- P- 0.1ml/Kg, Twice Daily- 15-20 Days.", "2. Inj. Nervin/ Neurobion-  0.2ml/ IM/ Daily - 15-20 Days", "3. Inj. Roxadex- 1ml/ 10- 40 kg (0.1-0.025ml/kg) Once daily, 2-3 days.", "4. Inj. Barbit - Inj. 1ml ample: 1ml@10-13 kgs, 0.1ml/Kg,  Syp. 1ml @ 0.2 – 0.25kg", "5. Inj. Hartsol - 20-40ml/ Kg, IV, Twice Daily."], "Last Updated": "7/27/2025", "_id": 65}, {"Name": "Metritis (Cat: 3Kgs)", "Type": "Bacterial", "Animal": "Pet and Companion Animals", "Severity": "Fatal", "Contagion": "⚠️ Contagious", "Symptoms": ["Foul-smelling vaginal discharge.", "Fever and lethargy.", "Decreased appetite.", "Swollen abdomen.", "Vomiting.", "Depression or dehydration (especially after parturition).", "Decreased milk production (if nursing)", "Abdominal pain or swelling", "Depression/weakness"], "Causes": ["1. Bacterial Infections", "E. coli,  Streptococcus,  Staphylococcus,  Trueperella pyogenes.", "2. Retained Fetus or Placenta", "Decomposing tissue allows bacterial growth.", "3. Poor Hygiene During Parturition", "Contaminated instruments or hands.", "4. Risk Factors", "Overbreeding,  uterine trauma,  or immunosuppression."], "Treatment Protocol": ["Antibiotics (broad-spectrum, then culture-guided)", "Oxytocin or prostaglandins (help expel retained material)", "Fluid therapy (for dehydration/sepsis)", "Pain relief & anti-inflammatories", "Emergency spay (Ovariohysterectomy) if severe/unresponsive", "Hospitalization for critical cases (IV fluids, monitoring)"], "Prevention Methods": ["✅ Timely assistance during whelping or calving.", "✅ Remove retained placenta/fetuses promptly.", "✅ Keep birthing areas sterile.", "✅ Avoid overbreeding or breeding unhealthy females.", "✅ Monitor post-partum discharge.", "✅ Routine post-partum check-ups.", "Consider elective spaying if not breeding.", "Ensure clean birthing environment", "Monitor for retained placentas (normally passed within 24 hours)", "Seek vet help for prolonged labor (>4 hours between pups/kittens)"], "Standard Prescription": ["Cat- 3kg", "1. Inj. Streptopen-2.5gm", "0.30ml, Intra Muscularly, Twice Daily daily - 5-7 Days.", "2.Inj. Prostenol – 2ml", "0.25ml, Intra Muscularly, Twice, for 7days Intervals.", "3. Inj. Dexavet-10ml", "0.3ml, IM, Once Daily for 3 days", "4.Inj. Metharspan/ Oxcin (if Pus come out and Cervix Open)", "0.25ml, Intra Muscularly, Once daily for 5days.", "5. Inj. Normasol – 1000ml", "70ml, IV/SC three hourly, if improve then increase interval."], "Last Updated": "7/19/2025", "_id": 66}, {"Name": "Mouth Ulcers (Cat:3 kgs)", "Type": "Common", "Animal": "Pet and Companion Animals", "Severity": "Moderate", "Contagion": "✅ Non-Contagious", "Symptoms": ["Drooling excessively (ptyalism)", "Bad breath (halitosis)", "Red, swollen, or bleeding gums", "Visible sores or white/yellow patches", "Difficulty eating or loss of appetite", "Pawing at the mouth", "Weight loss (if chronic)"], "Causes": ["Injury, Infection, Micronutrient deficiency", "1. Trauma & Irritation", "Chewing on sharp objects (bones, sticks, wires)", "Electric cord burns (puppies/kittens)", "Chemical burns (household cleaners, toxic plants)", "2. Infections", "Viral:", "Feline Calicivirus (cats)", "Feline Herpesvirus (FHV-1)", "Canine Distemper Virus (dogs)", "Bacterial:", "Periodontal disease (gingivitis, stomatitis)", "Opportunistic infections (due to weakened immunity)", "Fungal:", "Candidiasis (yeast overgrowth)", "3. Immune-Mediated & Autoimmune Diseases", "Eosinophilic Granuloma Complex (cats)", "Pemphigus (autoimmune blistering disease)", "Lupus Erythematosus", "4. Systemic Diseases", "Kidney failure (uremic stomatitis)", "Diabetes mellitus (secondary infections)", "Cancer (oral tumors, squamous cell carcinoma)", "5. Other Causes", "Allergies (food, environmental)", "Vitamin deficiencies (B vitamins, zinc)", "Chronic vomiting (stomach acid irritates mouth)"], "Treatment Protocol": ["1. Medical Treatment", "Antibiotics (for bacterial infections—clindamycin, amoxicillin-clavulanate)", "Antivirals (famciclovir for feline herpesvirus)", "Antifungals (fluconazole for candidiasis)", "Pain relief (meloxicam, buprenorphine)", "Steroids/Immunosuppressants (for autoimmune conditions—prednisolone, cyclosporine)", "2. Topical Therapy", "Chlorhexidine oral rinse (antiseptic)", "Honey or sucralfate gel (soothing & healing)", "Lidocaine gel (for pain relief—use cautiously)", "3. Supportive Care", "Soft or liquid diet (to reduce irritation)", "Fluid therapy (if dehydrated)", "Dental cleaning (if periodontal disease is present)", "4. Surgery (in Severe Cases)", "Tooth extraction (if severe stomatitis)", "Tumor removal (if cancer is diagnosed)"], "Prevention Methods": ["Dental hygiene, avoid irritants, treat infections, High-quality diet.", "Regular dental care (brushing, dental chews)", "Avoid hard chew toys/bones that can damage gums", "Vaccinate cats against calicivirus", "Monitor for systemic illnesses (kidney/diabetes screening)"], "Standard Prescription": ["Cat-3kg", "1. Gelora/Micoral/Oroconazol 2% Oral Gel – 3ml, Apply in mouth cavity, Twice daily.", "2. Syp. Cefixime – 100mg, 1.5 ml Twice Daily.", "3. Inj. MPain vet 0.5%- 0.2 ml sc once daily, if Fever Present, 2-3days maximum.", "4. Povin mouth wash – twice daily.", "5. Tab. Ribosin- 1 tablet, once daily 15 days."], "Last Updated": "7/19/2025", "_id": 67}, {"Name": "Neutering", "Type": "Skin Diseases", "Animal": "Pet and Companion Animals", "Severity": "Moderate", "Contagion": "✅ Non-Contagious", "Symptoms": "Mild redness,  swelling,  and bruising at the incision site,  which can be normal for the first few days. However,  signs of infection include a bad smell coming from the incision,  excessive redness,  swelling,  or bruising,  bleeding or pus,  and lethargy or refusal to eat for more than a couple of days.", "Causes": "Surgical Wound", "Treatment Protocol": ["1. Preoperative Preparation", "Patient Optimization: Control diabetes, improve nutrition (adequate protein & vitamins), and manage immunosuppression if possible.", "Skin Preparation: Use antiseptic solutions (chlorhexidine/alcohol-based) to reduce bacterial load.", "Antibiotic Prophylaxis: Administer preoperatively (if indicated) based on surgery type (e.g., contaminated wounds, prosthetic implants).", "2. Intraoperative Care", "Aseptic Technique: Sterile draping, gloves, and instruments to prevent contamination.", "Proper Closure Technique:", "Primary closure (clean wounds, sutures/staples).", "Delayed primary closure (contaminated wounds, closed after 3–5 days).", "Secondary intention (dirty wounds, left open to heal by granulation).", "Drain Placement (if needed): To prevent seroma/hematoma formation.", "3. Postoperative Wound Care", "Dressing Selection:", "Non-adherent dressings (e.g., silicone, hydrocolloid) for closed wounds.", "Antimicrobial dressings (e.g., silver, iodine) for high-risk wounds.", "Negative Pressure Wound Therapy (NPWT) for large/traumatic wounds.", "Wound Inspection:", "Monitor for signs of infection (redness, swelling, purulent discharge, fever).", "Assess for dehiscence (separation of wound edges) or hematoma/seroma.", "Pain Management: Adequate analgesia to promote mobility and healing.", "4. Infection Control & Complication Management", "Surgical Site Infection (SSI) Management:", "Superficial: Antibiotics (e.g., cephalexin) + wound care.", "Deep/organ-space: May require drainage + IV antibiotics (e.g., piperacillin-tazobactam).", "Dehiscence/Evisceration:", "Partial: Local wound care.", "Complete: May require reoperation.", "Necrosis/Ischemia: Debridement + revascularization if vascular compromise.", "5. Parents Education", "Hygiene: Keep wound clean/dry; avoid soaking (e.g., swimming).", "Activity Restrictions: Avoid heavy lifting/strenuous activity to prevent dehiscence.", "Follow-up: Schedule suture/staple removal (usually 7–14 days post-op)."], "Prevention Methods": "Managemental Sugery", "Standard Prescription": ["Cat: 3kgs.", "1. Inj. Acicef-4", "Sig. 0.16 ml, IM, Once Daily for 5 days.", "2. Inj. Phenadryl – 10", "Sig. 0.3ml, IM, Once Daily for 5 days.", "3. Tab. Amantril – 100mg", "1/6 Part feed Orally twice daily for 3 days.", "4. Inj. Sedil-10mg/2ml", "0.3 ml once/ twice daily for light sedation for one-two days.", "5. Inj. Aminovit Plus vte- 20ml", "0.5ml, Once/ twice daily for light sedation for one-two days.", "6. Inj. Acoson - 500mg", "0.25ml, IM, Once daily 5-7 days.", "7. Dressing with Viodin one daily."], "Last Updated": "7/28/2025", "_id": 68}, {"Name": "NSAID/SAID Poisoning", "Type": "Poisoning", "Animal": "Pet and Companion Animals", "Severity": "Severe", "Contagion": "✅ Non-Contagious", "Symptoms": ["Early Signs (Gastrointestinal & Neurological)", "Vomiting (sometimes with blood)", "Diarrhea (may be black/tarry from digested blood)", "Loss of appetite & lethargy", "Abdominal pain (whining,  hunched posture)", "Increased thirst & urination (kidney stress)", "Severe Poisoning (Kidney/Liver Failure,  Ulcers,  Neurological)", "Pale gums (anemia from bleeding ulcers)", "Jaundice (yellow gums/skin – liver damage)", "Seizures or coma (in extreme cases)", "Sudden collapse (due to internal bleeding or organ failure)"], "Causes": ["NSAID/SAID Ingestion or Accidental Exposure,  Overdose.", "✔ Accidental ingestion (e.g.,  pet eats owner’s medication).", "✔ Incorrect dosing & Selection.", "✔ Long-term use without monitoring (kidney/liver damage).", "✔ Cats given dog NSAIDs (even small amounts can be fatal).", "Acetamenophen/ Peracetamol Lethal to cat and also toxic to Dog.", "Ibuprofen (Advil,  Motrin) – Highly toxic,  even in small doses.", "Naproxen (Aleve) – Long-lasting,  higher risk of kidney damage.", "Aspirin (Acetylsalicylic Acid) – Can cause GI ulcers and bleeding.", "Carprofen (Rimadyl),  Meloxicam (Metacam),  Deracoxib (Deramaxx) – Veterinary NSAIDs that can be toxic if overdosed.", "SAIDs (Corticosteroids – Less Acute Toxicity but Risky with Long-Term Use)", "Prednisone/Prednisolone", "Dexamethasone", "Methylprednisolone"], "Treatment Protocol": ["1. Immediate Decontamination (If Recent Ingestion)", "Induce vomiting (only if within 1-2 hours and pet is conscious – use 3% hydrogen peroxide in dogs, never in cats unless directed by a vet).", "Activated charcoal (to bind remaining toxins).", "2. Veterinary Care (Critical for Survival)", "IV fluids (to protect kidneys and flush toxins).", "Gastroprotectants (e.g., omeprazole, sucralfate) for ulcers.", "Blood tests (check kidney/liver function, anemia).", "Blood transfusions (in severe bleeding cases).", "Antidotes? None for NSAIDs, but supportive care is vital.", "3. Long-Term Management", "Kidney/liver monitoring (if damage occurred).", "Diet change (low-protein if kidneys are affected)."], "Prevention Methods": ["Never Overdose NSAID/SAID.", "✔ Never give human NSAIDs (Peracetamol, ibuprofen, naproxen) to pets.", "✔ Use only vet-prescribed NSAIDs at correct doses.", "✔ Store medications securely (child-proof containers).", "✔ Avoid long-term NSAID use without vet supervision.", "✔ Cats should only get NSAIDs under strict veterinary guidance (many are unsafe)."], "Standard Prescription": ["1. Syp. Rox (Activated Charcol) – 300ml", "5ml/kg, 3 hourly up to complete disappear of signs.", "2. Inj. Normal Saline – 10-20 ml , IV/SC/ Kg Bwt.", "3. Syrup. Avolac - 100ml,", "1-2 TSP 6 hourly up to evacuation of stomach.", "4. Syp. Liv-52,", "1-2ml/kg Orally- Twice daily.", "5. SYp. Urokid -", "1-2ml/kg Orally- Twice daily."], "Last Updated": "7/29/2025", "_id": 69}, {"Name": "Orchitis (Cat: 3kgs)", "Type": "Bacterial", "Animal": "Pet and Companion Animals", "Severity": "Mild", "Contagion": "⚠️ Contagious", "Symptoms": ["Swollen,  firm,  or painful testicles", "Redness or warmth in the scrotal area", "Lethargy or fever", "Reluctance to walk or sit (due to discomfort)", "Excessive licking of the genital area", "Infertility (if chronic)", "Systemic signs (e.g.,  vomiting,  loss of appetite in severe cases)"], "Causes": ["1. Bacterial Infection", "Secondary to urinary tract or prostate infections.", "Brucella canis (zoonotic and important).", "2. Trauma: Injury or bites to scrotum.", "3. Autoimmune Reaction: In some chronic cases.", "4. Other Causes", "Extension from epididymitis or testicular torsion."], "Treatment Protocol": ["Antibiotics – If bacterial infection is confirmed (e.g., doxycycline for Brucellosis).", "Pain Management – NSAIDs (e.g., meloxicam) or opioids for severe pain.", "Anti-inflammatory Drugs – Corticosteroids if autoimmune-related.", "Cold Compresses – To reduce swelling (if trauma-induced).", "Surgery (Orchiectomy) – Recommended in severe, chronic, or recurrent cases (especially if abscesses or tumors are present).", "Supportive Care – Rest, hydration, and an Elizabethan collar to prevent licking."], "Prevention Methods": ["✅ Neuter males not used for breeding.", "✅ Prevent fights or trauma to the genital area.", "✅ Practice good hygiene during breeding.", "✅ Routine health checks, especially for breeders.", "✅ Isolate from infected animals (e.g., Brucella spp.)."], "Standard Prescription": ["Cat- 3kg", "1. Inj. Streptopen-2.5gm", "0.30ml, Intra Muscularly, Once daily.", "2. Syrup. Urokit Plus", "3 ml, Twice daily for 15 Days.", "3. Inj. Mel vet- 0.5%", "0.25 ml, Intra Muscularly, Twice Daily (stop if no blood in urine)"], "Last Updated": "7/19/2025", "_id": 70}, {"Name": "Organophosphorus Poisoning", "Type": "Poisoning", "Animal": "Pet and Companion Animals", "Severity": "Severe", "Contagion": "✅ Non-Contagious", "Symptoms": ["Symptoms typically appear within minutes to hours of exposure and can include:", "Muscarinic Effects (SLUDGE Syndrome)", "Salivation", "Lacrimation (excessive tearing)", "Urination", "Diarrhea", "Gastrointestinal hypermotility (vomiting,  abdominal pain)", "Emesis (vomiting)", "Bronchoconstriction (respiratory distress,  wheezing)", "Miosis (pinpoint pupils)", "Nicotinic Effects", "Muscle tremors,  twitching,  weakness", "Ataxia (loss of coordination)", "Paralysis (in severe cases)", "Central Nervous System Effects", "Anxiety,  restlessness", "Seizures", "Depression,  coma"], "Causes": ["Insecticides (e.g.,  flea treatments,  lawn chemicals)", "Rodenticides (some contain OP compounds)", "Agricultural pesticides (malathion,  diazinon,  chlorpyrifos)", "Contaminated food or water.", "Predation of rudents exposed with rodenticde is most common way of exposure."], "Treatment Protocol": ["1. Decontamination", "Dermal exposure: Bathe the cat with mild dish soap and water.", "Ocular exposure: Flush eyes with saline or water for 15 minutes.", "Ingestion:", "Induce vomiting (only if recent ingestion and cat is asymptomatic) using 3% hydrogen peroxide (1-2 mL/kg, max 45 mL).", "Activated charcoal (1-2 g/kg) if no vomiting is induced.", "2. Antidotes", "Atropine sulfate (0.2–0.5 mg/kg, IV/IM/SC, repeat as needed) – blocks muscarinic effects.", "Pralidoxime (2-PAM) (20 mg/kg IM or slow IV, repeat in 8-12 hrs if needed) – reactivates AChE (most effective if given early).", "3. Supportive Care", "IV fluids (for hydration and shock).", "Anti-seizure medications (diazepam, midazolam) if needed.", "Oxygen therapy if respiratory distress occurs.", "Temperature control (hyperthermia or hypothermia may occur)."], "Prevention Methods": ["Secure pesticides, proper storage,", "Keep pesticides, rodenticides, and flea products out of reach.", "Use cat-safe flea treatments (avoid dog-specific products).", "Wash off any chemical residues if exposure is suspected.", "If you suspect organophosphate poisoning, seek immediate veterinary care as it is a life-threatening emergency!"], "Standard Prescription": ["1. Inj. Atrovet/ Tropin vet @1mg/1ml,", "Rabbits/Rodents/Small Mammals (0.04 –2 mg/kg)- 1ml/ 0.5-25kgs (IV, SC, IM)", "Dog/Cat (0.2–2 mg/kg) - 1ml/ 0.5-5 kgs (IV, SC, IM)", "2. Syp. Rox (Activated Charcol) – 300ml", "5ml/kg, 3 hourly up to complete disappear of signs.", "3. Normal Saline – 10-20 ml , IV/SC/ Kg Bwt."], "Last Updated": "7/29/2025", "_id": 71}, {"Name": "Osteomalacia", "Type": "Nutritional", "Animal": "Pet and Companion Animals", "Severity": "Moderate", "Contagion": "✅ Non-Contagious", "Symptoms": ["Lameness (shifting leg lameness,  stiffness).", "Bone pain (whining when touched,  reluctance to move).", "Pathological fractures (bones break easily).", "Muscle weakness (difficulty standing,  \"\"bunny-hopping\"\" gait).", "Bone deformities (bowing of long bones,  swollen joints).", "Dental problems (loose teeth,  enamel defects)."], "Causes": ["Calcium/Vitamin D deficiency", "Poor mineral absorption", "Imbalanced calcium:phosphorus ratio"], "Treatment Protocol": ["Dietary Correction", "Switch to a balanced commercial diet (prescription renal diets for CKD cases).", "Vitamin D supplementation (only under veterinary guidance).", "Calcium & Phosphorus Supplementation", "Correct imbalances (oral calcium carbonate or calcium gluconate if deficient).", "Pain Management", "NSAIDs (e.g., Meloxicam) for pain and inflammation (only if no kidney issues).", "Physical Therapy & Rest", "Controlled exercise to prevent fractures.", "Treat Underlying Conditions", "Kidney disease management (phosphate binders, fluid therapy).", "Address malabsorption issues (enzyme supplements, probiotics)."], "Prevention Methods": ["Ensure proper calcium and vitamin D intake", "Avoid feeding only meat", "Provide sunlight (for dogs)"], "Standard Prescription": ["1. Tab D Rise- 1000 IU .", "1/10 part of tablet - 1-2kg, 3-7 days intervals for 1-2months.", "2. Tablet CALFOS PET,", "1 Tab/ 10kg body weight daily for 1 month."], "Last Updated": "7/23/2025", "_id": 72}, {"Name": "Otitis Externa/ Media", "Type": "Ear Infections", "Animal": "Pet and Companion Animals", "Severity": "Moderate", "Contagion": "⚠️ Contagious", "Symptoms": ["Symptoms include ear pain (especially with touching or wiggling the ear),  itching,  redness or swelling of the outer ear or ear canal,  drainage,  feeling of fullness or plugged ears,  and muffled hearing.", "Often occurs due to a cold,  flu,  or other respiratory infection that causes the Eustachian tube to swell and trap fluid in the middle ear. Common bacteria include Streptococcus pneumoniae and Haemophilus influenzae,  while viruses like those that cause colds can also be responsible."], "Causes": "Bacteria (like Pseudomonas aeruginosa and Staphylococcus aureus) or fungi (like Candida and Aspergillus) can infect the ear canal,  often after exposure to water. Other causes include injury to the ear canal from cleaning with cotton swabs or other objects,  or skin conditions like eczema.", "Treatment Protocol": ["Ear drops (antibiotics or antifungals), pain relievers", "Antibiotics, decongestants, ear cleaning."], "Prevention Methods": "Keeping the ear canal dry after swimming or showering, avoiding putting objects in the ear, and using earplugs or a swimming cap when swimming can help prevent Otitis Externa.", "Standard Prescription": ["Cat: 3 kg", "1. OTI Ear Cleaner- Apply in Ear and Clean ear with soft gauze/  cotton Bud.", "2. Ear Drop – Moxidex 3/4drops thrice daily, 5-7 Days.", "3. Syp. Cefixime – 100mg, 1.25 ml twice daily, 5-7 Days.", "4. Inj. Mel vet 0.5%- 0.2 ml sc once daily- 1-2 Days, 5-7 Days.", "5. Syp. Alatrol – 2.5ml (1/2tsp) once daily, 5-7 Days.", "6. Inj. Parasitin- 0.05ml per kg, 7 Days Apart."], "Last Updated": "7/18/2025", "_id": 73}, {"Name": "Paracetamol/Acetaminophen Poisoning", "Type": "Poisoning", "Animal": "Pet and Companion Animals", "Severity": "Severe", "Contagion": "✅ Non-Contagious", "Symptoms": ["Early signs (1-4 hours after ingestion):", "Vomiting,  drooling,  lethargy,  abdominal pain.", "Pale or muddy brown gums (due to methemoglobinemia).", "Later signs (24-48 hours):", "Jaundice (yellow gums,  eyes).", "Difficulty breathing (due to lack of oxygen).", "Facial/paw swelling (especially in cats).", "Liver failure,  seizures,  coma,  death."], "Causes": ["The potentially lethal dose for cats is 10mg/kg; as little as a quarter of a regular acetaminophen tablet (50 mg) can be deadly.", "Dogs: Toxic dose is ≥100 mg/kg,  but lower doses can still cause harm.", "- Common sources of poisoning:", "- Accidental ingestion of human medications (tablets,  syrups).", "- Owners administering paracetamol without veterinary guidance.", "- Exposure to combination drugs (e.g.,  paracetamol + caffeine or codeine).", "Mechanism of Toxicity:", "Depletes glutathione in the liver,  leading to oxidative damage.", "Forms methemoglobinemia (reduces oxygen-carrying capacity of blood).", "Causes hepatic necrosis (liver failure)."], "Treatment Protocol": ["1. Immediate Decontamination", "Induce vomiting (if ingestion was within 1-2 hours) using hydrogen peroxide (dogs only) or apomorphine (under vet supervision).", "Activated charcoal (if no vomiting, to prevent absorption).", "2. Antidote Therapy", "N-acetylcysteine (NAC, Mucomyst®) – Replenishes glutathione.", "Dose: 140 mg/kg IV initially, then 70 mg/kg every 6-8 hours.", "S-adenosylmethionine (SAMe) or silymarin (milk thistle) for liver support.", "3. Supportive Care", "IV fluids (to maintain hydration and kidney function).", "Oxygen therapy (if methemoglobinemia is severe).", "Blood transfusions (in severe anemia cases).", "Vitamin C (reduces methemoglobin levels).", "4. Monitoring", "Liver enzymes (ALT, AST), bilirubin, methemoglobin levels.", "Blood oxygen levels (pulse oximetry)."], "Prevention Methods": ["✔ Never give paracetamol to pets unless prescribed by a vet.", "✔ Store medications securely (out of reach of pets).", "✔ Educate pet owners about the dangers of human medications.", "✔ Use pet-safe alternatives for pain/fever (e.g., vet-prescribed NSAIDs)."], "Standard Prescription": ["1. Tab. Tylace/ Mucomist DT  - 600mg", "1/4 Tablet/ Kg- Loading Dose,", "1/8 Tablet/ kg, 6-8 hours intervals upto recovery.", "2. Capsule Silybin - 70mg", "1 Capsule Twice daily for 7 days.", "3. Inj. Ascoson- 5ml", "0.2ml, IM, Twice Daily for 7 days.", "4. Inj. Hartsol - 20-40 ml/kg/ IV Twice- Thrice daily for 3 Days.", "5. Syp. Rox (Activated Charcol) – 300ml", "5ml/kg, 3 hourly up to complete disappear of signs.", "6. Syrup. Avolac - 100ml", "1-2 TSP 6 hourly up to evacuation of stomach.", "7. Citrus Fruits Juice ad libitum."], "Last Updated": "7/29/2025", "_id": 74}, {"Name": "Phimosis/Paraphimosis (Cat: 3 Kgs)", "Type": "Rare", "Animal": "Pet and Companion Animals", "Severity": "Mild", "Contagion": "✅ Non-Contagious", "Symptoms": ["Phimosis: Inability to protrude the penis from the prepuce.", "Paraphimosis: Inability to retract the penis back into the sheath.", "Swelling of the penile region.", "Pain or licking at the genital area.", "Discoloration of the penis (red, purple, or black in severe paraphimosis).", "⚠️ Emergency: Paraphimosis can result in tissue death if not treated urgently.", "Urine dribbling or spraying due to obstruction.", "Secondary infections (balanoposthitis – inflammation of penis/prepuce)."], "Causes": ["1. Congenital Defects", "Narrow preputial opening (phimosis), most common in pets.", "2. Trauma or Inflammation", "Swelling or injury to the penis or prepuce. Scarring from trauma, infection, or inflammation.", "3. Tumors or Foreign Bodies", "Masses or hair trapping.", "4. Mating Injuries or Overexcitement", "Especially in paraphimosis cases.", "5. Preputial stenosis (narrowing)."], "Treatment Protocol": ["Immediate action: Lubricate and gently compress the penis to reduce swelling, then attempt manual replacement.", "Cold compresses to reduce edema.", "Sedation or anesthesia may be needed for severe cases.", "Surgery: If manual reduction fails, a ventral slit or circumcision may be required.", "Amputation: In extreme cases of necrosis."], "Prevention Methods": ["✅ Neuter pets not intended for breeding.", "✅ Regular genital inspection and hygiene.", "✅ Avoid trauma during mating or play.", "✅ Keep hair around the sheath trimmed.", "✅ Immediate veterinary care if swelling or entrapment occurs."], "Standard Prescription": ["Cat- 3kg", "1. Inj. Streptopen-2.5gm", "0.30ml, Intra Muscularly, Twice Daily daily - 5-7 Days.", "2. Ointment. Neocin", "Apply Locally Twice daily after Normal saline + Viodin wash."], "Last Updated": "7/19/2025", "_id": 75}, {"Name": "Pneumonia", "Type": "Respiratory Disorder", "Animal": "Pet and Companion Animals", "Severity": "Severe", "Contagion": "⚠️ Contagious", "Symptoms": ["Coughing (moist, productive)", "Fever (infectious cases)", "Labored breathing (rapid, shallow breaths)", "Nasal discharge (yellow/green if bacterial)", "Lethargy & loss of appetite", "Crackling lung sounds (heard with a stethoscope)"], "Causes": ["Infectious:", "Bacterial (Bordetella, Streptococcus, E. coli, Mycoplasma)", "Viral (Canine distemper, feline calicivirus, influenza)", "Fungal (Aspergillus, Blastomyces, Histoplasma) – more common in dogs", "Parasitic (Lungworms – Aelurostrongylus in cats, Capillaria in dogs)", "Non-Infectious:", "Aspiration (vomiting, regurgitation, improper feeding)", "Inhaled irritants (spicy, dust, smoke, chemicals)", "Immune-mediated (eosinophilic pneumonia)"], "Treatment Protocol": "1. Antibiotics (if bacterial) Doxycycline (first-line for Mycoplasma, Bordetella) Clavamox (amoxicillin-clavulanate) (broad-spectrum) Cefalosporins for acute cases. Streptomicin Penicillin Chronic Cases. Fluoroquinolones (enrofloxacin) for severe cases  2. Supportive Care Oxygen therapy (if severe hypoxia) Nebulization & coupage (to loosen mucus) IV fluids (for hydration) Anti-inflammatories (prednisone if immune-mediated)  3. Fungal/Antiparasitic Treatment (if needed) Itraconazole/fluconazole (for fungal pneumonia) Fenbendazole (for lungworms)", "Prevention Methods": "Vaccinate (kennel cough for dogs, respiratory viruses for cats) Avoid smoke/chemical irritants Control parasites (regular deworming) Manage allergies/asthma (reduce triggers) Avoid Extreme Cold/ Heat, Stress. Reduce dust & ammonia in housing, proper ventilation, vaccination", "Standard Prescription": ["1.     Inj. Acicef 3/ Bovixon – 0.1ml/kg, IM, Twice daily. or Streptomycin- Penicillin (1ml/10kgs) or Tylo  PC Gold (1ml/10kgs)", "1.     Inj. Histavet-  0.1 ml/kg, IM, Twice daily.", "2.    Tab. Mkast 4mg – 1 Tab/5kg bwt once daily.", "3.    Syp. Tofen – 1ml/kg once daily, Fed Orally", "4.   Brodil/ Pulmo Care Inhaler – Apply at nasal opening 3-4 times daily (1 Pressure)", "5.    Nebulization -  Bodicort + Windel Plus + NS (If severe).", "6.  High Flow Oxygen Therapy if Condition Critical.", "Keep Wormth, Avoid Humidity & Congested air.", "Improve Ventillation, SUnlight Exposure."], "Last Updated": "7/17/2025", "_id": 76}, {"Name": "Pyoderma", "Type": "Skin Diseases", "Animal": "Pet and Companion Animals", "Severity": "Moderate", "Contagion": "⚠️ Contagious", "Symptoms": ["Surface Pyoderma", "- Affects the top skin layer (e.g., hot spots).", "Superficial Pyoderma", "- Involves the epidermis and hair follicles (e.g., folliculitis).", "Deep Pyoderma", "- Penetrates deeper layers, causing boils, abscesses, or cellulitis (more severe).", "- Pustules (pus-filled bumps)", "- Red, inflamed skin", "- Hair loss (patchy or widespread)", "- Crusts, scabs, or scaling", "- Itching & discomfort", "- Foul odor (if secondary yeast infection)", "- Oozing or ulcerations (in deep pyoderma)"], "Causes": ["Staphylococcal and other pus forming bacterial Infections or secondary infection of fresh wound caused by-", "- Allergic Dermatitis", "- Flea Allergy Dermatitis (FAD): Hypersensitivity to flea saliva.", "- Atopic Dermatitis: Environmental allergies (pollen, dust mites, mold).", "- Food Allergies: Reactions to certain proteins (e.g., beef, chicken, dairy).", "- Parasitic Dermatitis", "- Fleas, mites (e.g., Sarcoptes, Demodex), or ticks.", "- Bacterial or Fungal Infections", "- Pyoderma (bacterial infection, often secondary to allergies).", "- Malassezia dermatitis (yeast infection).", "- Contact Dermatitis", "- Irritants like chemicals, shampoos, or plants.", "- Autoimmune or Hormonal Causes", "- Hypothyroidism, Cushing’s disease, or pemphigus."], "Treatment Protocol": "Hot Spots/ wound – dressing with Tin Iodine / CuSo4 (2-5%) (if Fungal infection suspected)/ Sodi carb (for removal of crust or foreign contaminants/ Xentian Violet/Hexisol/ H2O2. Antihistamin/+ NSAID / Steroids (single dose, never overdose) Ivermectin – to prevent & control ectoparasitic infestation (repeat after 7-14 days, strictly maintain proper dose & route) Antibiotics – Locally and Parentally if Pyoderma present and localized/ systemic involvement. Drugs of Choice: Penicillin/Ampicillin/Amoxicillin/amoxicillin-clavulanate/ Cephalosporins  Anti fungal (if fungal infection suspected)– Systemic/ Local", "Prevention Methods": "Switching to a low-allergen food such as lamb and Rice may be the key to relieving your Pet’s itchy skin. Avoid Milk, Meat Products.  Ventilation, Humidity, cleaning & Disinfection of Kennel, Bedding Materials, Utensils and Dry Floor. Isolation & Quarantine.  Sunlight exposure daily for hours.", "Standard Prescription": ["Pyoderma/ Myiasis, Cat, 3kgs", "1. Inj. M Pain Vet 0.5% - 0.15ml, SC, Once daily", "2. Inj. Streptopen – 2.5gm- 0.5ml, IM, Twice Daily", "3. Inj. Phenadryl – 0.5 ml, IM, Once daily", "4. Oint. Neobacrin/Dermasol N/ Pow. Neocin apply Locally Twice daily.", "5. Inj. Parasitin/ Acimec 1% - 0.15ml SC 5 days intervals/ Tab Ivera/Alice (6mg)- 0.3 part", "5. Dressing twice daily –", "H2O2 – 1st One/Two Days, Povin – Twice daily- 3-5days, Then Once daily.", "Fly Repellent – Oil of Turpentine/Ectonil(1.5gm/liter water) Spray/Nephthalin- hanging in kennel"], "Last Updated": "7/15/2025", "_id": 77}, {"Name": "Pyometra", "Type": "Reproductive Disorder", "Animal": "Pet and Companion Animals", "Severity": "Severe", "Contagion": "⚠️ Contagious", "Symptoms": ["Open Pyometra", "Vaginal discharge (pus or bloody fluid)", "Lethargy", "Increased thirst and urination (due to kidney stress)", "Fever (sometimes)", "Closed Pyometra (More Dangerous)", "Swollen abdomen", "Severe lethargy", "Loss of appetite", "Vomiting", "Rapid deterioration (can lead to sepsis, kidney failure, or death)"], "Causes": ["The main causes include:", "Hormonal Influence: Repeated exposure to progesterone (after heat cycles) thickens the uterine lining and promotes bacterial growth.", "Bacterial Infection: Escherichia coli (E. coli) is the most common bacteria involved.", "Age & Reproductive Status: Common in middle-aged to older unspayed females, but can occur in younger pets.", "Hormonal Treatments: Use of progesterone-based drugs (e.g., for preventing estrus) increases risk."], "Treatment Protocol": ["Emergency Veterinary Care Required!", "Surgery (Ovariohysterectomy - Spay):", "The most effective and definitive treatment.", "Removes the infected uterus and ovaries.", "High success rate if done before sepsis develops.", "Medical Management (Rarely Used & High Risk):", "Prostaglandin injections + antibiotics (for breeding animals).", "High risk of recurrence and complications.", "Only considered in early cases with an open cervix.", "Supportive Care:", "IV fluids, antibiotics, pain management."], "Prevention Methods": ["Spaying (Ovariohysterectomy):", "The best prevention—removes the uterus and ovaries, eliminating risk.", "Recommended before the first heat cycle (around 6 months).", "Avoid Hormonal Drugs:", "Progesterone-based medications increase risk.", "Monitor Unspayed Females:", "Watch for signs after heat cycles (usually 4-8 weeks post-estrus).", "Early Veterinary Check-ups:", "If pyometra is suspected, seek immediate care—delayed treatment can be fatal."], "Standard Prescription": ["1. Inj. Prostenol – 2ml", "0.25ml, Intra Muscularly, Twice, for 7days Intervals.", "After opening of uterine cervix and Oozing start-", "2. Inj. Metharspan", "0.25ml, Intra Muscularly, Once daily for 5days.", "3. Inj. Acicef-3/Bovixon-", "4. Syp. ES Plus- 100ml, 1ml/ cat, Fed Orally Once daily for 1 months.", "3.  Inj. HS - 20-40ml/ IV/ Twice daily - 5-7 days."], "Last Updated": "9/19/2025", "_id": 78}, {"Name": "Rabies (Bite Management)-3kgs", "Type": "Viral", "Animal": "Pet and Companion Animals", "Severity": "Moderate", "Contagion": "⚠️ Contagious", "Symptoms": ["Common symptoms of scratch or bite injuries in dogs and cats include:", "Bleeding: Small or large amount of blood depending on the injury.", "Swelling or reddening: Around the wound area.", "Pain or sensitivity: Pets may avoid touching the area, vocalize, or show signs of discomfort.", "Licking or biting at the injury: To soothe or remove the source of irritation.", "Open wound or puncture: Visible scratches, bites, or puncture marks.", "Pus or discharge: Signs of infection, especially if the wound is dirty or left untreated.", "Lameness or reluctance to move: If the injury affects a limb.", "Lethargy or weakness: Possible signs of infection or systemic illness.", "Behavior changes: Aggression, hiding, or increased irritability.", "Fever: Sometimes occurs if infection spreads."], "Causes": "Rabies (Bite Management)", "Treatment Protocol": ["Bite Management, wound management", "category-I: Touching or Feeding Animals, Licks on intact skin, no scratch/ injury to skin will treat with soap and water only.", "Category-II: Minor Scratch or Abrasions without bleeding will treat with soap wash, wound management, Anti Rabies Vaccine as soon as first Visit.", "Category- III: Single or Multiple Transdermal bites or scratches with active bleeding, licks or broken skin, contamination of mucous membrane with saliva, exposure to Bat will treat with -", "Wound mamnget, Anti rabies vaccine, Rabies Immunoglobulin, Anti Tetanus (Toxoid)."], "Prevention Methods": ["Vaccination, Prevention of exposure, Post-exposure prophylaxis.", "Washing the affected area with soap and running water for 15 minutes, followed by drying and applying a sterile dressing. Rabies prophylaxis follow up for wound care and potential complications. Antibiotics and tetanus booster may be needed., Vaccination, Wound management"], "Standard Prescription": ["Bite wound (same or other spp), 3kgs", "1. Inj. M Pain Vet 0.5% - 0.15ml, SC, Once daily", "2. Inj. Streptopen – 2.5gm- 0.5ml, IM, Twice Daily", "3. Inj. Phenadryl – 0.5 ml, IM, Once daily", "4. Oint. Neobacrin/Dermasol N/ Pow. Neocin apply Locally Twice daily.", "5. Inj. Parasitin/ Acimec 1% - 0.15ml SC 5 days intervals/ Tab Ivera/Alice (6mg)- 0.3 part.", "6. Vaccination – Rabies – 1st, 7th, 21 days. Tetanus – (ATS+ Ig) –single dose.", "7. Dressing twice daily – H2O2 – 1st One/Two Days, Povin – Twice daily- 3-5days, Then Once daily.", "8. Spray Frontline – Once Daily or Ectonil(1.5gm/liter water) Spray."], "Last Updated": "7/18/2025", "_id": 79}, {"Name": "Rectal Prolapse", "Type": "Metabolic", "Animal": "Pet and Companion Animals", "Severity": "Severe", "Contagion": "✅ Non-Contagious", "Symptoms": ["Protruding pink/red tubular tissue from the anus", "Straining to defecate (tenesmus)", "Licking or scooting at the area", "Bleeding or swelling around the anus", "Pain or distress"], "Causes": ["Severe diarrhea or constipation (straining increases pressure)", "Intestinal parasites (e.g.,  worms)", "Rectal or anal tumors", "Prostatic disease (in male dogs)", "Dystocia (difficult birth) in females", "Bladder stones or urinary obstruction (causing straining)", "Chronic colitis or inflammatory bowel disease (IBD)", "Congenital weakness (more common in young animals)"], "Treatment Protocol": ["1. Minor or Acute Prolapse", "Manual reduction (pushing the tissue back in place under sedation).", "Sucrose or hypertonic solution to reduce swelling before replacement.", "Purse-string suture (temporary stitch to keep the anus closed for a few days).", "2. Severe or Chronic Prolapse", "Surgical resection (if tissue is necrotic or cannot be reduced).", "Colopexy (surgically attaching the colon to the abdominal wall to prevent recurrence).", "3. Treat Underlying Cause", "Deworming (if parasites are the cause).", "Dietary management (high-fiber food for constipation).", "Pain relief and anti-inflammatories."], "Prevention Methods": ["Supply plenty of water and soft food.", "Regular deworming.", "Prompt treatment of diarrhea/constipation.", "Avoid excessive straining (manage urinary issues, provide proper diet).", "Avoid dry food."], "Standard Prescription": ["1. Syp. Avolac, 1 Tsp Twice Daily", "2. Glysup 1.15gm – suppository 12 hourly, repeat if need.", "3. Isabgul husk with food & water.", "4. Syp. Sel E - 1ml, once daily for 15 days", "5. Tab. Calorate  - 1/10 once daily for 10 days."], "Last Updated": "7/19/2025", "_id": 80}, {"Name": "Retained Placenta (Cat: 3 kgs)", "Type": "Common", "Animal": "Pet and Companion Animals", "Severity": "Severe", "Contagion": "⚠️ Contagious", "Symptoms": ["Persistent vulvar discharge after parturition.", "Foul-smelling odor from the discharge.", "Fever and lethargy.", "Loss of appetite.", "Swollen abdomen.", "Delayed or incomplete uterine involution."], "Causes": ["1. Dystocia or Difficult Birth", "Incomplete expulsion of fetal membranes.", "2. Uterine Atony", "Poor uterine contractions post-delivery.", "3. Hormonal Imbalance", "Insufficient oxytocin or prostaglandin release.", "4. Infection or Nutritional Deficiencies", "Hypocalcemia,  vitamin E or selenium deficiency.", "Secondary bacterial infections."], "Treatment Protocol": ["1. Medical Management", "Oxytocin Injection (0.25–2 IU/kg in dogs, 0.5–2 IU in cats) – Stimulates uterine contractions.", "Prostaglandins (PGF2α) – Helps expel retained tissue.", "Antibiotics (e.g., Clavamox, Enrofloxacin) – Prevent/treat infection.", "2. Manual Removal (Veterinary Procedure)", "A veterinarian may manually remove placental remnants under sedation.", "Never attempt this at home—can cause severe trauma or infection.", "3. Surgical Intervention (Hysterectomy)", "If infection is severe (pyometra/sepsis), emergency spaying may be needed."], "Prevention Methods": ["✅ Ensure complete fetal membrane expulsion post-birth.", "✅ Veterinary attendance during and after delivery.", "✅ Avoid excessive breeding of high-risk animals.", "✅ Adequate nutrition (calcium, vitamin E, selenium).", "✅ Monitor post-partum for fever, discharge."], "Standard Prescription": ["Cat- 3kg", "1. Inj. Streptopen-2.5gm", "0.30ml, Intra Muscularly, Twice Daily daily - 5-7 Days.", "2.Inj. Prostenol – 2ml", "0.25ml, Intra Muscularly, Twice, for 7days Intervals.", "3. Inj. Dexavet-10ml", "0.3ml, IM, Once Daily for 3 days", "4.Inj. Metharspan/ Oxcin (if Pus come out and Cervix Open)", "0.25ml, Intra Muscularly, Once daily for 5days.", "5. Inj. Normasol – 1000ml", "70ml, IV/SC three hourly, if improve then increase interval.", "6.  Powder. PA Cal-Meat", "50gm Daily for one Months."], "Last Updated": "7/19/2025", "_id": 81}, {"Name": "Rickets", "Type": "Nutritional", "Animal": "Pet and Companion Animals", "Severity": "Moderate", "Contagion": "✅ Non-Contagious", "Symptoms": ["Bone deformities (bowed legs,  swollen joints,  curved spine)", "Lameness or difficulty walking", "Delayed growth (smaller size than littermates)", "Pain when moving or touching limbs", "Fractures from minor trauma (weak bones)", "Muscle weakness or tremors", "Dental problems (soft teeth,  delayed eruption)"], "Causes": ["Vitamin D or calcium deficiency", "Poor-quality or imbalanced diet during growth", "Lack of sunlight (dogs)"], "Treatment Protocol": ["Diet correction: Switch to a balanced, vet-recommended diet with proper calcium, phosphorus, and vitamin D.", "Vitamin D injections or oral supplements (if deficiency is severe).", "Calcium and phosphorus supplements (as prescribed by a vet).", "Pain management (anti-inflammatory medications if needed).", "Physical therapy (for severe deformities).", "Surgery (in extreme cases to correct bone deformities)."], "Prevention Methods": ["Balanced growth-stage diet", "Sunlight exposure", "Supplement vitamin D in deficient areas"], "Standard Prescription": ["1. Tab D Rise- 1000 IU .", "1/10 part of tablet - 1-2kg, 3-7 days intervals for 1-2months.", "2. Tablet CALFOS PET,", "1 Tab/ 10kg body weight daily for 1 month."], "Last Updated": "7/23/2025", "_id": 82}, {"Name": "Roundworm Infestation", "Type": "Parasitic Diseases", "Animal": "Pet and Companion Animals", "Severity": "Moderate", "Contagion": "⚠️ Contagious", "Symptoms": ["Pot-bellied appearance in young animals.", "Diarrhea or constipation.", "Vomiting (sometimes with worms).", "Dull coat and poor weight gain.", "Visible worms in feces or vomit.", "Coughing (due to lung migration).", "⚠️ Emergency Signs:", "Heavy infestation causing intestinal blockage.", "Severe dehydration and weakness in young animals."], "Causes": ["Parasitic infection,  contaminated environment,  transplacental/lactogenic transmission.", "Ingestion of Eggs", "Consuming soil,  feces,  or contaminated food/water.", "Transplacental or Transmammary", "Puppies/kittens infected from the mother during pregnancy or nursing.", "Predation", "Eating infected rodents or birds.", "Poor Sanitation", "Environments contaminated with feces containing roundworm eggs."], "Treatment Protocol": ["Deworming medications (e.g., pyrantel pamoate, fenbendazole, milbemycin).", "Repeat treatment (since larvae may not be killed in the first dose).", "Treat all pets in the household to prevent reinfection.", "Severe cases may require hospitalization for supportive care (fluids, nutrition)."], "Prevention Methods": ["Deworming, clean environment, hygiene.", "✅ Regular deworming as per vet guidelines.", "✅ Clean up feces promptly from yards and litter areas.", "✅ Avoid raw or undercooked meat.", "✅ Prevent pets from hunting rodents or birds.", "✅ Wash hands after handling pets or soil.", "✅ Deworm pregnant and nursing mothers.", "✅ Routine fecal exams to monitor parasite loads."], "Standard Prescription": ["1. Tab. Helminthicide L/ Kiwof-", "1Tab @4-10kg, repeat after 5-7 days.", "2. Syp. PA Zinc- 100ml, 3-5ml/ day- 1 month.", "3. Syp. D Iron (1ml @ 10kg)/ Dr. PetZ Iromin- 1/2 Tab @ <10kg, 1 Tab @>10kgs, 1 month."], "Last Updated": "7/28/2025", "_id": 83}, {"Name": "Runny Nose/ Rhinitis", "Type": "Respiratory Disorder", "Animal": "Pet and Companion Animals", "Severity": "Mild - Moderate", "Contagion": "✅ Non-Contagious", "Symptoms": "Watery Secretion from Nose,  Sneezing,  coughing,  watery eyes,  lethargy,  and loss of appetite", "Causes": ["Allergies – Pollen,  dust,  mold,  or food allergies can cause clear nasal discharge.", "Upper Respiratory Infections (URIs) –", "Viral (e.g.,  feline herpesvirus in cats,  canine distemper in dogs)", "Bacterial (e.g.,  Bordetella,  Chlamydia) → May cause thick,  colored discharge.", "Foreign Bodies – Grass,  seeds,  or small objects stuck in the nose.", "Dental Disease – Tooth root abscesses (especially in small dogs & cats) can lead to nasal discharge.", "Nasal Tumors or Polyps – More common in older pets; may cause bloody or persistent discharge.", "Fungal Infections (e.g.,  Aspergillosis in dogs) – Can cause chronic nasal issues.", "Environmental Irritants – Smoke,  perfumes,  or cleaning chemicals.", "Thick,  yellow/green discharge (sign of infection)", "Bloody discharge", "Sneezing,  coughing,  or eye discharge", "Loss of appetite or lethargy", "Nasal discharge only from one nostril (could indicate a foreign object or tumor)"], "Treatment Protocol": "1. Mild Cases (Clear Discharge, No Other Symptoms) Keep the nose clean – Wipe gently with a damp cloth.  Humidify the air – Use a humidifier to ease congestion.  Encourage hydration – Provide fresh water to thin mucus.  2. Infections (Yellow/Green Discharge, Fever, Lethargy) Antibiotics (if bacterial, e.g., Clavamox, Doxycycline) – Prescribed by a vet.  Antivirals (for feline herpesvirus, e.g., Lysine supplements).  Antifungals (for fungal infections like Aspergillosis).  3. Allergies (Clear Discharge, Sneezing, Itchy Eyes) Antihistamines (e.g., Benadryl – only under vet guidance).  Steroids (for severe inflammation, prescribed by a vet).  Remove allergens (dust, smoke, perfumes).  4. Foreign Objects (Sudden Sneezing, Pawing at Face) Vet removal (NEVER try to remove deep objects yourself).  5. Dental or Tumor-Related Issues Dental treatment (if caused by an abscess).  Biopsy/surgery (if tumors or polyps are suspected).", "Prevention Methods": "Vaccination, reduce dust, proper ventilation, abvoid cold.  ✔ Vaccinate regularly (e.g., Distemper, Bordetella for dogs; Herpes for cats). ✔ Avoid irritants (smoke, strong cleaners, perfumes). ✔ Control allergies (use air purifiers, hypoallergenic bedding). ✔ Regular vet check-ups (especially for senior pets). ✔ Keep foreign objects away (avoid small toys, grass awns).", "Standard Prescription": "No standard prescription defined", "Last Updated": "6/29/2025", "_id": 84}, {"Name": "Scratch/ Bite", "Type": "Skin Diseases", "Animal": "Pet and Companion Animals", "Severity": "Critical", "Contagion": "✅ Non-Contagious", "Symptoms": ["Common symptoms of scratch or bite injuries in dogs and cats include:", "- Bleeding: Small or large amount of blood depending on the injury.", "- Swelling or reddening: Around the wound area.", "- Pain or sensitivity: Pets may avoid touching the area, vocalize, or show signs of discomfort.", "- Licking or biting at the injury: To soothe or remove the source of irritation.", "- Open wound or puncture: Visible scratches, bites, or puncture marks.", "- Pus or discharge: Signs of infection, especially if the wound is dirty or left untreated.", "- Lameness or reluctance to move: If the injury affects a limb.", "- Lethargy or weakness: Possible signs of infection or systemic illness.", "- Behavior changes: Aggression, hiding, or increased irritability.", "- Fever: Sometimes occurs if infection spreads."], "Causes": ["Dog, Cat, Fox bite, Traumatic injury, Scratch, Bee sting.", "Lacerated Wound, Road Accident."], "Treatment Protocol": ["Wound Management,", "Bite Management category-I: Touching or Feeding Animals, Licks on intact skin, no scratch/ injury to skin will treat with soap and water only.", "Category-II: Minor Scratch or Abrasions without bleeding will treat with soap wash, wound management, Anti Rabies Vaccine as soon as first Visit.", "Category- III: Single or Multiple Transdermal bites or scratches with active bleeding, licks or broken skin, contamination of mucous membrane with saliva, exposure to Bat will treat with - Wound mamnget, Anti rabies vaccine, Rabies Immunoglobulin, Anti Tetanus (Toxoid)."], "Prevention Methods": "Avoid direct contact to Biting animals, never disturb or irritate them. Control & Restricted movement.", "Standard Prescription": ["Bite wound (same or other spp), 3kgs", "1. Inj. M Pain Vet 0.5% - 0.15ml, SC, Once daily", "2. Inj. Streptopen – 2.5gm- 0.5ml, IM, Twice Daily", "3. Inj. Phenadryl – 0.5 ml, IM, Once daily", "4. Oint. Neobacrin/Dermasol N/ Pow. Neocin apply Locally Twice daily.", "5. Inj. Parasitin/ Acimec 1% - 0.15ml SC 5 days intervals/ Tab Ivera/Alice (6mg)- 0.3 part.", "6. Vaccination – Rabies – 1st, 7th, 21 days. Tetanus – (ATS+ Ig) –single dose.", "7. Dressing twice daily – H2O2 – 1stOne/Two Days, Povin – Twice daily- 3-5days, Then Once daily.", "8. Spray Frontline – Once Daily or Ectonil(1.5gm/liter water) Spray."], "Last Updated": "8/20/2025", "_id": 85}, {"Name": "Spaying/ General Surgery/ Surgical Wound", "Type": "Skin Diseases", "Animal": "Pet and Companion Animals", "Severity": "Moderate", "Contagion": "✅ Non-Contagious", "Symptoms": "Excessive swelling,  redness,  or bruising at the incision site,  discharge or pus from the incision,  unpleasant odor around the incision,  lethargy for more than a couple of days,  reopening of the incision site can be found in case of infection. If internal bleeding occur,  then wheezing or difficulty breathing,  swollen belly,  blood seeping from the stitches,  pale gums or lethargy can be found.", "Causes": "Surgical Wound", "Treatment Protocol": ["1. Preoperative Preparation", "Patient Optimization: Control diabetes, improve nutrition (adequate protein & vitamins), and manage immunosuppression if possible.", "Skin Preparation: Use antiseptic solutions (chlorhexidine/alcohol-based) to reduce bacterial load.", "Antibiotic Prophylaxis: Administer preoperatively (if indicated) based on surgery type (e.g., contaminated wounds, prosthetic implants).", "2. Intraoperative Care", "Aseptic Technique: Sterile draping, gloves, and instruments to prevent contamination.", "Proper Closure Technique:", "Primary closure (clean wounds, sutures/staples).", "Delayed primary closure (contaminated wounds, closed after 3–5 days).", "Secondary intention (dirty wounds, left open to heal by granulation).", "Drain Placement (if needed): To prevent seroma/hematoma formation.", "3. Postoperative Wound Care", "Dressing Selection:", "Non-adherent dressings (e.g., silicone, hydrocolloid) for closed wounds.", "Antimicrobial dressings (e.g., silver, iodine) for high-risk wounds.", "Negative Pressure Wound Therapy (NPWT) for large/traumatic wounds.", "Wound Inspection:", "Monitor for signs of infection (redness, swelling, purulent discharge, fever).", "Assess for dehiscence (separation of wound edges) or hematoma/seroma.", "Pain Management: Adequate analgesia to promote mobility and healing.", "4. Infection Control & Complication Management", "Surgical Site Infection (SSI) Management:", "Superficial: Antibiotics (e.g., cephalexin) + wound care.", "Deep/organ-space: May require drainage + IV antibiotics (e.g., piperacillin-tazobactam).", "Dehiscence/Evisceration:", "Partial: Local wound care.", "Complete: May require reoperation.", "Necrosis/Ischemia: Debridement + revascularization if vascular compromise.", "5. Parents Education", "Hygiene: Keep wound clean/dry; avoid soaking (e.g., swimming).", "Activity Restrictions: Avoid heavy lifting/strenuous activity to prevent dehiscence.", "Follow-up: Schedule suture/staple removal (usually 7–14 days post-op)."], "Prevention Methods": "Managemental Sugery", "Standard Prescription": ["Cat: 3kgs.", "1. Inj. Acicef-4", "Sig. 0.16 ml, IM, Once Daily for 5 days.", "2. Inj. Phenadryl – 10", "Sig. 0.3ml, IM, Once Daily for 5 days.", "3. Tab. Amantril – 100mg", "1/6 Part feed Orally twice daily for 3 days.", "4. Inj. Sedil-10mg/2ml", "0.3 ml once/ twice daily for light sedation for one-two days.", "5. Inj. Aminovit Plus vte- 20ml", "0.5ml, Once/ twice daily for light sedation for one-two days.", "6. Inj. Acoson - 500mg", "0.25ml, IM, Once daily 5-7 days.", "7. Dressing with Viodin one daily."], "Last Updated": "7/28/2025", "_id": 86}, {"Name": "Stunting Growth", "Type": "Nutritional", "Animal": "Pet and Companion Animals", "Severity": "Moderate", "Contagion": "✅ Non-Contagious", "Symptoms": ["Smaller size compared to littermates or breed standards.", "Weak muscles & bones (fractures,  bowed legs).", "Dull coat,  dry skin,  or hair loss.", "Lethargy & weakness.", "Delayed teething or sexual maturity.", "Potbelly appearance (due to malnutrition or parasites)."], "Causes": ["Chronic malnutrition", "Parasitism", "Infection or hormonal disorders", "Genetic defects"], "Treatment Protocol": ["A. Medical Interventions", "Deworming medications (fenbendazole, pyrantel pamoate).", "Hormone therapy (if hypothyroidism or dwarfism is diagnosed).", "Digestive enzyme supplements (for pets with malabsorption issues).", "B. Nutritional Rehabilitation", "High-calorie, nutrient-dense diets (vet-recommended).", "Supplements (omega-3 fatty acids, probiotics, vitamin/mineral boosts).", "C. Supportive Care", "Controlled exercise to strengthen muscles without overexertion.", "Regular monitoring of weight and development."], "Prevention Methods": ["Adequate nutrition during growth", "Deworming and vaccination", "Monitor growth milestones"], "Standard Prescription": ["1. Dr. PETZ Ultivite Gel:", "2-3gm/kg once daily 15days- 1month.", "2. Tab. Dr. Petz Iromin", "1 tab/10kg, once  twice daily for one month.", "3. Powder. PA Cal-Meat", "Fed with Feed,", "For Dog 2-4 month : 60-150 g 5-12 month: 120 g-450 g For Cat: 1-4 kg body weight: 30 g - 65 g Over 4 kg body weight: 65g - 95 g"], "Last Updated": "7/23/2025", "_id": 87}, {"Name": "Tapeworm Infestation", "Type": "Parasitic Diseases", "Animal": "Pet and Companion Animals", "Severity": "Severe", "Contagion": "⚠️ Contagious", "Symptoms": ["Scooting or dragging rear end.", "Rice-like segments around anus or in feces.", "Mild digestive upset.", "Increased appetite but weight loss.", "Dull,  rough coat.", "May show no signs in mild cases.", "⚠️ Emergency Signs:", "Obstruction (rare but possible in high loads).", "Irritation or infection at the rectal area."], "Causes": ["Flea ingestion,  raw meat,  intermediate host (rodents).", "Flea Ingestion", "Dipylidium caninum is transmitted when pets swallow infected fleas during grooming.", "Intermediate Hosts", "Eating infected rodents,  rabbits,  or livestock offal.", "Feeding Raw Meat", "Raw or undercooked meat containing tapeworm cysts can infect pets.", "Poor External Parasite Control", "Failure to control fleas leads to repeat infections."], "Treatment Protocol": ["Deworming medication:", "Praziquantel (most effective, given orally, by injection, or topically).", "Epsiprantel (also effective against tapeworms).", "Fenbendazole may be used for certain species (e.g., Taenia).", "Flea control: Essential to prevent reinfection, especially for Dipylidium.", "Repeat treatment: Sometimes needed if reinfection occurs."], "Prevention Methods": ["Flea control, hygiene, deworming.", "✅ Maintain strict flea control (fleas carry tapeworms).", "✅ Deworm regularly using appropriate medication.", "✅ Prevent pets from eating raw meat or offal.", "✅ Dispose of feces properly to prevent spread.", "✅ Prevent access to intermediate hosts (rodents).", "✅ Keep the pet’s environment clean and sanitized.", "✅ Treat all pets in the household if infested."], "Standard Prescription": ["1. Tab. Helminthicide L/ Kiwof-", "1Tab @4-10kg, repeat after 5-7 days.", "2. Syp. PA Zinc- 100ml, 3-5ml/ day- 1 month.", "3. Syp. D Iron (1ml @ 10kg)/ Dr. PetZ Iromin- 1/2 Tab @ <10kg, 1 Tab @>10kgs, 1 month"], "Last Updated": "7/28/2025", "_id": 88}, {"Name": "Tetanus", "Type": "Tetanus", "Animal": "Large Animal", "Severity": "Severe", "Contagion": "⚠️ Contagious", "Symptoms": ["Stiff gait,  “sawhorse stance.”", "Lockjaw,  prolapsed third eyelid.", "Hyperesthesia,  muscle spasms,  convulsions."], "Causes": "Wound contamination with C. tetani spores.", "Treatment Protocol": ["Antitoxin administration.", "High-dose penicillin.", "Sedatives, muscle relaxants, quiet housing."], "Prevention Methods": ["Tetanus toxoid vaccination.", "Proper wound hygiene."], "Standard Prescription": ["Antidot\t১। Vaxitet- IG, 1ml (If Sign Outbreak)/  ATS (If sign not outbreaks)", "১ বোতল মাংসে দিবেন ১ বার।", "২. Inj.KT -10ml Vial,  1vial for 50kgs(2/3 Times).", "১ বোতল ৫০ কেজি ওজনের জন্য শিরায় দিবেন, প্রয়োজনে ১২-২৪ ঘন্টা পরপর আবার দিবেন (২-৪ বার)", "৩। Inj. Magsum - 10ml/100ml", "১ মিলি /১০ কেজি ওজনের জন্য ধীরে ধীরে শিরায়/চামড়ার নিচে দিবেন - ১ বার ( খিচুনি না থাকলে লাগবেনা)", "৪।  Inj. Myolax Plus - 1ml /Diazepum - 2ml", "১ বোতল ৫০ কেজি ওজনের জন্য মাংসে দিবেন, প্রয়োজনে ১২-২৪ ঘন্টা পরপর আবার দিবেন (২-৪ বার)"], "Last Updated": "9/13/2025", "_id": 89}, {"Name": "Toxoplasmosis", "Type": "Parasitic Diseases", "Animal": "Pet and Companion Animals", "Severity": "Severe", "Contagion": "⚠️ Contagious", "Symptoms": ["Fever,  weakness,  and lethargy.", "Diarrhea or vomiting.", "Muscle pain or stiffness.", "Breathing difficulty (if lungs are affected).", "Neurological signs (seizures,  incoordination).", "Inflamed eyes (uveitis,  retinitis).", "⚠️ Emergency Signs:", "Severe respiratory distress or sudden paralysis.", "High fever with systemic collapse.", "Cats: Most show no symptoms,  but some may have:", "Fever,  lethargy", "Loss of appetite,  weight loss", "Eye inflammation (uveitis)", "Neurological signs (seizures,  tremors) in severe cases", "Dogs: Rarely show symptoms,  but severe cases may cause:", "Muscle weakness,  respiratory issues", "Neurological or liver disease"], "Causes": ["Protozoan infection,  raw meat,  contaminated feces,  transplacental spread.", "Toxoplasma gondii Parasite", "Intracellular protozoan that infects multiple tissues.", "Fecal-Oral Route", "Ingestion of oocysts shed in cat feces or contaminated soil.", "Raw Meat Consumption", "Tissue cysts in undercooked or raw meat (especially pork,  lamb).", "Vertical Transmission", "From mother to fetus (can cause abortion or birth defects).", "Cats: Become infected by eating raw meat,  prey (rodents,  birds),  or contaminated soil/water containing T. gondii cysts.", "Dogs/Other Pets: Usually get infected by ingesting contaminated meat,  cat feces,  or soil.", "Kittens: Can acquire it congenitally (from an infected mother)."], "Treatment Protocol": ["Cats: Clindamycin @ 5-11mg/kg in general infections, 10-12mg/kg in toxoplasmosis, 12 hoursly, 2-4 weeks. or other antibiotics (sulfadiazine + pyrimethamine).", "Dogs: Similar medications if symptomatic (most don’t require treatment)."], "Prevention Methods": ["Hygiene, avoid raw meat, clean litter boxes.", "✅ Do not feed raw or undercooked meat.", "✅ Clean litter boxes daily (use gloves).", "✅ Wash hands after handling soil, meat, or feces.", "✅ Prevent hunting and eating of prey animals.", "✅ Pregnant women should avoid handling cat litter.", "✅ Keep cats indoors to reduce exposure.", "✅ Regular veterinary check-ups.", "For Cats:", "Feed cooked/commercial food (no raw meat).", "Keep indoors to prevent hunting.", "Clean litter boxes daily (oocysts take 1–5 days to become infectious).", "For All Pets:", "Avoid feeding raw/undercooked meat.", "Wash hands after handling pets or soil.", "For Humans:", "Wear gloves when gardening/cleaning litter.", "Cook meat thoroughly (>160°F/72°C)."], "Standard Prescription": ["Syp. Clindacin - 75mg/5ml, 1ml @6.5kgs, Twice daily. 2-4weeks.", "Inj. Clindacin-300mg/2ml.", "1ml @ 12kgs, Twice daily, 2-4weeks.", "2. Tab. Con - 1/2 -1 tab/ Cat.", "3. Inj. Emiset- 0.1-0.2ml/ kg, twice daily, 5-7 days, as need.", "4. E/D Moxiflox - 2 drops, 4 times daily, 15-20 days.", "5. Syp. Liv-52, 1-3ml @kg, once daily- 15-20 days."], "Last Updated": "7/28/2025", "_id": 90}, {"Name": "Traumatic Injury/ Wound/ Myiasis", "Type": "Accidental Injury", "Animal": "Pet and Companion Animals", "Severity": "Severe", "Contagion": "✅ Non-Contagious", "Symptoms": "Limping,  difficulty moving,  visible wounds,  swelling,  bruising,  behavioral changes (like aggression or withdrawal),  and signs of pain or distress. Other signs include abnormal gum color,  trouble breathing,  loss of consciousness,  and signs of brain injury like seizures or unusual eye movements.", "Causes": "Traumatic Injury", "Treatment Protocol": ["1. Preoperative Preparation", "Patient Optimization: Control diabetes, improve nutrition (adequate protein & vitamins), and manage immunosuppression if possible.", "Skin Preparation: Use antiseptic solutions (chlorhexidine/alcohol-based) to reduce bacterial load.", "Antibiotic Prophylaxis: Administer preoperatively (if indicated) based on surgery type (e.g., contaminated wounds, prosthetic implants).", "2. Intraoperative Care", "Aseptic Technique: Sterile draping, gloves, and instruments to prevent contamination.", "Proper Closure Technique:", "Primary closure (clean wounds, sutures/staples).", "Delayed primary closure (contaminated wounds, closed after 3–5 days).", "Secondary intention (dirty wounds, left open to heal by granulation).", "Drain Placement (if needed): To prevent seroma/hematoma formation.", "3. Postoperative Wound Care", "Dressing Selection:", "Non-adherent dressings (e.g., silicone, hydrocolloid) for closed wounds.", "Antimicrobial dressings (e.g., silver, iodine) for high-risk wounds.", "Negative Pressure Wound Therapy (NPWT) for large/traumatic wounds.", "Wound Inspection:", "Monitor for signs of infection (redness, swelling, purulent discharge, fever).", "Assess for dehiscence (separation of wound edges) or hematoma/seroma.", "Pain Management: Adequate analgesia to promote mobility and healing.", "4. Infection Control & Complication Management", "Surgical Site Infection (SSI) Management:", "Superficial: Antibiotics (e.g., cephalexin) + wound care.", "Deep/organ-space: May require drainage + IV antibiotics (e.g., piperacillin-tazobactam).", "Dehiscence/Evisceration:", "Partial: Local wound care.", "Complete: May require reoperation.", "Necrosis/Ischemia: Debridement + revascularization if vascular compromise.", "5. Parents Education", "Hygiene: Keep wound clean/dry; avoid soaking (e.g., swimming).", "Activity Restrictions: Avoid heavy lifting/strenuous activity to prevent dehiscence.", "Follow-up: Schedule suture/staple removal (usually 7–14 days post-op)."], "Prevention Methods": ["1. Supervise Your Pet", "Outdoors: Keep dogs on a leash during walks to prevent accidents (e.g., running into traffic or aggressive encounters with other animals).", "Indoors: Monitor pets around hazards like open windows, balconies, or stairs (especially for small animals like cats and small dogs).", "2. Pet-Proof Your Home", "Secure heavy furniture and TVs to prevent tipping.", "Keep toxic substances (cleaning products, human medications, certain plants) out of reach.", "Cover electrical cords to prevent chewing.", "Use baby gates to block dangerous areas (e.g., kitchens, staircases).", "3. Safe Transportation", "Use a secured crate or pet seatbelt when driving to prevent injuries in sudden stops or accidents.", "Never let pets ride with their heads out of the window (risk of debris or falling).", "4. Prevent Falls & High-Risk Behaviors", "Cats: Use window screens or restrict access to high balconies to prevent \"\"high-rise syndrome.\"\"", "Avoid letting pets jump from high surfaces (e.g., beds, furniture) repeatedly, which can lead to joint injuries.", "5. Avoid Choking & Intestinal Blockages", "Avoid small toys, bones, or objects that can be swallowed.", "Choose pet-safe chew toys (avoid rawhide or hard bones that can splinter).", "6. Prevent Animal Attacks & Fights", "Spay/neuter pets to reduce aggressive tendencies.", "Supervise interactions with unfamiliar animals.", "Keep pets away from wildlife (e.g., snakes, raccoons).", "7. Weather & Environmental Safety", "Heatstroke prevention: Never leave pets in hot cars; provide shade and water.", "Cold weather: Protect paws from ice and salt; limit time outside in freezing temps.", "Avoid walking pets on hot pavement (can burn paw pads).", "8. Training & Obedience", "Teach commands like \"\"stay,\"\" \"\"come,\"\" and \"\"leave it\"\" to prevent dangerous situations.", "Train dogs to avoid chasing cars or bikes.", "9. Regular Vet Checkups", "Ensure your pet is healthy, as some conditions (e.g., arthritis, vision problems) can increase injury risk.", "Keep vaccinations up-to-date to prevent diseases from fights or bites.", "10. Emergency Preparedness", "Have a pet first-aid kit at home.", "Know the location of the nearest 24-hour emergency vet."], "Standard Prescription": ["Cat: 3kgs.", "1. Inj. Acicef-4", "Sig. 0.16 ml, IM, Once Daily for 5 days.", "2. Inj. Phenadryl – 10", "Sig. 0.3ml, IM, Once Daily for 5 days.", "3. Tab. Amantril – 100mg", "1/6 Part feed Orally twice daily for 3 days.", "4. Inj. Sedil-10mg/2ml", "0.3 ml once/ twice daily for light sedation for one-two days.", "5. Inj. Aminovit Plus vte- 20ml", "0.5ml, Once/ twice daily for light sedation for one-two days.", "6. Inj. Acoson - 500mg", "0.25ml, IM, Once daily 5-7 days.", "7. Dressing with Viodin one daily.", "8. Inj. Acimec-1%", "0.15ml, SC, 7 days intervals. twoo weeks."], "Last Updated": "7/28/2025", "_id": 91}, {"Name": "Urinary Prolapse (Cat: 3 kgs)", "Type": "Metabolic", "Animal": "Pet and Companion Animals", "Severity": "Critical", "Contagion": "✅ Non-Contagious", "Symptoms": ["Visible mass protruding from vulva.", "Licking the area excessively.", "Pain,  restlessness.", "Bleeding from the vulva.", "Shock or collapse in severe cases."], "Causes": ["1. Dystocia (Difficult Birth)", "Excessive straining during labor.", "2. Weak Uterine Support", "Poor uterine tone or muscle weakness.", "3. Retained Placenta or Fetus", "Continued pushing leads to prolapse.", "4. Species Risk", "More common in cattle,  rarely in small animals."], "Treatment Protocol": ["Emergency Veterinary Care is crucial—delay can lead to necrosis (tissue death) or sepsis.", "Manual Replacement (if tissue is viable) – The vet may gently clean and reposition the uterus.", "Surgical Intervention – If the uterus is damaged or cannot be replaced, an ovariohysterectomy (spay) is often performed.", "Supportive Care – IV fluids, antibiotics, pain relief, and calcium (if hypocalcemia is a factor).", "Elizabethan Collar (E-Collar) – To prevent the pet from licking the area."], "Prevention Methods": ["✅ Proper supervision and care during parturition.", "✅ Avoid breeding from animals with history of dystocia.", "✅ Ensure a clean birthing environment.", "✅ Monitor for straining post-delivery.", "✅ Prompt veterinary intervention during difficult births."], "Standard Prescription": ["Cat- 3kg", "1. Inj. Streptopen-2.5gm", "0.30ml, Intra Muscularly, Once daily.", "2.  Powder. PA Cal-Meat", "50gm Daily for one Months.", "3.  Syp. PB E-Se -100ml", "2-3 ml daily for one Months"], "Last Updated": "7/19/2025", "_id": 92}, {"Name": "Urinary Tract Infection (UTI) (Cat: 3Kgs)", "Type": "Bacterial", "Animal": "Pet and Companion Animals", "Severity": "Moderate", "Contagion": "✅ Non-Contagious", "Symptoms": ["Straining to urinate (may be confused with constipation).", "Blood in urine (hematuria).", "Cloudy or strong-smelling urine.", "Licking the genital area excessively.", "Urinating outside the litter box (cats).", "Pain or crying while urinating.", "Lethargy,  fever,  loss of appetite (in severe cases).", "⚠️ Emergency Signs:", "Complete inability to urinate (urinary blockage,  especially in male cats—life-threatening!).", "Vomiting,  extreme lethargy (may indicate kidney involvement). Vomiting,  extreme lethargy (may indicate kidney involvement)"], "Causes": ["Infectionof Urinary Tract,  Bacterial,  Less Water Intake,  Leptospirosis.", "1. Bacterial Infections", "Most UTIs are caused by bacteria entering through the urethra.", "Common bacteria: E. coli,  Staphylococcus,  Proteus,  Klebsiella.", "2. Underlying Health Conditions", "Bladder stones (struvite,  calcium oxalate)", "Diabetes mellitus (increased sugar in urine promotes bacterial growth)", "Kidney disease", "Weakened immune system (due to stress,  illness,  or medication)", "Prostate disease (in male dogs)", "3. Anatomical & Behavioral Factors", "Female pets are more prone due to a shorter urethra.", "Older pets have a higher risk.", "Holding urine for too long (increases bacterial buildup).", "Poor hygiene (dirty litter boxes,  unclean living conditions).", "4. Other Causes", "Fungal infections (rare,  seen in immunocompromised pets).", "Urinary tract tumors.", "Spinal cord issues (affecting bladder control)."], "Treatment Protocol": ["1. Antibiotics", "Common antibiotics: Amoxicillin, Clavamox, Enrofloxacin (Baytril), Cephalexin.", "Treatment duration: Typically 7–14 days (even if symptoms improve early).", "2. Pain & Anti-inflammatory Medications", "Pain relief: Meloxicam, Buprenorphine (for severe discomfort).", "Anti-spasmodics: Prazosin (helps relax the bladder).", "3. Dietary & Supportive Care", "Increased water intake (encourage drinking, wet food, water fountains).", "Prescription urinary diets (e.g., Hill’s c/d, Royal Canin Urinary SO) to prevent crystals/stones.", "Cranberry supplements (may help prevent bacterial adhesion, but not a cure).", "4. Surgery (if needed)", "Bladder stone removal (surgery or dietary dissolution).", "Tumor removal (if cancer is present)."], "Prevention Methods": ["Clean water, hygiene, prevent obesity.", "✅ Provide fresh, clean water daily (encourage hydration).", "✅ Frequent bathroom breaks (don’t let them hold urine too long).", "✅ Clean litter boxes regularly (for cats).", "✅ Balanced diet (avoid excessive magnesium/phosphorus if prone to stones).", "✅ Regular vet check-ups (especially for senior pets).", "✅ Probiotics (may support urinary tract health).", "✅ Weight management (obesity increases UTI risk)."], "Standard Prescription": ["Cat- 3kg", "1. Inj. Acicef-4 (500mg)", "0.20ml, Intra Muscularly, Once daily.", "2. Syrup. Urokit Plus", "3 ml, Twice daily for 15 Days.", "3. Inj. Tracid vet – 10ml", "0.35 ml, Intra Muscularly, Twice Daily (stop if no blood in urine)", "4. Inj. Normasol – 1000ml", "70ml, IV/SC three hourly, if improve then increase interval.", "5. Ammonium Chloride", "UB wash with Normal Saline (5gm+50ml Saline)"], "Last Updated": "7/19/2025", "_id": 93}, {"Name": "Urolithiasis (Cat: 3Kgs)", "Type": "Bacterial", "Animal": "Pet and Companion Animals", "Severity": "Critical", "Contagion": "✅ Non-Contagious", "Symptoms": ["Straining to urinate with little or no output.", "Blood in urine.", "Frequent urination or attempts to urinate.", "Signs of abdominal pain.", "Urine dribbling.", "Licking the genital area.", "Depression, vomiting (if obstruction occurs).", "⚠️ Emergency Signs:", "Complete urinary obstruction—can be fatal without prompt treatment."], "Causes": ["1. Mineral Imbalance in Urine", "High levels of struvite, calcium oxalate, urate, or cystine.", "2. Infection", "Urease-producing bacteria like Staphylococcus and Proteus.", "3. Dietary Factors", "High magnesium, low moisture diets.", "Low water intake or infrequent urination.", "4. Genetic Predisposition", "Common in Dalmatians, Miniature Schnauzers, Bulldogs, etc.", "5. Other Risk Factors", "Urinary pH imbalance.", "Obesity and sedentary lifestyle."], "Treatment Protocol": ["1. Medical Management (for some stone types)", "Struvite Stones:", "Antibiotics (if infection present) + prescription diet (e.g., Hill’s s/d, Royal Canin Urinary SO) to dissolve stones.", "Urate Stones:", "Allopurinol (reduces uric acid) + low-purine diet (e.g., Royal Canin UC).", "Cystine Stones:", "Tiopronin or 2-MPG + alkalinizing diet.", "2. Surgical Removal", "Cystotomy (bladder surgery) for large stones.", "Urethrotomy/Urethrostomy (in cases of obstruction).", "3. Non-Surgical Removal", "Urohydropropulsion (flushing out small stones).", "Laser lithotripsy (breaking stones with laser).", "4. Emergency Care for Obstruction", "Catheterization + IV fluids to relieve blockage.", "Hospitalization for monitoring."], "Prevention Methods": ["✅ Feed prescription or balanced urinary diets.", "✅ Promote water intake (wet food + fountains).", "✅ Avoid high-min
