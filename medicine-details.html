<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Medicine Details &mdash; Reference Catalog</title>
<style>
  :root{
    --ink:#1c2b28;
    --paper:#f6f4ee;
    --panel:#ffffff;
    --line:#dedad0;
    --teal:#1f6f66;
    --teal-deep:#144840;
    --clay:#b5652f;
    --muted:#6b6f6a;
    --highlight:#fce8a8;
    --mono: 'JetBrains Mono', 'Courier New', monospace;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;
    font-family: 'Georgia', 'Iowan Old Style', serif;
    background:var(--paper);
    color:var(--ink);
    display:flex;
    flex-direction:column;
  }
  header{
    padding:22px 28px 16px;
    border-bottom:1px solid var(--line);
    background:var(--panel);
    display:flex;
    align-items:baseline;
    gap:16px;
    flex-wrap:wrap;
  }
  header h1{
    font-family: 'Helvetica Neue', Arial, sans-serif;
    font-weight:700;
    letter-spacing:-0.02em;
    font-size:22px;
    margin:0;
    color:var(--teal-deep);
  }
  header .count{
    font-family: 'Helvetica Neue', Arial, sans-serif;
    font-size:12.5px;
    color:var(--muted);
    text-transform:uppercase;
    letter-spacing:0.08em;
  }
  .layout{
    flex:1;
    display:flex;
    min-height:0;
  }
  .sidebar{
    width:340px;
    min-width:280px;
    border-right:1px solid var(--line);
    background:var(--panel);
    display:flex;
    flex-direction:column;
    min-height:0;
  }
  .search-wrap{
    padding:14px;
    border-bottom:1px solid var(--line);
  }
  .search-wrap input{
    width:100%;
    padding:10px 12px;
    font-size:14.5px;
    font-family: 'Helvetica Neue', Arial, sans-serif;
    border:1.5px solid var(--line);
    border-radius:7px;
    background:var(--paper);
    color:var(--ink);
    outline:none;
    transition:border-color .15s;
  }
  .search-wrap input:focus{ border-color:var(--teal); }
  .search-meta{
    font-family:'Helvetica Neue', Arial, sans-serif;
    font-size:11.5px;
    color:var(--muted);
    margin-top:7px;
    display:flex;
    justify-content:space-between;
  }
  .az-nav{
    display:flex;
    flex-wrap:wrap;
    gap:2px;
    padding:10px 12px;
    border-bottom:1px solid var(--line);
    font-family:'Helvetica Neue', Arial, sans-serif;
  }
  .az-nav button{
    border:none;
    background:none;
    font-size:11.5px;
    font-weight:600;
    color:var(--muted);
    width:20px;
    height:20px;
    cursor:pointer;
    border-radius:4px;
  }
  .az-nav button:hover{ background:var(--highlight); color:var(--ink); }
  .az-nav button.disabled{ color:#cfcbc0; cursor:default; }
  .az-nav button.disabled:hover{ background:none; }
  .list{
    flex:1;
    overflow-y:auto;
    padding-bottom:20px;
  }
  .letter-header{
    position:sticky;
    top:0;
    background:var(--teal-deep);
    color:#fff;
    font-family:'Helvetica Neue', Arial, sans-serif;
    font-size:12px;
    font-weight:700;
    letter-spacing:0.1em;
    padding:5px 14px;
    z-index:2;
  }
  .med-item{
    display:block;
    width:100%;
    text-align:left;
    padding:9px 14px;
    border:none;
    background:none;
    cursor:pointer;
    border-bottom:1px solid #f0eee6;
    font-family: 'Helvetica Neue', Arial, sans-serif;
  }
  .med-item:hover{ background:#f0f6f4; }
  .med-item.active{ background:var(--teal); }
  .med-item.active .med-name{ color:#fff; }
  .med-item.active .med-brand{ color:#dff2ee; }
  .med-name{
    font-size:14px;
    font-weight:600;
    color:var(--ink);
    margin-bottom:2px;
  }
  .med-brand{
    font-size:11.5px;
    color:var(--muted);
  }
  mark{
    background:var(--highlight);
    color:inherit;
    padding:0 1px;
    border-radius:2px;
  }
  .no-results{
    padding:30px 20px;
    text-align:center;
    color:var(--muted);
    font-family:'Helvetica Neue', Arial, sans-serif;
    font-size:13.5px;
  }
  .content{
    flex:1;
    overflow-y:auto;
    padding:36px 48px;
  }
  .welcome{
    max-width:600px;
    margin:60px auto;
    text-align:center;
    font-family:'Helvetica Neue', Arial, sans-serif;
    color:var(--muted);
  }
  .welcome h2{
    color:var(--teal-deep);
    font-family:Georgia, serif;
    font-size:26px;
  }
  .card{ max-width:760px; }
  .card-eyebrow{
    font-family:'Helvetica Neue', Arial, sans-serif;
    text-transform:uppercase;
    letter-spacing:0.12em;
    font-size:11.5px;
    color:var(--clay);
    font-weight:700;
    margin-bottom:6px;
  }
  .card h2{
    font-size:30px;
    margin:0 0 4px;
    color:var(--teal-deep);
    line-height:1.2;
  }
  .card .brand-line{
    font-family:'Helvetica Neue', Arial, sans-serif;
    color:var(--muted);
    font-size:15px;
    margin-bottom:22px;
  }
  .tags{
    display:flex;
    flex-wrap:wrap;
    gap:8px;
    margin-bottom:28px;
  }
  .tag{
    font-family:'Helvetica Neue', Arial, sans-serif;
    font-size:11.5px;
    font-weight:600;
    padding:4px 10px;
    border-radius:20px;
    border:1px solid var(--line);
    color:var(--teal-deep);
    background:#eef6f4;
  }
  .tag.price{ background:#fbeee2; color:var(--clay); border-color:#f0dcc9; }
  dl{ margin:0; }
  .field{
    padding:16px 0;
    border-top:1px solid var(--line);
    display:grid;
    grid-template-columns:180px 1fr;
    gap:20px;
  }
  .field:first-of-type{ border-top:1px solid var(--line); }
  .field dt{
    font-family:'Helvetica Neue', Arial, sans-serif;
    font-size:11.5px;
    font-weight:700;
    text-transform:uppercase;
    letter-spacing:0.07em;
    color:var(--teal);
    padding-top:2px;
  }
  .field dd{
    margin:0;
    font-size:15.5px;
    line-height:1.55;
    color:var(--ink);
  }
  @media (max-width: 760px){
    .field{ grid-template-columns:1fr; gap:4px; }
    .content{ padding:24px 18px; }
    .sidebar{ position:absolute; inset:0; z-index:5; width:100%; }
    .sidebar.hidden{ display:none; }
    .layout{ position:relative; }
    .content.hidden{ display:none; }
    .back-btn{ display:inline-flex !important; }
  }
  .back-btn{
    display:none;
    align-items:center;
    gap:6px;
    font-family:'Helvetica Neue', Arial, sans-serif;
    font-size:13px;
    font-weight:600;
    color:var(--teal);
    background:none;
    border:none;
    cursor:pointer;
    margin-bottom:18px;
    padding:0;
  }
  ::-webkit-scrollbar{ width:9px; }
  ::-webkit-scrollbar-thumb{ background:#d8d3c6; border-radius:5px; }
  ::-webkit-scrollbar-track{ background:transparent; }
</style>
</head>
<body>

<header>
  <h1>Medicine Details</h1>
  <span class="count" id="headerCount">378 entries, A&ndash;Z</span>
</header>

<div class="layout">
  <aside class="sidebar" id="sidebar">
    <div class="search-wrap">

        <span id="clearSearch" style="cursor:pointer; text-decoration:underline; display:none;">clear</span>
      </div>
    </div>
    <nav class="az-nav" id="azNav"></nav>
    <div class="list" id="list"></div>

  <main class="content" id="content">
    <div class="welcome">
      <h2>Veterinary Medicine Reference</h2>
      <p>378 medicines, alphabetically indexed. Search by name, brand, category, or active ingredient &mdash; or browse the A&ndash;Z list on the left.</p>
    </div>
  </main>
</div>

e as a part of multidrug chemotherapy regimens. Gastrointestinal: Autonomic toxicity such as constipation and paralytic ileus are not uncommon and are frequently associated with abdominal cramps. Stool softeners, mild laxatives and enemas may be helpful. A routine prophylactic regimen of laxative and enemas is usually recommended for patients receiving vincristine. Constipation may take the form of upper colon impaction, and on physical examination, the rectum may be empty. Colicky abdominal pain coupled with an empty rectum may mislead the physician. Genitourinary Hyperuricaemia: It may occur in some patients receiving vincristine, especially those with non-Hodgkin's lymphomas or leukaemia. In some patients uric acid nephropathy may result. These effects may be minimised by adequate hydration, alkalinisation of the urine and/or administration of allopurinol. Polyuria, dysuria, and urinary retention due to bladder atony have occurred. Cardiovascular: Hypertension and hypotension have occurred. Chemotherapy combinations that have included Criston, when given to patients previously treated with mediastinal radiation, have been associated with coronary artery disease and myocardial infarction. Causality has not been established. Neurologic: Frequently, there is a sequence to the development of neuromuscular side effects. Initially, only sensory impairment and paraesthesiae may be encountered. With continued treatment, neuritic pain and later, motor difficulties may occur. There have been no reports made of any agent that can reverse the neuromuscular manifestations that may accompany therapy with vincristine. Other: Fever and headache have occurred. Also other side effects include defective sweating, myoclonic jerks, abnormal Vasalva response, impotence and diminished libido. Weight loss has been reported at high doses.", "Contraindications": "Pregnancy Category D. Patient recieves Vincristine should not be breast feed.", "Storage Conditions": "Room Temperature, avoid tis) and skin and soft tissue; intra-abdominal infections (including peritonitis); and in burns and postoperative infections (including postvascular surgery). Clinical studies have shown Kacin also to be effective in serious complicated and recurrent urinary tract infections due to those organisms. Kacin was effective in infections caused by gentamicin and/or tobramycin-resistant strains of Gram-negative organisms, particularly Proteus rettgeri, Providencia stuartii, Serratia marcescens, and Pseudomonas aeruginosa. Kacin has also been shown to be effective in staphylococci infections and may be considered as initial therapy under certain conditions in the treatment of known or suspected staphylococcal disease such as, severe infections where the causative organism may be either a Gram-negative bacterium or a staphylococcus.", "Side Effects": "The adverse effects have been reported with the use of Kacin are tinnitus, vertigo, partial reversible or irreversible deafness, skin rash, drug fever, headache, paraesthesia, nausea and vomiting.", "Contraindications": "Don't Mox with Other Antibiotics, Correct Dehydration and avoid overdose, Care about Hypersensitivity", "Storage Conditions": "Room Temperature, avoid direct sunlight", "Expiry Period": "After two Years of Manufacturing Date", "Safe for Pregnant Animals": "No", "Animal Types": "Pet", "_id": 96}, {"Name": "Inj. KT", "Brand": "Jayson pharmaceutical", "Category": "NSAID", "Composition": "Potassium Chloride 150mg/ml", "Dosage Form": "1ml/5kg", "Strength": "1ml/ 5kg with 50-100 ml Normal Saline", "Pack Size": "10ml ampoule", "Price": "৳-", "Usage Instructions": "PO", "Side Effects": "Bloating nausea heart irregularity drowsiness allergic reactions etc", "Contraindications": "Hypersensitivity to potassium administration marked renal failure acute dehydration metabolic acidosis", "Storage Conditions": "Store below 25°C. Keep protected from light. Keep medicines out of the reach of children. Do not use later than the date of expiry.", "Expiry Period": "2 years of manufacturing date", "Safe for Pregnant Animals": "No", "Animal Types": "Pet", "_id": 97}, {"Name": "Inj. Lincoiven", "Brand": "Nexus Pharma", "Category": "Antibiotic", "Composition": "Lincomycin, Spectinomycin", "Dosage Form": "Livestock: 1-2ml/10 kg b.w. I/M ly 24 hrs for 4 consecutive day", "Strength": "Each ml contains- Lincomycin 50mg. Spectinomycin 100mg", "Pack Size": "50ml,100ml,250ml", "Price": "৳-", "Usage Instructions": "Pneumonia, Respiratory tract infection, Gastroenteritis, Mastitis, Metritis, Hoof disorder, Colibacillosis", "Side Effects": "NO Side effects", "Contraindications": "No contradictions", "Storage Conditions": "Store in cool dry place", "Expiry Period": "36 months", "Safe for Pregnant Animals": "No", "Animal Types": "poultry and diary", "_id": 98}, {"Name": "Inj. Longosona", "Brand": "Longosona injectable suspension", "Category": "Antibiotics, Antifungal with Steroid", "Composition": "-", "Dosage Form": "Bovids (Calves) and Equids: 0.20 to 0.80 ml / 10 kg pv in a single dose. • Repeat, if necessary, 10 14 days after the first administration. • Do not apply concomitant therapy with other corticosteroids. • If there are infectious or parasitic diseases, apply together with specific antibiotics or antiparasitic.", "Strength": "1 mg/mL suspension of dexamethasone isonicotinate.", "Pack Size": "50 mL", "Price": "৳-", "Usage Instructions": "-", "Side Effects": "Immunosuppression (increased risk of infection) Delay in wound healing Gastrointestinal ulceration or digestive upset Changes in metabolism (e.g. elevated glucose) Suppression of endogenous corticosteroid production with prolonged use Electrolyte disturbances (e.g. sodium retention potassium loss) Adverse reactions at injection site (pain swelling) Possible behavioral changes etc.", "Contraindications": "Do not use in animals with known hypersensitivity to dexamethasone or formulation components. Do not use in animals with systemic fungal infections or active tuberculosis. Use with caution in animals with diabetes mellitus hypertension kidney disease peptic ulcers heart disease or those predisposed to infection. Avoid abrupt discontinuation after prolonged use to avoid adrenal insufficiency. In food animals observe withdrawal period strictly to avoid residues in meat. In pregnant or lactating animals careful benefit-risk assessment is needed (corticosteroids can affect reproduction fetal health). Use minimal effective dose for shortest duration possible.", "Storage Conditions": "-", "Expiry Period": "-", "Safe for Pregnant Animals": "No", "Animal Types": "Large Animal", "_id": 99}, {"Name": "Inj. Magical-28", "Brand": "Eskayef Pharmaceuticals Ltd.", "Category": "Vitamins & Minerals", "Composition": "-", "Dosage Form": "Injectable solution", "Strength": "-", "Pack Size": "100 /ml, 250 /ml, and 500 /ml bottles.", "Price": "৳-", "Usage Instructions": "-", "Side Effects": "Do not use in animals with hypermagnesemia. Avoid IV use in toxaemic animals", "Contraindications": "Do not use in animals with hypermagnesemia. Avoid IV use in toxaemic animals", "Storage Conditions": "Store below 30 /°C, away from light and moisture. Keep out of reach of children.", "Expiry Period": "-", "Safe for Pregnant Animals": "No", "Animal Types": "Large animal & Pet", "_id": 100}, {"Name": "Inj. Magsum- IM/IV", "Brand": "Renata Limited", "Category": "Anticonvulsant/ barbiturate", "Composition": "Magnesium Sulfate, 2.5 gm/5 ml", "Dosage Form": "1ml/ 1-2kgs, 50% Solution, IV/IM", "Strength": "Magnesium Sulfate 2.5 gm/5 ml", "Pack Size": "5ml Ample", "Price": "৳-", "Usage Instructions": "Magsum is given initially by intravenous infusion or by intramuscular injection of Magsum sulphate. The intramuscular injection is painful. Plasma magnesium concentration should be measured to determine the rate and duration of infusion and the dose should be reduced in renal impairment. Intravenous administration concentration of magnesium sulphate should not exceed 20%. Dilute 1 part of magnesium sulphate injection 50% with at least 1.5 parts of water for injection. Eclampsia and pre-eclampsia: Magsum sulphate is the drug of choice for the prevention of recurrent seizures in eclampsia, initially by intravenous injection over 5-15 minutes, 4g followed by intravenous infusion, 1g/hour for at least 24 hours after last seizure; if seizure occurs, additional dose of intravenous injection of 2g. (Regimens may vary between hospitals; calcium gluconate injection is used for the management of magnesium toxicity). Arrhythmias: Magsum sulphate has also been recommended for the emergency treatment of serious arrhythmias, especially in the presence of hypokalaemia (when hypomagnesaemia may also be present) and when salvos of rapid ventricular tachycardia show the characteristic twisting wave front known as torsades de pointes. The usual dose of magnesium sulphate by intravenous injection is 8 mmol Mg2+ over 10-15 minutes (repeated if necessary). Myocardial Infarction: Evidence suggesting a sustained reduction in mortality in patients with suspected myocardial infarction given an initial intravenous injection of magnesium sulphate 8 mmol Mg2+ over 20 minutes followed by an intravenous infusion of 65-72 mmol Mg2+ over the following 24 hours, has not been borne out by a larger study. Some, however, continue to hold the view that magnesium is beneficial if given immediately (and for as long as beneficial likelihood of reperfusion taking place). Severe Asthma: Severe asthma may be helped by intravenous infusion of magnesium sulphate 1.2-2g over 20 minutes. Hypomagnesaemia: Since magnesium is secreted in large amounts in the gastro-intestinal fluid, excessive losses in diarrhoea, stoma or fistula are the most common causes of hypomagnesaemia, deficiency may also occur in alcoholism or as a result of treatment with certain drugs. Hypomagnesaemia often causes secondary hypocalcaemia and also hypokalaemia and hyponatraemia.", "Sid uctions": "Eye/Ear/Nasal solution: This is indicated for dry nasal membranes including dry nose resulting from cold and allergy medications. It moistens dry nasal passages from dry climates or from airplane travel, may help dissolve mucus from study noses and clears the nose after surgery. This sterile saline solution is also used to cleanse various parts of the body (wounds, body cavities) and medical equipment (e.g. bandages, catheters, drainage tubes). It is also used as a mixing solution (diluent) for other medications used to irrigate the body (e.g. bacitracin, polymyxin). Intravenous Solution: For instance, in the management of metabolic alkalosis, in case of gastro-enteritis, during and after surgery. It may also be used as a priming fluid for haemodialysis procedures. Normal Saline 0.9% infusion is often used as diluents for infusion of drug additives etc. It is widely used for sterile irrigation and dilution process.", "Side Effects": "Eye/Ear/Nasal: Tell your doctor about your medical history, especially of heart problems (e.g., congestive heart failure), lung problems (pulmonary edema), kidney problems, low levels of potassium (hypokalemia), high levels of sodium (hypernatremia), and any allergies. Intravenous: Serum electrolyte concentration should be carefully monitored. Normal Saline should be administered with caution to patients with congestive heart failure, peripheral or pulmonary oedema, impaired renal function or pre-eclampsia. Care should also be taken when administering Normal Saline intravenously to very young or elderly patients. Excessive administration should be avoided as this may result in hypokalaemia. Infusion of fluid should be immediately discontinued if rigor arises for any reason during its application. Do not use if the solution is cloudy, contains particles, or after expiry date.", "Contraindications": "Do not share this medication with others. Doing so may increase the risk of infection.", "Storage Conditions": "Store below 25°C. const FIELD_ORDER = [
  ["Brand", "Brand"],
  ["Category", "Category"],
  ["Composition", "Composition"],
  ["Dosage Form", "Dosage Form"],
  ["Strength", "Strength"],
  ["Pack Size", "Pack Size"],
  ["Usage Instructions", "Usage Instructions"],
  ["Side Effects", "Side Effects"],
  ["Contraindications", "Contraindications"],
  ["Storage Conditions", "Storage Conditions"],
  ["Expiry Period", "Expiry Period"],
  ["Safe for Pregnant Animals", "Safe for Pregnant Animals"],
  ["Animal Types", "Animal Types"]
];

const listEl = document.getElementById('list');
const azNav = document.getElementById('azNav');
const searchBox = document.getElementById('searchBox');
const resultCount = document.getElementById('resultCount');
const clearSearch = document.getElementById('clearSearch');
const contentEl = document.getElementById('content');
const sidebarEl = document.getElementById('sidebar');

let activeId = null;
let currentFiltered = DATA;

function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function highlight(text, terms){
  if(!terms.length) return escapeHtml(text);
  let escaped = escapeHtml(text);
  terms.forEach(t => {
    if(!t) return;
    const re = new RegExp('(' + t.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ')', 'ig');
    escaped = escaped.replace(re, '<mark>$1</mark>');
  });
  return escaped;
}

function buildAzNav(availableLetters){
  const letters = "ABCDEFGHIJKLMNOPQRSTUVWXYZ".split('');
  azNav.innerHTML = letters.map(L => {
    const has = availableLetters.has(L);
    return `<button data-letter="${L}" class="${has ? '' : 'disabled'}" ${has ? '' : 'disabled'}>${L}</button>`;
  }).join('');
}

function renderList(items, terms){
  if(items.length === 0){
    listEl.innerHTML = '<div class="no-results">No medicines match your search.</div>';
    buildAzNav(new Set());
    return;
  }
  let html = '';
  let lastLetter = null;
  const availableLetters = new Set();
  items.forEach(r => {
    const letter = r.Name.trim()[0].toUpperCase();
    const bucket = /[A-Z]/.test(letter) ? letter : '#';
    availableLetters.add(bucket);
    if(bucket !== lastLetter){
      html += `<div class="letter-header" id="letter-${bucket}">${bucket}</div>`;
      lastLetter = bucket;
    }
    html += `<button class="med-item${r._id === activeId ? ' active' : ''}" data-id="${r._id}">
      <div class="med-name">${highlight(r.Name, terms)}</div>
      <div class="med-brand">${highlight(r.Brand, terms)} &middot; ${highlight(r.Category, terms)}</div>
    </button>`;
  });
  listEl.innerHTML = html;
  buildAzNav(availableLetters);
}

function renderDetail(r){
  activeId = r._id;
  const fieldsHtml = FIELD_ORDER.map(([label, key]) => `
    <div class="field">
      <dt>${label}</dt>
      <dd>${escapeHtml(r[key])}</dd>
    </div>
  `).join('');

  contentEl.innerHTML = `
    <button class="back-btn" id="backBtn">&larr; Back to list</button>
    <div class="card">
      <div class="card-eyebrow">${escapeHtml(r.Category)}</div>
      <h2>${escapeHtml(r.Name)}</h2>
      <div class="brand-line">${escapeHtml(r.Brand)}</div>
      <div class="tags">
        <span class="tag price">${escapeHtml(r.Price)}</span>
        <span class="tag">${escapeHtml(r['Pack Size'])}</span>
        <span class="tag">${escapeHtml(r['Animal Types'])}</span>
        <span class="tag">Pregnant-safe: ${escapeHtml(r['Safe for Pregnant Animals'])}</span>
      </div>
      <dl>${fieldsHtml}</dl>
    </div>
  `;
  document.getElementById('backBtn').addEventListener('click', () => {
    sidebarEl.classList.remove('hidden');
    contentEl.classList.add('hidden');
  });
  // re-render list to reflect active state
  applyFilter(searchBox.value, false);
  contentEl.scrollTop = 0;
  if(window.innerWidth <= 760){
    sidebarEl.classList.add('hidden');
    contentEl.classList.remove('hidden');
  }
}

function applyFilter(query, resetScroll){
  const q = query.trim().toLowerCase();
  const terms = q.length ? q.split(/\s+/).filter(Boolean) : [];
  let filtered;
  if(!q){
    filtered = DATA;
  } else {
    filtered = DATA.filter(r => {
      const hay = (r.Name + ' ' + r.Brand + ' ' + r.Category + ' ' + r.Composition + ' ' + r['Usage Instructions']).toLowerCase();
      return terms.every(t => hay.includes(t));
    });
  }
  currentFiltered = filtered;
  resultCount.textContent = filtered.length + (filtered.length === 1 ? ' medicine' : ' medicines');
  clearSearch.style.display = q ? 'inline' : 'none';
  renderList(filtered, terms);
  if(resetScroll) listEl.scrollTop = 0;
}

listEl.addEventListener('click', (e) => {
  const btn = e.target.closest('.med-item');
  if(!btn) return;
  const id = parseInt(btn.dataset.id, 10);
  const record = DATA.find(r => r._id === id);
  if(record) renderDetail(record);
});

searchBox.addEventListener('input', () => applyFilter(searchBox.value, true));

clearSearch.addEventListener('click', () => {
  searchBox.value = '';
  applyFilter('', true);
  searchBox.focus();
});

azNav.addEventListener('click', (e) => {
  const btn = e.target.closest('button');
  if(!btn || btn.disabled) return;
  const el = document.getElementById('letter-' + btn.dataset.letter);
  if(el) el.scrollIntoView({block:'start'});
});

// keyboard shortcut: '/' focuses search
document.addEventListener('keydown', (e) => {
  if(e.key === '/' && document.activeElement !== searchBox){
    e.preventDefault();
    searchBox.focus();
  }
  if(e.key === 'Escape' && document.activeElement === searchBox){
    searchBox.value = '';
    applyFilter('', true);
  }
});

// initial render
applyFilter('', true);
</script>

</html>
