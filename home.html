<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>All Drugs Directory & Calculator</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,500;0,600;0,700;1,500;1,600&family=Hind+Siliguri:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">

    <style>
        :root {
            --ink: #182620;
            --pine: #1f3b2e;
            --pine-deep: #122019;
            --brass: #b8894b;
            --brass-soft: #e3c496;
            --parchment: #faf7ec;
            --parchment-dim: #f1ead6;
            --border-color: #e2dac0;
            --muted: #786f5c;
            --safe-color: #2f7a4f;
            --safe-bg: #e2f0e5;
            --unsafe-color: #b3261e;
            --unsafe-bg: #fbe7e5;
            --caution-color: #a8721c;
            --caution-bg: #faf0da;
            --shadow: 0 10px 30px -12px rgba(20, 32, 25, .25);
        }

        * { box-sizing: border-box; }

        body {
            font-family: 'Hind Siliguri', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background:
                radial-gradient(1200px 500px at 50% -120px, rgba(184, 137, 75, .12), transparent 60%),
                var(--parchment);
            color: var(--ink);
            margin: 0;
            padding: 28px 20px 60px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        /* মাস্টহেড / লেটারহেড */
        .masthead {
            display: flex;
            align-items: center;
            gap: 20px;
            justify-content: center;
            background: linear-gradient(160deg, var(--pine), var(--pine-deep));
            border-radius: 18px;
            padding: 28px 30px;
            margin-bottom: 30px;
            box-shadow: var(--shadow);
            position: relative;
            overflow: hidden;
        }

        .masthead::after {
            content: "";
            position: absolute;
            left: 24px; right: 24px; bottom: 14px;
            height: 1px;
            background: linear-gradient(90deg, transparent, var(--brass), transparent);
            opacity: .6;
        }

        .seal { flex-shrink: 0; filter: drop-shadow(0 2px 3px rgba(0,0,0,.35)); }

        .masthead-text { text-align: left; }

        h2 {
            font-family: 'Fraunces', serif;
            font-style: italic;
            font-weight: 600;
            font-size: clamp(1.6rem, 3vw, 2.3rem);
            color: #fbf6ea;
            margin: 0 0 4px;
            letter-spacing: .2px;
        }

        .masthead h4 {
            margin: 0;
            font-weight: 400;
            font-size: .78rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: var(--brass-soft);
        }

        .masthead h3 {
            margin: 2px 0 0;
            font-family: 'IBM Plex Mono', monospace;
            font-size: .95rem;
            font-weight: 500;
            color: #ece3d0;
        }

        p.subtitle { color: var(--muted); margin-top: 0; }

        /* ট্যাব নেভিগেশন বার */
        .nav-tabs {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 25px;
            justify-content: center;
        }

        .nav-tabs a {
            text-decoration: none;
            padding: 11px 20px;
            background-color: var(--parchment-dim);
            color: var(--ink);
            font-weight: 600;
            font-size: .92rem;
            border-radius: 10px 10px 4px 4px;
            border: 1px solid var(--border-color);
            border-bottom: 3px solid var(--brass);
            box-shadow: 0 1px 2px rgba(20, 32, 25, .05);
            transition: transform .18s ease, box-shadow .18s ease, background .18s ease;
        }

        .nav-tabs a:hover {
            background-color: #ffffff;
            transform: translateY(-3px);
            box-shadow: 0 8px 16px -8px rgba(20, 32, 25, .35);
        }

        .nav-tabs a.active {
            background-color: var(--pine);
            color: #fbf6ea;
            border-color: var(--pine);
            border-bottom: 3px solid var(--brass);
        }

        .nav-tabs a:focus-visible {
            outline: 2px solid var(--pine);
            outline-offset: 2px;
        }

        /* কন্ট্রোল ও সার্চ ইনপুট */
        .controls {
            display: flex;
            gap: 16px;
            margin-bottom: 25px;
            flex-wrap: wrap;
            background: #ffffff;
            padding: 18px 20px;
            border-radius: 14px;
            border: 1px solid var(--border-color);
            box-shadow: 0 2px 8px rgba(20, 32, 25, .04);
        }

        .control-group {
            flex: 1;
            min-width: 200px;
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .control-group label {
            font-size: .82rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: .6px;
            color: var(--muted);
        }

        .input-field {
            padding: 11px 14px;
            border: 1px solid var(--border-color);
            border-radius: 9px;
            font-size: 15px;
            font-family: inherit;
            outline: none;
            background: var(--parchment);
            transition: border-color .15s, box-shadow .15s;
        }

        .input-field:focus {
            border-color: var(--pine);
            box-shadow: 0 0 0 3px rgba(31, 59, 46, .12);
            background: #ffffff;
        }

        .counter {
            align-self: center;
            font-family: 'IBM Plex Mono', monospace;
            font-weight: 600;
            color: var(--pine);
            background-color: var(--parchment-dim);
            border: 1.5px dashed var(--brass);
            padding: 10px 18px;
            border-radius: 999px;
            white-space: nowrap;
            transform: rotate(-1.5deg);
        }

        /* কার্ড গ্রিড লেআউট */
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
            gap: 20px;
        }

        .card {
            background: #ffffff;
            border-radius: 12px;
            padding: 20px 20px 18px 22px;
            box-shadow: 0 6px 18px -10px rgba(20, 32, 25, .18);
            border: 1px solid var(--border-color);
            border-left: 5px solid var(--brass);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            position: relative;
            overflow: hidden;
            transition: transform .18s ease, box-shadow .18s ease;
        }

        .card::before {
            content: "";
            position: absolute;
            top: 0; right: 0;
            border-width: 0 22px 22px 0;
            border-style: solid;
            border-color: transparent var(--parchment-dim) transparent transparent;
        }

        .card:hover {
            transform: translateY(-3px);
            box-shadow: 0 14px 28px -14px rgba(20, 32, 25, .28);
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 8px;
            gap: 10px;
        }

        .drug-name {
            font-family: 'Fraunces', serif;
            font-weight: 600;
            font-size: 1.18rem;
            color: var(--ink);
            margin: 0;
            padding-right: 18px;
        }

        .badges {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
        }

        .badge {
            padding: 4px 11px;
            border-radius: 999px;
            font-family: 'IBM Plex Mono', monospace;
            font-size: .68rem;
            font-weight: 600;
            letter-spacing: .3px;
            text-transform: uppercase;
            border: 1.5px dashed currentColor;
            white-space: nowrap;
        }

        .badge-safe { background-color: var(--safe-bg); color: var(--safe-color); }
        .badge-unsafe { background-color: var(--unsafe-bg); color: var(--unsafe-color); }
        .badge-caution { background-color: var(--caution-bg); color: var(--caution-color); }

        .company {
            font-size: .85rem;
            color: var(--muted);
            margin-bottom: 12px;
        }

        .info-row {
            margin: 6px 0;
            font-size: .9rem;
            line-height: 1.5;
        }

        .info-label {
            font-weight: 600;
            color: var(--pine);
        }

        .dose-box {
            background-color: var(--parchment-dim);
            border: 1px dashed var(--brass);
            border-radius: 10px;
            padding: 11px 14px;
            margin: 12px 0;
        }

        .dose-value {
            font-family: 'IBM Plex Mono', monospace;
            font-weight: 700;
            color: var(--pine);
            font-size: 1.05rem;
        }

        .indication {
            margin-top: 12px;
            padding-top: 12px;
            border-top: 1px dashed var(--border-color);
            font-size: .87rem;
            color: #3a4238;
        }

        .no-results {
            text-align: center;
            grid-column: 1 / -1;
            padding: 50px 20px;
            color: var(--muted);
            font-family: 'Fraunces', serif;
            font-style: italic;
            font-size: 1.1rem;
        }

        #loading-status {
            color: var(--caution-color);
            text-align: center;
            font-weight: 600;
            padding: 12px;
            background: var(--caution-bg);
            border: 1px dashed var(--caution-color);
            border-radius: 10px;
            display: none;
        }

        @media (max-width: 640px) {
            .masthead { flex-direction: column; text-align: center; padding: 22px 18px; }
            .masthead-text { text-align: center; }
            .control-group { min-width: 100%; }
            .counter { align-self: stretch; text-align: center; }
        }

        @media (prefers-reduced-motion: reduce) {
            * { transition: none !important; animation: none !important; }
        }
    </style>
</head>
<body>

    <div class="container">
        <header class="masthead">
            <div class="seal" aria-hidden="true">
                <svg viewBox="0 0 100 100" width="56" height="56">
                    <circle cx="50" cy="50" r="46" fill="none" stroke="#b8894b" stroke-width="2"/>
                    <ellipse cx="50" cy="63" rx="20" ry="15" fill="#b8894b"/>
                    <ellipse cx="27" cy="39" rx="9" ry="12" fill="#b8894b"/>
                    <ellipse cx="45" cy="27" rx="9" ry="12" fill="#b8894b"/>
                    <ellipse cx="64" cy="27" rx="9" ry="12" fill="#b8894b"/>
                    <ellipse cx="76" cy="40" rx="9" ry="12" fill="#b8894b"/>
                </svg>
            </div>
            <div class="masthead-text">
                <h2>ভেটেরিনারিয়ান’স ডায়েরি</h2>
                <h4> by </h4>
                <h3>ডাঃ মোঃ আসিফ ইকবাল</h3>
            </div>
        </header>

        <!-- ট্যাব নেভিগেশন বার -->
        <nav class="nav-tabs">
            <a href="index.html" class="active">All Drugs</a>
            <a href="small-animals.html">Small or Pet Animal Medicines</a>
            <a href="pregnancy-safe.html">Pregnancy Safe Medicines</a>
            <a href="pet-animal.html">Selective Medicines for Pet Animal</a>
        </nav>

        <div id="loading-status">
            সিস্টেম লোড হচ্ছে, দয়া করে অপেক্ষা করুন...
        </div>

        <div class="controls">
            <div class="control-group">
                <label for="weight">প্রাণীর ওজন (kg):</label>
                <input type="number" id="weight" class="input-field" value="1" min="0.1" step="0.1">
            </div>
            <div class="control-group" style="flex: 2;">
                <label for="search">ওষুধের নাম, উপাদান বা নির্দেশিকা:</label>
                <input type="text" id="search" class="input-field" placeholder="উদাঃ Ceftriaxone, Mastitis...">
            </div>
            <div id="medicineCount" class="counter">মোট: 0 টি ওষুধ</div>
        </div>

        <div id="drugGrid" class="grid">
            <!-- Dynamic Drug Cards Will Be Loaded Here -->
        </div>
    </div>

    <script src="data.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const drugGrid = document.getElementById('drugGrid');
            const weightInput = document.getElementById('weight');
            const searchInput = document.getElementById('search');
            const medicineCount = document.getElementById('medicineCount');

            function render() {
                const weight = parseFloat(weightInput.value) || 0;
                const search = searchInput.value.toLowerCase().trim();

                const filteredDrugs = allDrugs.filter(d => {
                    return d.name.toLowerCase().includes(search) || 
                           d.comp_val.toLowerCase().includes(search) ||
                           (d.ind && d.ind.toLowerCase().includes(search)) ||
                           (d.co && d.co.toLowerCase().includes(search));
                });

                medicineCount.textContent = `মোট: ${filteredDrugs.length} টি ওষুধ`;
                drugGrid.innerHTML = '';

                if (filteredDrugs.length === 0) {
                    drugGrid.innerHTML = `<div class="no-results">কোনো ওষুধ খুঁজে পাওয়া যায়নি।</div>`;
                    return;
                }

                filteredDrugs.forEach(d => {
                    // Calculated Dose
                    let doseDisplay = "";
                    if (d.type === 'c') {
                        const calculated = (d.base * weight).toFixed(2);
                        doseDisplay = `${calculated} ${d.unit}`;
                    } else {
                        doseDisplay = d.inst || 'See Pack';
                    }

                    // Pregnancy Badge Class
                    const pregBadge = d.safe === "Safe" 
                        ? `<span class="badge badge-safe">Pregnancy: Safe</span>` 
                        : `<span class="badge badge-unsafe">Pregnancy: Unsafe</span>`;

                    // Pet Safety Badge Class
                    let petBadgeClass = "badge-unsafe";
                    if (d.pet === "Safe" || d.pet === "Highly Safe") {
                        petBadgeClass = "badge-safe";
                    } else if (d.pet.includes("Caution")) {
                        petBadgeClass = "badge-caution";
                    }
                    const petBadge = `<span class="badge ${petBadgeClass}">Pet: ${d.pet}</span>`;

                    const card = document.createElement('div');
                    card.className = 'card';
                    card.innerHTML = `
                        <div>
                            <div class="card-header">
                                <h3 class="drug-name">${d.sl}. ${d.name}</h3>
                            </div>
                            <div class="badges" style="margin-bottom: 8px;">
                                ${pregBadge}
                                ${petBadge}
                            </div>
                            <div class="company">কোম্পানি: ${d.co} | প্যাক: ${d.pack}</div>
                            
                            <div class="info-row">
                                <span class="info-label">উপাদান:</span> ${d.comp_val}
                            </div>
                            
                            <div class="dose-box">
                                <div class="info-label" style="font-size: 0.8rem; color: #b8894b;">হিসাবকৃত মাত্রা (${weight} kg এর জন্য):</div>
                                <div class="dose-value">${doseDisplay}</div>
                            </div>

                            <div class="info-row">
                                <span class="info-label">স্ট্যান্ডার্ড ডোজ:</span> ${d.mgkg}
                            </div>
                            
                            <div class="indication">
                                <span class="info-label">নির্দেশনা:</span> ${d.ind}
                            </div>
                        </div>
                    `;
                    drugGrid.appendChild(card);
                });
            }

            // Real-time calculation and search listener
            weightInput.addEventListener('input', render);
            searchInput.addEventListener('input', render);

            // Initial render
            render();
        });
    </script>
</body>
</html>
